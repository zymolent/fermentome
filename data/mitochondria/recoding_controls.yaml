# Published recoding controls: the reference artifacts the recoder is judged against.
#
# WHY THIS FILE EXISTS. PLAN.md Q's phase-0 acceptance ends "the recoder round-trips a known
# mitochondrial gene and reproduces the published recoded marker sequence for a control". Every
# other phase-0 clause passed; this one had never run, because the control is ARG8m and the
# warnings audit at docs/drafts/warnings/PLAN.yaml line 2387 established that no paper in the
# stored corpus prints its nucleotide sequence -- only the fact of it ("ARG8m differs from nuclear
# ARG8 in its sequence to accommodate for differences in the genetic code of yeast mitochondria",
# doi:10.1091/mbc.e16-11-0775). That audit's own instruction was to fetch the sequence from
# GenBank, and to add the fetch to the phase-0 task list because "an acceptance criterion whose
# reference artefact has not been acquired cannot be met". This file is that fetch.
#
# WHAT IS HERE. Three published sequences, each carrying the accession that makes it evidence:
# the cox3::ARG8m fusion CDS exactly as GenBank annotates it (U31093.1 614..1912, the record's own
# /transl_table=3), the ARG8m ORF alone (U31093.1 641..1912), and the nuclear ARG8 CDS it was
# recoded from (NM_001183394.1, YOL140W). The last two are both 1,272 nt, so the comparison below
# is strictly positional -- no alignment, and therefore nothing to get wrong in the alignment.
#
# THE FINDING, recorded here because surfacing it is the entire point of the criterion:
# THE RECODER DOES NOT REPRODUCE ARG8m CODON-FOR-CODON, and the disagreement is a difference of
# policy, not an error.
#   * The protein matches exactly. recode(ARG8, source_table=1, mode="to_table3") encodes the same
#     423 residues plus stop that published ARG8m encodes under table 3 -- which is NP_014501.1,
#     and also residues 10-432 of AAC53660.1.
#   * The codons match at 218 of 424 positions (51.4%; 1,046 of 1,272 nt, 82.2%). All 206
#     differences are synonymous under table 3, and at all 206 the PUBLISHED codon is itself
#     inside the recoder's own accepted candidate set. There is no position at which the two
#     disagree about meaning or legality -- only about preference.
#   * The cause is `recode`'s deliberate "keep the original codon when it is already acceptable"
#     rule (src/fermdb/recode.py): it performs a MINIMAL recode, changing 20 of 424 codons -- the
#     12 CUN (Leu under table 1, Thr under table 3), the 6 ATA (Ile/Met) and the 2 CGA/CGC absent
#     from native yeast mtDNA. Steele/Butler/Fox instead re-optimized the whole ORF to the
#     mitochondrial codon bias, which is why their AT content is 69.3% against the recoder's
#     61.2% and the nuclear gene's 59.7%.
#   * So the two are not interchangeable, and a test asserting equality would be wrong. The test
#     asserts the census below instead: change the recoder's ranking policy and these numbers
#     move, and someone has to come and explain why. See tests/test_recode.py.
#
# A SECOND FINDING, about the published marker rather than the recoder: ARG8m IS NOT DUAL-SAFE.
# It carries two internal TGA codons (tryptophan at ORF codons 168 and 258), which are stop codons
# under table 1 -- so the published marker would truncate at residue 167 if it were ever
# translated on cytosolic ribosomes. `recode(..., mode="dual_safe")` refuses exactly those two
# codons and `check_compartment_safety` flags them. That is a real, checkable property of a real
# published artifact, and it is the concrete case behind genetic_code.py's insistence that the
# code follows the genome that carries the gene.
#
# PROVENANCE OF THE FIELDS. `sequence` is the record's ORIGIN block over the stated region,
# uppercased, with the line wrapping removed. `protein` is the record's own /translation
# qualifier VERBATIM (no terminator character), never this project's own translation of the
# nucleotides -- otherwise the acceptance test would be checking `translate` against itself
# instead of against NCBI's curators. `checksum_sha256` is sha256 over the uppercase whitespace-
# free ASCII sequence, and `load_recoding_controls` verifies it on every read: a sequence edited
# in place here fails loudly rather than silently changing what the acceptance test means.
#
# Curation conventions (docs/reference/CONVENTIONS.md "Curation"): every entry carries `evidence`
# and `confidence` from the closed set. Zone R throughout -- exactly what NCBI Nucleotide
# returned, never a curator's or a model's reading of it.

