# The measured census of `recode(arg8_nuclear_cds, source_table=1, mode="to_table3")` against
# `arg8m_orf`. Recorded so the acceptance test asserts a specific, explained disagreement rather
# than a loose inequality -- and so a future change to the recoder's codon ranking has to come
# past these numbers rather than around them.
comparison:
  input: arg8_nuclear_cds
  expected: arg8m_orf
  mode: to_table3
  total_codons: 424
  identical_codons: 218
  differing_codons: 206
  # Every difference is a synonym swap under table 3; not one changes the encoded residue.
  synonymous_differences: 206
  # ...and at every differing position the PUBLISHED codon is one the recoder would itself accept.
  published_codon_acceptable_to_recoder: 206
  identical_nucleotides: 1046
  total_nucleotides: 1272
  # Codons the recoder changes relative to its nuclear input: the 12 CUN, 6 ATA and 2 CGA/CGC.
  codons_changed_from_input: 20
  at_fraction_input: 0.5967
  at_fraction_recoded: 0.6124
  at_fraction_published: 0.6934
  # Table-dependent codon counts, for running the compartment-safety gate on real sequences
  # rather than on the synthetic "ATG + CTG*6 + TAA" the gate was originally written against.
  nuclear_cun_codons: 12
  nuclear_ata_codons: 6
  nuclear_absent_in_mito_codons: 2
  published_cun_codons: 0
  published_internal_tga_codons: 2
  published_internal_tga_positions: [168, 258]   # 1-based codon positions in arg8m_orf
  published_absent_in_mito_codons: 0
  reproduces_exactly: false
  explanation: >-
    The recoder performs a minimal, meaning-preserving recode; the published marker is a full
    codon re-optimization to the mitochondrial bias. Same protein, same legality under table 3,
    different codon preferences at 206 synonymous positions. The recoder is not wrong here, but
    neither is it a reimplementation of Steele/Butler/Fox 1996, and this atlas should not claim
    that it is.
