# The ethanol reference layer - the admitted records (PLAN.md B.3, phase 2).
#
# WHAT THIS FILE IS. The 24 publications admitted into the capped ethanol layer, each with the
# criterion it was admitted under, the verbatim quotes that justify the admission and their
# character offsets into the stored full text. It is the repo-tier, committed source of truth for
# the layer: the database is derived tier (~/fermdb-data, rebuildable), so a criterion that lived
# only in `screening_record` would not survive a rebuild, and the quotes, the transfer rationales
# and the evidence ceilings have no column anywhere in the schema at all.
#
# WHAT THE DATABASE HOLDS INSTEAD. One fact per record: `screening_record.admitted_criterion`,
# with `review_state='accepted'` and `triage_state='included'`. That column carries the CHECK
# constraints that make the criterion real - `admitted_criterion IN ('E1'..'E6')` and
# `admitted_criterion IS NULL OR product_tier = 'ethanol'` - and it is what `budget_status`,
# `unspent_report`, `validate_admission` and `fermdb literature ethanol status` read. Install this
# file into a database with `fermdb literature ethanol install`.
#
# WHAT HAS NOT HAPPENED, AND IS THE OWNER'S. `verified` is false on all 24 and `confidence` is
# 'unverified' on all 24; tests/test_ethanol_admission.py fails the day that changes by accident.
# Nothing in the re-tagging proposals of docs/drafts/ethanol/PHASE2_STATUS.md section 5 is applied
# beyond the admissions themselves, and the picks remain a curation proposal: the slots document
# says the agent shortlists and the owner chooses.
#
# AMENDED 2026-09-22 - SLOT 6, THE LAYER'S FIRST E5 ADMISSION. The 24th record,
# `doi:10.1016/j.mec.2024.e00245`, is the owner's pick from the eight-candidate re-run in
# `docs/drafts/ethanol/slot6_E5_redox_shuttle_rerun.yaml`, where it is rank 1; the other seven were
# not picked. It moves E5 from 0 to 1 of 45. It is admitted for a CONDITIONAL and ADVERSE result -
# cytosolic Pos5 helps on glucose, stops helping past ~24 h, and goes net negative alongside ZWF1* -
# which is a prediction against DUET's own architecture (G.8), not for it. Its Pos5 is CYTOSOLIC,
# no cofactor is measured in it, and its two load-bearing numbers are cited rather than measured;
# all three are on the record in `what_it_lacks` and in `evidence_ceiling`, which caps it at L3.
#
# DO NOT HAND-EDIT THE OFFSETS. They are 0-based half-open [char_start, char_end) into the text
# `fermdb.extract.harness.load_source_text` returns for that publication_id, and they were
# re-resolved against the `fulltext_asset` store - NOT against the corpus cache, which is a
# different text with different offsets and which is how two quotes in an earlier draft came to
# cite a paper they do not occur in.

