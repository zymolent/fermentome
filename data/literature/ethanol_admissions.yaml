# The ethanol reference layer - the admitted records (PLAN.md B.3, phase 2).
#
# WHAT THIS FILE IS. The 24 publications admitted into the capped ethanol layer, each with the
# criterion it was admitted under, the verbatim quotes that justify the admission and their
# character offsets into the stored full text. It is the repo-tier, committed source of truth for
# the layer: the database is derived tier (~/fermdb-data, rebuildable), so a criterion that lived
# only in `screening_record` would not survive a rebuild, and the quotes, the transfer rationales
# and the evidence ceilings have no column anywhere in the schema at all.
#
# WHAT THE DATABASE HOLDS INSTEAD. One fact per record: `screening_record.admitted_criterion`,
# with `review_state='accepted'` and `triage_state='included'`. That column carries the CHECK
# constraints that make the criterion real - `admitted_criterion IN ('E1'..'E6')` and
# `admitted_criterion IS NULL OR product_tier = 'ethanol'` - and it is what `budget_status`,
# `unspent_report`, `validate_admission` and `fermdb literature ethanol status` read. Install this
# file into a database with `fermdb literature ethanol install`.
#
# WHAT HAS NOT HAPPENED, AND IS THE OWNER'S. `verified` is false on all 24 and `confidence` is
# 'unverified' on all 24; tests/test_ethanol_admission.py fails the day that changes by accident.
# Nothing in the re-tagging proposals of docs/drafts/ethanol/PHASE2_STATUS.md section 5 is applied
# beyond the admissions themselves, and the picks remain a curation proposal: the slots document
# says the agent shortlists and the owner chooses.
#
# AMENDED 2026-09-22 - SLOT 6, THE LAYER'S FIRST E5 ADMISSION. The 24th record,
# `doi:10.1016/j.mec.2024.e00245`, is the owner's pick from the eight-candidate re-run in
# `docs/drafts/ethanol/slot6_E5_redox_shuttle_rerun.yaml`, where it is rank 1; the other seven were
# not picked. It moves E5 from 0 to 1 of 45. It is admitted for a CONDITIONAL and ADVERSE result -
# cytosolic Pos5 helps on glucose, stops helping past ~24 h, and goes net negative alongside ZWF1* -
# which is a prediction against DUET's own architecture (G.8), not for it. Its Pos5 is CYTOSOLIC,
# no cofactor is measured in it, and its two load-bearing numbers are cited rather than measured;
# all three are on the record in `what_it_lacks` and in `evidence_ceiling`, which caps it at L3.
#
# AMENDED 2026-09-22 - THE LAYER IS FILLED TO ITS MEASURED CEILING, AND THE CEILING IS NOT THE CAP.
# Sixteen further records take the layer from 24 to 40. Four independent passes put the honestly
# admissible total at ~45-65 against a cap of 150, and this pass admits everything the six slot
# shortlists actually name, which is 40. The remaining distance to ~45-65 is NOT refusal and NOT
# scarcity: it is that the shortlists stopped where they stopped. Per criterion:
#
#   E5  1 -> 5   ranks 2-5 of the slot-6 re-run. Rank 2 `doi:10.1186/s13068-023-02309-z` is the
#                COMPARTMENT-CORRECT record the layer was missing - native, matrix-resident Pos5
#                overexpressed against a matrix-targeted NADPH sink in CEN.PK - and it covers the
#                half rank 1 cannot, because rank 1's Pos5 has its targeting sequence deleted and
#                is cytosolic. Ranks 3-5 are ADH3 localisation, pos5-delta consequences and the
#                ADH3 transcript time course. Realistic ceiling ~5-8; this stops at 5 and does not
#                pad. Ranks 6-8 stay unadmitted candidates, not rejections.
#   E1  3 -> 6   the slot-2 runners-up. E1 remains ACQUISITION-BLOCKED - 17 readable of 69, 52 on
#                the manual download queue - and that is a finding about institutional access, not
#                about the literature. `doi:10.1016/j.meteno.2016.01.002` is still refused with
#                `wrong_tier` and is still the record the criterion most needs.
#   E2  3 -> 7   the four candidates slot 5 filed under `pool_notes_not_shortlisted`.
#   E3  3 -> 4   only one. Slot 1's own runners-up are each rejected there with a stated reason -
#                a test-tube anaerobiosis, a hydrolysate-only study, a re-analysis of other
#                laboratories' data - and admitting them would lower the standard the whole layer
#                is read against. Four is what the pool supports at chemostat-adjacent grade.
#   E4  11       unchanged. `doi:10.1016/j.fm.2023.104288` was read for the twelfth place and not
#                admitted: lager yeast plus a dipeptide supplement is not a transferable mechanism.
#   E6  3 -> 7   the four strongest of slot 7's `not_shortlisted_but_notable`.
#
# EVERY ONE OF THE 46 NEW SPANS WAS SLICED OUT OF THE `fulltext_asset` STORE at its recorded
# offsets through `load_source_text` and re-checked with `verify_span` - 46 of 46 exact, each
# unique in its source, none transcribed and none spliced. `verified` is still false and
# `confidence` still 'unverified' on all 40; promotion remains a curator act and was not performed.
#
# DO NOT HAND-EDIT THE OFFSETS. They are 0-based half-open [char_start, char_end) into the text
# `fermdb.extract.harness.load_source_text` returns for that publication_id, and they were
# re-resolved against the `fulltext_asset` store - NOT against the corpus cache, which is a
# different text with different offsets and which is how two quotes in an earlier draft came to
# cite a paper they do not occur in.

version: 1
installed: '2026-09-22'
source_draft: docs/drafts/ethanol/phase2_admissions.yaml
zone:
  quotes: R
  rows_written: H
  gaps: I
status: INSTALLED as a curation proposal, not as a ratified layer. `verified` is false on every record
  and `confidence` is 'unverified' on every record. Promoting one means a curator reading the quote
  and flipping the bit (PLAN.md L.5, decision D2); this file does not do it and the loader refuses to.
quote_policy: Every quote is a contiguous verbatim span of the stored full text for that publication_id,
  taken through fermdb.extract.harness.load_source_text. No ellipses, no splicing of non-adjacent sentences,
  no paraphrase inside quote marks. Hyphenation, ligatures, line breaks and PDF extraction artefacts
  are reproduced exactly, because cleaning them would break the offsets. Offsets are 0-based half-open
  [char_start, char_end).
span_verification:
  re_verified: '2026-09-22'
  against: fulltext_asset store, via fermdb.extract.harness.load_source_text
  checked_with: fermdb.llm.validate.verify_span
  spans_in_this_file: 106
  re_resolved_exact: 106
  absent: 0
  spliced: 0
  note: 'Three groups. (1) The first 53 are the 2026-09-21 phase-2 admissions; the draft''s headline
    of 63 covers those plus the 10 basis quotes on the re-tagging proposals, which stay in the draft
    because nothing is re-tagged here beyond the admissions themselves, and which were 10 of 10 exact
    in the same pass. (2) The next 7 are the slot-6 E5 rank-1 admission added 2026-09-22. (3) The last
    46 are the sixteen records added later on 2026-09-22 to fill the layer to its measured ceiling.
    Groups 2 and 3 were SLICED out of the fulltext_asset store at their recorded offsets through
    load_source_text and re-checked with verify_span - 7 of 7 and 46 of 46 exact, each unique in its
    source, none transcribed and none spliced. Three quotes in group 1 occur more than once in their
    source (repeated data-availability statements); they are exact but not positionally unique, and the
    recorded offset is the first occurrence. Every span in groups 2 and 3 is positionally unique.'
caps:
  publication_cap: 150
  measurement_study_cap: 60
  publications_admitted_here: 40
  measurement_bearing_admitted_here: 39
budget_position:
- criterion: E5
  budget: 45
  admitted_here: 5
  unspent: 40
  why_unspent: Not scarcity of papers but scarcity of MEASUREMENTS. Five passes now agree that no paper
    measures a matrix NAD(P)H pool or ratio in living S. cerevisiae under a named condition; the realistic
    ceiling against B.3.5's wider admitted list is ~5-8 qualitative records and this is 5. Ranks 6-8
    of the slot-6 re-run remain unadmitted candidates, not rejections.
- criterion: E6
  budget: 25
  admitted_here: 7
  unspent: 18
  why_unspent: Genuinely thin once off-target organisms and bare QTL mapping are removed (B.3.6). Of
    57 corpus documents naming Ethanol Red, one sequences it and none tests why it performs as it does.
- criterion: E1
  budget: 25
  admitted_here: 6
  unspent: 19
  why_unspent: ACQUISITION, NOT SCARCITY. 17 of 69 tagged publications are readable; 52 sit on the manual
    download queue (25 paywalled, 14 licence-forbidden, 11 no PDF found). The founding characterisations
    of the pdc1/pdc5/pdc6 phenotype are cited by almost every candidate and readable in none. Unspendable
    by construction until the queue is worked.
- criterion: E2
  budget: 20
  admitted_here: 7
  unspent: 13
  why_unspent: The slot-5 shortlist named seven admissible candidates in total and all seven are admitted.
    Its own read of the readable pool was 12-15 admissible, so the remaining 5-8 are NOT refusals - they
    are papers the shortlist never got to. Re-running slot 5's triage over the 267-publication readable
    pool is the action that would spend them, and it is a shortlist task rather than a curation one.
- criterion: E3
  budget: 20
  admitted_here: 4
  unspent: 16
  why_unspent: The chemostat/carbon-balance standard is rare - 'chemostat' appears in 6 of the 91 pool
    full texts and more than once in 2 of them. Slot 1's remaining runners-up are each rejected there
    with a stated reason, and admitting them would set the standard the rest of the layer is read against
    too low. Four is close to everything in the readable pool that meets the bar.
- criterion: E4
  budget: 15
  admitted_here: 11
  unspent: 4
  why_unspent: The one criterion the 127-PDF delivery materially fixed, and it is now at its admissible
    ceiling. 15 further E4-tagged papers are on the download queue. doi:10.1016/j.fm.2023.104288 was
    read for a twelfth place and not admitted - lager yeast plus a dipeptide supplement is a nutritional
    intervention, not a transferable mechanism, and B.3.4 would have no argument to make for a C4 alcohol.
