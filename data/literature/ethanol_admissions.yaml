open_gaps:
- gap: matrix NAD(P)H pool size and NAD(P)H/NAD(P)+ ratio in living Saccharomyces cerevisiae, measured
    compartment-resolved under a named growth condition
  kind: never_attempted
  status: open
  compartment: mitochondrial_matrix
  confidence: medium
  note: |-
    WHAT IS MISSING. Not the identity of the matrix NADPH sources - Pos5, Ald4/Ald5, Idp1 and Mae1 are qualitatively known (benchmark BM-COF-005) - but the QUANTITY, in a live cell, in the compartment. No paper in the readable corpus measures a matrix NAD(P)H pool or an NAD(P)H/NAD(P)+ ratio in living S. cerevisiae under any named condition. It is recorded as 'never_attempted' rather than 'quantitative_value_missing' because the searches did not find a measurement whose value went unreported; they found that the experiment has not been done.

    THE EXPERIMENT THIS NAMES, stated so that it can be costed and run. Express a genetically encoded, matrix-targeted NAD(P)H biosensor - SoNar for free NADH/NAD+ and iNap1 for NADPH - each behind a cleavable matrix presequence (Su9 or the Cox4 presequence), with the redox-insensitive control construct (cpYFP) co-run in every condition, because both sensor families report pH as well as redox and the matrix pH moves with the respiratory state. Backgrounds: CEN.PK113-7D as the defined-medium reference and Ethanol Red (GCA_029255905.1) as the industrial proxy, plus a pos5-delta and a POS5-overexpressing derivative of CEN.PK113-7D - the hypothesis under test is G.8's POS5-capacity bottleneck, and it is only testable against a pool that has been perturbed in both directions. Conditions, all on Verduyn defined medium at pH 5.0 and 30 C in chemostat at one fixed dilution rate so the readings are comparable: (i) anaerobic glucose-limited, the regime DUET runs in; (ii) aerobic glucose-limited, as the respiratory contrast; (iii) aerobic ethanol-limited, the state in which Adh3 is actually carrying flux and the matrix NADH pool is being fed, which is B.3.5's own statement of the E5 question. Read out ratiometrically in live cells, per background and per condition, with the cpYFP control subtracted.

    WHAT THE CORPUS ALREADY SUPPLIES, AND WHAT IT DOES NOT. The only compartment-targeted live-cell redox method anywhere in the corpus is doi:10.1016/j.xpro.2020.100160, a mito-roGFP protocol - and it reports the GLUTATHIONE redox potential, not the NAD(P)H pool. It therefore supplies the targeting, imaging and calibration practice but not the measurement: an NAD(P)H sensor has to be added to that protocol rather than the protocol reused as it stands. That is the whole distance between what exists and what is needed.

    WHY IT MATTERS. DUET's redox architecture is load-bearing on matrix reducing-equivalent supply, and phase 3.5's decision checkpoint has to weigh G.8's POS5-capacity bottleneck hypothesis. Both currently rest on no measured quantity in the compartment they are about. It is also why criterion E5's 45-publication budget stands unspent: the budget was sized for a literature that would supply a quantitative anchor, and that literature does not have one to supply. The atlas can record the absence honestly or it can commission the measurement; it cannot read it out of the corpus.
  evidence: 'Four independent passes over the readable ethanol corpus agree that no such measurement
    exists: (1) the slot-6 shortlist pass, 2026-09-21; (2) benchmark BM-COF-005''s corpus evidence pass,
    2026-09-21 (data/benchmarks/known_positives.yaml; verdict partially_supported - the sources are
    known, the quantity is not); (3) the 127-PDF corpus triage, 2026-09-21; (4) the phase-2 admission
    pass, 2026-09-21 (docs/drafts/ethanol/PHASE2_STATUS.md section 3a), which scanned all 141 readable
    E5-tagged publications for six core terms - ADH3, POS5, NAD(H) kinase, the ethanol-acetaldehyde
    shuttle, matrix NADPH, matrix NADH - and found 97 with none of them, then scanned all 668 readable
    ethanol-criterion publications for compartment-resolved cofactor measurement. Three documents matched
    measurement-shaped language and all three are narrative background rather than measurement: doi:10.1534/g3.118.200677
    (speculating about NADH/NAD+ rebalancing), doi:10.1128/aem.00362-26 (an introduction stating that
    Adh3 balances the matrix NAD+/NADH ratio) and doi:10.1371/journal.pone.0111585 (ROS).'
