  - id: gpd1_gpd2_native
    step_role: cofactor_cycle
    source_organism: "Saccharomyces cerevisiae"
    genes: [GPD1, GPD2]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    oxygen_sensitivity: unknown
    evidence: >-
      NEW 2026-09-22, and read rather than recalled; RE-SLICED the same day (see the header note).
      The reaction, the cofactor and the EC number are one sentence of 10.1016/j.synbio.2021.12.010:
      anaerobic S. cerevisiae cultures "rely on NADH-dependent reduction of the glycolytic
      intermediate dihydroxyacetone-phosphate to glycerol-3-phosphate, in a reaction catalysed by
      NAD+-dependent glycerol-3-phosphate dehydrogenase (Gpd1, Gpd2, EC 1.1.1.8 [,])". That matches
      the curated `gpd_glycerol3p` reaction in ethanol_reference.yaml term for term, which is what
      lets the enumerator resolve this part to that reaction by gene symbol. The `[,]` is an empty
      citation marker the JATS-to-text conversion leaves behind; deleting it is what made the
      earlier copy of this quote not a span, so it stays.

      IT IS A SINK FOR REDUCING POWER, NOT A SOURCE, and that is the point of curating it. The same
      paper: "due to the essential role of glycerol formation in NADH redox-cofactor balancing in
      non-respiratory cultures, double deletion of GPD1 and GPD2 prevents anaerobic growth". What
      Gpd regenerates is the OXIDISED member of the couple -- the NAD+ glycolysis needs -- so in a
      balance that counts reducing equivalents it deepens the shortfall rather than closing it. A
      "cofactor cycle" is not free reducing power, and this entry is the file's worked example of
      that.

      IT IS ALSO A REAL ISOBUTANOL INTERVENTION, in this atlas's own corpus:
      10.1186/s13068-019-1486-8 reports that "deletion of glycerol-3-phosphate dehydrogenase genes
      GPD1 and GPD2 prevented formation of glycerol and increased isobutanol production up to
      1.32 g/L". Note the direction: the published move is to DELETE this part, not to add it. The
      enumerator can express both, because it offers the part rather than asserting it.

      native_compartment IS THE WEAKEST FIELD HERE AND IS FLAGGED AS SUCH. The atlas's curated
      reaction places it in the cytosol and the substrate is a glycolytic intermediate, but the
      corpus does not support a single clean answer for the pair: 10.1093/femsyr/foac007 states
      "Gpd1 is mainly located in peroxisomes and Gpd2 in the cytosol and in mitochondria". So
      'cytosol' is right for Gpd2 by quotation and is the curated reaction's compartment; it is not
      a claim that all Gpd protein is cytosolic, and a route that turned on this part's
      localisation should read that sentence first. The two genes are kept as ONE part because
      every source quoted above treats them as one activity and deletes them together.

      NOT RECORDED, DELIBERATELY. oxygen_sensitivity is 'unknown': nothing in the corpus states it.

      CONFIDENCE 'medium', not 'high': three papers quoted, one of them a review, none of them a
      measurement made or checked here -- and one field ('cytosol') where two of the sources do not
      fully agree, said out loud rather than smoothed over.
