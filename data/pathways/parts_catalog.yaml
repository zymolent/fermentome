  - id: adh3_native
    step_role: cofactor_cycle
    source_organism: "Saccharomyces cerevisiae"
    genes: [ADH3]
    native_compartment: mitochondrial_matrix
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    oxygen_sensitivity: unknown
    evidence: >-
      RE-GROUNDED 2026-09-22 against the stored corpus, and RE-SLICED the same day -- including the
      ONE ELLIPSIS SPLICE the provenance sweep found in this repo's promoted data, which was in the
      sequence_encoding_genome paragraph below. See the header note.
      10.1128/aem.00362-26 gives the compartment
      and the job in one sentence -- "Adh3 is located in the mitochondrial matrix, where it plays a
      role in anaerobic balancing of the NAD+/NADH ratio" -- and the cofactor two sentences
      earlier, surveying the family: "The S. cerevisiae genome harbors seven ADH-encoding genes, of
      which Adh1-5 are NAD+-dependent, while Adh6 and Adh7 are NADP+-dependent enzymes with very
      low activities towards ethanol". Adh3 is one of Adh1-5, so cofactor_preference is NADH by
      quotation rather than by recall.

      The direction that makes it a cofactor-cycle part, rather than a sixth alcohol dehydrogenase
      competing for the ADH step, is the one the corpus describes: 10.1128/spectrum.03519-22 --
      "This reaction is catalyzed by ADH3-encoded mitochondrial alcohol dehydrogenase in
      Saccharomyces () and helps to regenerate mitochondrial NAD+ at the level of the
      ethanol-acetaldehyde shuttle"; 10.1186/s13068-016-0583-1 -- "ADH3, which encodes a
      mitochondrial alcohol dehydrogenase involved in NADH shuttling to the cytosol under anaerobic
      conditions". DUET runs that shuttle the other way, and the reason it can is quoted in
      10.1111/1751-7915.12160: ethanol and acetaldehyde "can freely diffuse through mitochondrial
      membranes" and "are oxidized or reduced by cytosolic or mitochondrial alcohol dehydrogenases
      transferring the NADH excess from one cellular compartment to the other". So matrix reducing
      power arrives without a carrier, which is why CARRIER_KNOWN in routes.py records ethanol
      crossing in both directions and records nothing for NADH.

      sequence_encoding_genome is nuclear -- 10.1007/s00253-015-7266-x reports that "The D.
      bruxellensis ADH3 protein sequence was searched for mitochondrial-targeting motifs by
      pairwise alignment with S. cerevisiae ADH3 sequence", which is a presequence on a nuclear
      gene, not an mtDNA-carried one. It therefore reads under NCBI table 1 and needs no recoding,
      which is the distinction this project has been wrong about before.

      THE SPLICE THIS QUOTE USED TO BE, named rather than quietly fixed. It read "The D.
      bruxellensis ADH3 protein sequence ... for mitochondrial-targeting motifs by pairwise
      alignment with S. cerevisiae ADH3 sequence": the two words "was searched" had been elided
      from the middle and replaced by an ellipsis inside quote marks. The material was always in
      the paper; the SPAN was not, and an elided quote cannot be re-resolved at an offset, so it
      is not evidence. It is now the contiguous span -- WIDENED to include the elided words, not
      narrowed to avoid them -- and it stops short of "using EMBOSS ClustalW2", which is where the
      sentence continues in the store and is simply not needed for this claim. Ending a quote early
      is fine; cutting a hole in its middle is not.

      NOT RECORDED, DELIBERATELY. oxygen_sensitivity is 'unknown'; it used to say 'insensitive' and
      no source in the corpus states it. The sources above describe Adh3's role under ANAEROBIC
      conditions, which says when the flux matters and not whether the enzyme is oxygen-labile.

      MEASURED, in this atlas: median 232 TPM, the best-expressed member of the redox set
      (docs/reports/2026-09-20-duet-expression-baseline.md).

      CONFIDENCE 'medium', not 'high': quoted from four papers, none of which measured Adh3 for
      this purpose, and none confirmed here.
