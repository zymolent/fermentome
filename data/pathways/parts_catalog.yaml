# The parts catalog: candidate enzymes for each step of the isobutanol route.
#
# PLAN.md G.6. A `part` in this schema is a candidate for a *step role*, not a promoter or a
# terminator -- `part.step_role_id` is NOT NULL and draws from the seeded vocabulary (AHAS, KARI,
# DHAD, KDC, ADH, transporter, cofactor_cycle). Route enumeration (G.7) is
# `{step -> part} x compartment x cofactor strategy x host`, so this file is the first factor of
# that product and nothing can be enumerated without it.
#
# THE FIELDS THAT DECIDE ROUTES, and why each is here rather than in prose:
#
#   cofactor_preference  NADPH vs NADH. The mismatch between Ilv5 (NADPH) and the alcohol
#                        dehydrogenase (NADH) is the redox problem every route must solve, so it
#                        has to be a queryable field, not a sentence in an evidence string.
#   oxygen_sensitivity   The DHAD enzymes carry [4Fe-4S] clusters. A cytosolically relocalized
#                        Ilv3 depends on cytosolic cluster assembly and is the step most often
#                        reported as limiting in strategy B (unverified).
#   engineered_switch    True for a variant whose cofactor specificity was deliberately changed.
#                        An NADH-preferring KARI is a different route, not a different allele:
#                        it removes the need for matrix NADPH entirely.
#   sequence_encoding_genome
#                        Which genome a deployment would carry the gene on. This decides the
#                        genetic code the sequence must be read under -- nuclear/table 1,
#                        mitochondrial/table 3 -- and is the single thing this project has been
#                        wrong about before. It is recorded per part, never inferred from the
#                        compartment the enzyme works in.
#
# CONFIDENCE. Almost every functional claim here -- which cofactor an enzyme prefers, whether it
# is oxygen-sensitive, whether a variant works in yeast -- is `unverified`: asserted from
# background knowledge and never checked against a source. Identity claims (that kivD is from
# Lactococcus lactis) are equally unverified. Nothing marked `unverified` may support an assertion
# until it is checked against primary literature, which is what the literature layer is for.
#
# `adh7_native` is the first exception and is marked `medium`. It was written by reading the
# stored full text of the paper that used it and quoting what that paper says, so it is not
# background knowledge and must not be filed as though it were -- a file where a checked entry and
# an unchecked one carry the same confidence has thrown away the distinction it exists to record.
# Two obligations come with that exception, and both are visible in the entry:
#
#   * a field the source does not support is left `unknown`, never completed from memory. Adh7's
#     cofactor preference is exactly such a field, and 'unknown' is a real answer here: the route
#     enumerator skips it rather than scoring a demand nobody has checked.
#   * `medium`, not `high`. One paper's report of its own construction, quoted, and confirmed by
#     nothing else.

version: 1
zone: I

parts:
  # ---- AHAS: 2 pyruvate -> 2-acetolactate -----------------------------------------------------
  - id: ilv2_ilv6_native
    step_role: AHAS
    source_organism: "Saccharomyces cerevisiae"
    genes: [ILV2, ILV6]
    native_compartment: mitochondrial_matrix
    sequence_encoding_genome: nuclear
    cofactor_preference: NA
    oxygen_sensitivity: insensitive
    evidence: >-
      The native yeast acetolactate synthase; ILV2 catalytic, ILV6 regulatory. TPP-dependent, no
      redox cofactor, so cofactor_preference is 'NA' rather than 'unknown' -- it does not apply
      (unverified). Measured at median 62 and 137 TPM.
    confidence: unverified

  - id: als_s_bacillus
    step_role: AHAS
    source_organism: "Bacillus subtilis"
    genes: [alsS]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NA
    oxygen_sensitivity: insensitive
    evidence: >-
      The bacterial acetolactate synthase most often used when the route is relocalized to the
      cytosol, because it is a single subunit and is not feedback-inhibited by valine the way the
      yeast enzyme is (unverified). Deploying it in yeast means expressing it from the nuclear
      genome, so it reads under table 1 and needs no recoding.
    confidence: unverified

  # ---- KARI: 2-acetolactate -> 2,3-dihydroxyisovalerate ---------------------------------------
  - id: ilv5_native
    step_role: KARI
    source_organism: "Saccharomyces cerevisiae"
    genes: [ILV5]
    native_compartment: mitochondrial_matrix
    sequence_encoding_genome: nuclear
    cofactor_preference: NADPH
    oxygen_sensitivity: insensitive
    evidence: >-
      The reductive step, and the reason DUET exists: it consumes NADPH inside the matrix, where
      the only local source is Pos5 acting on matrix NADH. Measured at median 174 TPM against
      POS5's 19.4 (docs/reports/2026-09-20-duet-expression-baseline.md).
    confidence: unverified

  - id: ilvc_ecoli
    step_role: KARI
    source_organism: "Escherichia coli"
    genes: [ilvC]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADPH
    oxygen_sensitivity: insensitive
    evidence: "The E. coli ketol-acid reductoisomerase; NADPH-dependent like the yeast enzyme."
    confidence: unverified

  - id: ilvc_nadh_variant
    step_role: KARI
    source_organism: "Escherichia coli"
    genes: [ilvC]
    variant_of: ilvc_ecoli
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    engineered_switch: true
    oxygen_sensitivity: insensitive
    evidence: >-
      An engineered cofactor switch: KARI variants with reversed specificity have been reported
      (unverified). This is a different ROUTE, not a different allele -- an NADH-preferring KARI
      removes the requirement for matrix NADPH altogether, and with it the Pos5 dependency that
      the expression baseline shows is the thinnest link in strategy C. Route enumeration must be
      able to see that as an option rather than only as a footnote.

      2026-09-21: SUPERSEDED IN PRACTICE by the two named variants below, which are cited rather
      than recalled. Kept because it is what the enumerator has been ranking, and removing it
      would silently change every route id that contains it.
    confidence: unverified

  # Two NAMED engineered NADH-dependent KARIs, found by reading the stored corpus rather than
  # from background knowledge. Both are E. coli ilvC variants, and both are used in yeast
  # isobutanol strains in papers this atlas holds -- which is a different evidential position
  # from the generic entry above.
  - id: ilvc6e6_ecoli
    step_role: KARI
    source_organism: "Escherichia coli"
    genes: [ilvC]
    variant_of: ilvc_ecoli
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    engineered_switch: true
    oxygen_sensitivity: insensitive
    evidence: >-
      Named in 10.1016/j.synbio.2022.02.007 as "the E. coli KARI variant, ilvC6E6, that was
      previously engineered with improved specificity towards NADH". That paper is the most
      useful experimental design in this corpus for DUET: it builds the 2x2 of localization x
      cofactor -- mIBAILV5, mIBAIlvC6E6, cIBAILV5, cIBAIlvC6E6 -- so "does the matrix help" and
      "does an NADH KARI help" are separated rather than confounded. The same variant appears as
      plasmid pRS62N-IlvC6E6 in 10.1186/s13068-019-1486-8 (Wess et al.), so it is in use across
      the corpus. Cofactor preference is the paper's claim, not an independent measurement.
    confidence: unverified

  - id: ilvc_p2d1a1_ecoli
    step_role: KARI
    source_organism: "Escherichia coli"
    genes: [ilvC]
    variant_of: ilvc_ecoli
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    engineered_switch: true
    oxygen_sensitivity: insensitive
    evidence: >-
      "Ec_ilvC(P2D1-A1), encoding an engineered NADH-dependent KARI from E. coli", integrated as
      a single copy in a cytosolic isobutanol strain in 10.1038/s41467-021-27852-x. The same
      construction deletes TMA29 (see the note on the acetolactate drain in
      isobutanol_valine_ehrlich.yaml) and overexpresses AFT1 for iron utilisation, because the
      Lactococcus DHAD alongside it needs Fe-S clusters. Cofactor preference is the paper's
      claim, not an independent measurement.
    confidence: unverified

  # ---- DHAD: 2,3-dihydroxyisovalerate -> 2-ketoisovalerate ------------------------------------
  - id: ilv3_native
    step_role: DHAD
    source_organism: "Saccharomyces cerevisiae"
    genes: [ILV3]
    native_compartment: mitochondrial_matrix
    sequence_encoding_genome: nuclear
    cofactor_preference: NA
    oxygen_sensitivity: sensitive
    evidence: >-
      Carries a [4Fe-4S] cluster. Relocalizing it to the cytosol makes the route depend on
      cytosolic Fe-S cluster assembly, which is why NFS1, ISU1 and YFH1 are in the DUET gene set,
      and it is the step most often reported as limiting in strategy B (unverified).
    confidence: unverified

  - id: ilvd_ecoli
    step_role: DHAD
    source_organism: "Escherichia coli"
    genes: [ilvD]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NA
    oxygen_sensitivity: sensitive
    evidence: "Also [4Fe-4S]-dependent, so it carries the same cluster-assembly risk (unverified)."
    confidence: unverified

  # ---- KDC: 2-ketoisovalerate -> isobutyraldehyde ---------------------------------------------
  - id: aro10_native
    step_role: KDC
    source_organism: "Saccharomyces cerevisiae"
    genes: [ARO10]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NA
    oxygen_sensitivity: insensitive
    evidence: >-
      The native broad-specificity 2-ketoacid decarboxylase. Its promiscuity is why isoamyl
      alcohol and 2-methyl-1-butanol appear as by-products (unverified). MEASURED: the weakest
      pathway gene in the 99-run corpus, median 9.2 TPM and undetected in 21 of 99 samples -- so
      a route using it natively is building on the least-expressed step of the whole path.
    confidence: unverified

  - id: kivd_lactococcus
    step_role: KDC
    source_organism: "Lactococcus lactis"
    genes: [kivD]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NA
    oxygen_sensitivity: insensitive
    evidence: >-
      The bacterial ketoisovalerate decarboxylase used in most published isobutanol builds, and
      the usual replacement for the natively weak Aro10 (unverified).
    confidence: unverified

  # ---- ADH: isobutyraldehyde -> isobutanol ----------------------------------------------------
  - id: adh1_native
    step_role: ADH
    source_organism: "Saccharomyces cerevisiae"
    genes: [ADH1]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    oxygen_sensitivity: insensitive
    evidence: "The major fermentative alcohol dehydrogenase; NADH-dependent (unverified)."
    confidence: unverified

  - id: adh6_native
    step_role: ADH
    source_organism: "Saccharomyces cerevisiae"
    genes: [ADH6]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADPH
    oxygen_sensitivity: insensitive
    evidence: >-
      NADPH-preferring (unverified), which makes it the cofactor-matched partner for a route that
      already has NADPH available in the same compartment -- and the mismatched one for a route
      relying on cytosolic NADH.
    confidence: unverified

  # THE ONE ENTRY IN THIS FILE THAT WAS READ RATHER THAN RECALLED. Everything the paper does not
  # say is left 'unknown' instead of being filled in from background knowledge, and the confidence
  # is 'medium' rather than 'unverified' -- see the CONFIDENCE note in the header for why both
  # halves of that matter.
  - id: adh7_native
    step_role: ADH
    source_organism: "Saccharomyces cerevisiae"
    genes: [ADH7]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: unknown
    oxygen_sensitivity: unknown
    evidence: >-
      READ FROM THE STORED FULL TEXT of 10.1016/j.cels.2019.10.006 (Kuroda et al., Cell Systems
      9:534-547) -- the paper whose two published configurations the recall harness reported as
      catalog gaps, because no part carried 'ADH7'. Its Methods describe the five-gene plasmid:
      "The 2 m plasmid introduced, pJA184 (Avalos et al., 2013), contains ILV2, ILV3, ILV5, with
      their gene products targeted to mitochondria; and an a-ketoacid decarboxylase (KDC) from
      Lactococcus lactis (LlKivD) and an alcohol dehydrogenase (ADH7), with their gene products
      targeted to the cytosol." The Results name the organism: "we overexpressed five genes in the
      isobutanol biosynthetic pathway, ILV2, ILV3, ILV5, and ADH7 from S. cerevisiae and
      2-ketoacid decarboxylase (KDC) from Lactococcus lactis". So ADH7 is this build's ADH step,
      it is the yeast gene, it sits downstream of LlKivD, and the strain carrying it reaches
      809 +/- 27 mg/L isobutanol. (Quotations are from the stored PDF text layer, which renders
      the Greek alpha as 'a' and "2 um" as "2 m".)

      native_compartment is the paper's own word, not an inference: pJA184 is used "for expression
      of the five genes in their natural compartments", and the sentence above says ADH7's gene
      product goes to the cytosol. sequence_encoding_genome is nuclear because the gene is carried
      on a 2 um URA3 plasmid -- replicated and read in the nucleus, under NCBI table 1. Nothing in
      this build is mtDNA-encoded.

      NOT RECORDED, DELIBERATELY. cofactor_preference and oxygen_sensitivity are 'unknown' because
      this paper states neither. It does measure intracellular NADPH/NADP+, but only for the
      tolerance screen, and it makes no claim about which cofactor Adh7 uses; writing 'NADPH' here
      from memory would hide an unchecked claim inside a checked entry, which is the one thing
      this entry exists not to do. 'unknown' is also the value the enumerator handles correctly:
      routes.py skips it in both the cofactor gate and the per-compartment demand tally, so this
      part asserts no redox demand nobody has checked.

      CONFIDENCE 'medium', not 'high': every claim above is one paper's own report of its own
      construction, quoted from the corpus copy, and none of it has been confirmed against a
      second source or a measurement. The `zone` this part is stored under is still 'I', because
      `write_parts` stamps the whole catalog that way; that is a property of the loader, not a
      statement that this entry is unchecked.
    confidence: medium

  - id: adha_lactococcus
    step_role: ADH
    source_organism: "Lactococcus lactis"
    genes: [adhA]
    native_compartment: cytosol
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    oxygen_sensitivity: insensitive
    evidence: "The bacterial alcohol dehydrogenase paired with kivD in published builds."
    confidence: unverified

  # ---- cofactor_cycle: the DUET coupling ------------------------------------------------------
  - id: pos5_native
    step_role: cofactor_cycle
    source_organism: "Saccharomyces cerevisiae"
    genes: [POS5]
    native_compartment: mitochondrial_matrix
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    oxygen_sensitivity: insensitive
    evidence: >-
      Mitochondrial NADH kinase: the only local route from matrix NADH to matrix NADPH, and so the
      coupling strategy C depends on. MEASURED at median 19.4 TPM against ILV5's 174, roughly
      nine-fold below the enzyme consuming its product -- overexpression is an obvious route
      intervention and the baseline is the argument for it.
    confidence: unverified

  - id: adh3_native
    step_role: cofactor_cycle
    source_organism: "Saccharomyces cerevisiae"
    genes: [ADH3]
    native_compartment: mitochondrial_matrix
    sequence_encoding_genome: nuclear
    cofactor_preference: NADH
    oxygen_sensitivity: insensitive
    evidence: >-
      Oxidises ethanol inside the matrix, delivering reducing equivalents across the inner
      membrane without a shuttle -- ethanol crosses freely, NADH does not. Nuclear-encoded despite
      acting in the matrix, so it reads under table 1 and a presequence-targeted construct needs
      no recoding. Measured at median 232 TPM, the best-expressed member of the redox set.
    confidence: unverified
