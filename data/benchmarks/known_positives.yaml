      named (glucose), the organism is named, and the basis is named (EMP pathway stoichiometry).
      ARITHMETIC independently confirmed in the corpus [2], which writes out the molar masses: 2 x
      46.07 / 180.156 = 0.51142, so 0.511 is the correctly rounded value and source_hint's molar
      masses check out. NOT SUPPORTED: that every ethanol yield in the atlas is expressible as a
      fraction of it - a property of the atlas's own data model and unit handling, not a claim any
      paper makes; it must be tested against stored rows. PRECISION HAZARD: 0.511 is the MINORITY
