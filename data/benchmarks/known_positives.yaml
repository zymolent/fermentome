  - id: BM-COF-001
    category: cofactor_redox
    statement: >-
      The ketol-acid reductoisomerase step (Ilv5) is NADPH-dependent.
    query_shape: >-
      reaction(enzyme=KARI) -> cofactor stoichiometry, read cofactor identity
    expected_outcome: >-
      NADPH returned, with a signed stoichiometric coefficient and a compartment. A row that
      records only "NAD(P)H" has flattened the distinction this benchmark exists to test.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      BRENDA EC 1.1.1.86 cofactor specificity; UniProt entry for S. cerevisiae Ilv5.
    evidence: >-
      Background knowledge, no source consulted. Written from an AI assistant's memory in phase
      0, before any source document was ingested; see source_hint for what a curator must check
      before this entry may carry a real evidence value.
    confidence: unverified
    verified: false

  - id: BM-COF-002
    category: cofactor_redox
    statement: >-
      The alcohol dehydrogenase step that finishes isobutanol is typically NADH-dependent, so a
      route using a native NADPH-dependent KARI and a native NADH-dependent ADH carries a
      cofactor mismatch that an anaerobic redox balance cannot close on its own.
    query_shape: >-
      sum cofactor stoichiometry along pathway_route(product=isobutanol), grouped by cofactor
      species and compartment
    expected_outcome: >-
      A non-zero net NADPH demand and a non-zero net NADH surplus (or the reverse sign,
      depending on direction convention) rather than a single balanced "reducing equivalents"
      total. The imbalance must survive the summation, not be cancelled by treating NADH and
      NADPH as interchangeable.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      BRENDA EC 1.1.1.1 for yeast Adh1 cofactor preference; check Adh6 separately, which is
      recalled as NADPH-preferring and would change the balance.
    evidence: >-
      Background knowledge, no source consulted. Written from an AI assistant's memory in phase
      0, before any source document was ingested; see source_hint for what a curator must check
      before this entry may carry a real evidence value.
    confidence: unverified
    verified: false

  - id: BM-COF-003
    category: cofactor_redox
    statement: >-
      NADH and NADPH pools are compartment-specific in yeast, so a route split across the
      mitochondrial inner membrane must balance within each compartment, not only overall.
    query_shape: >-
      the BM-COF-002 summation, partitioned by compartment, for each of the four
      compartment_strategy values
    expected_outcome: >-
      Different per-compartment balances for strategies A, B and C from the same underlying
      reaction set. If all four strategies return the same balance, compartment is not entering
      the cofactor arithmetic.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      Bakker et al., FEMS Microbiology Reviews 2001, on NADH metabolism and redox cofactor
      compartmentation in S. cerevisiae (author/year/journal recalled - confirm); check which
      shuttles are actually established in this organism, since the textbook
      malate-aspartate account is not straightforwardly transferable. Check the external
      NADH dehydrogenases NDE1/NDE2 and the internal NDI1 as the recalled route.
    evidence: >-
      Background knowledge, no source consulted. Written from an AI assistant's memory in phase
      0, before any source document was ingested; see source_hint for what a curator must check
      before this entry may carry a real evidence value.
    confidence: unverified
    verified: false

