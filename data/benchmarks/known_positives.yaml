      OBVIOUS CANDIDATE: a 2008 study reports that alpha-ketoisovalerate was neither inhibited nor
      transported by Oac1p. Two further records report the absence of such a transporter in
      related yeasts. COVERAGE FINDING: for this control the corpus is not merely weak evidence,
