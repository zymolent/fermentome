  - id: BM-PATH-001
    category: pathway_compartment
    statement: >-
      Acetolactate synthase Ilv2, with its regulatory subunit Ilv6, is localized to the
      mitochondrial matrix and catalyses the condensation of two pyruvate to 2-acetolactate.
    query_shape: >-
      reaction(substrate=pyruvate, product=2-acetolactate) -> enzyme -> gene_group(ILV2),
      read reaction.compartment
    expected_outcome: >-
      Exactly one reaction returned; compartment = mitochondrial_matrix, not NULL and not
      'unknown'; enzyme resolves to the ILV2 gene group with ILV6 recorded as a regulatory
      subunit rather than a second catalytic step.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      SGD locus page for ILV2 (systematic name recalled as YMR108W - confirm), GO cellular
      component annotation and its evidence code; cross-check ILV6 (recalled YCL009C) as the
      regulatory subunit. Any yeast branched-chain amino acid biosynthesis review.
    evidence: |-
      Corpus evidence pass and reconciliation, 2026-09-21
      (docs/drafts/benchmarks/RECONCILIATION.md). Verdict against the stored corpus: supported.

      Both clauses covered. [1] gives the reaction (two pyruvate condensed to one acetolactate)
      and the Ilv2-catalytic / Ilv6-regulatory split, so Ilv6 is a subunit and not a second
      catalytic step; it says "the mitochondria", and the matrix-level compartment comes from [2].
      NOT REACHABLE FROM THE CORPUS: the systematic names YMR108W and YCL009C appear nowhere, and
      no GO cellular-component annotation or evidence code appears anywhere in 1,309 full texts -
      that is an SGD lookup, so the L2 level this entry asks for is not attainable from the corpus
      alone.

