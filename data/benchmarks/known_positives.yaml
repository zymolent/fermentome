      0.51142) and the substrate must be stored with it. Most of the consulted literature rounds
      to 0.51 g/g, and a substantial number of papers apply that same 0.51 g/g figure to XYLOSE
      rather than glucose, so the number alone does not identify the substrate. That every
      reported ethanol yield in the atlas is expressible as a fraction of this ceiling is a
      property of the atlas's own unit handling, not a claim any paper makes, and is tested
      against stored rows rather than looked up.
    query_shape: >-
      product(ethanol).theoretical_yield_per_substrate(glucose), then
      measurement(product=ethanol).value_si / that ceiling
    expected_outcome: >-
      0.511 g/g returned as a stored product property with its substrate named, and no stored
      measurement exceeding it after unit conversion. Any measurement above the ceiling is a unit
      or basis error and must be flagged, not clipped. A row reported against a paper's rounded
      0.51 g/g must not be recorded as exceeding the ceiling in the third significant figure, and
      a stored yield whose substrate is absent is not comparable against this ceiling at all.
    organism: Saccharomyces cerevisiae
    product: ethanol
    expected_evidence_level: L2
    source_hint: >-
      Stoichiometry: 1 glucose -> 2 ethanol + 2 CO2; 2 x 46.07 / 180.16. Arithmetic, but confirm
