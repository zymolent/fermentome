# fermdb known-positive benchmark set
#
# ZONE I (inferred / quarantined). Written in phase 0 from background knowledge, BEFORE any
# pipeline existed, so that the target is fixed before the tools that aim at it (PLAN.md S.5).
#
# READ THIS BEFORE USING ANY ROW:
#   NO ENTRY IN THIS FILE MAY BE USED AS EVIDENCE FOR ANYTHING.
#   Every `statement` below is to be read as if suffixed "(unverified)". The machine-readable
#   form of that mark is `confidence: unverified` on every entry, which is enforced by
#   tests/test_benchmarks.py. Every entry also carries an honest `evidence` value of "background
#   knowledge, no source consulted" (CONVENTIONS.md requires evidence+confidence on every curated
#   row, and a placeholder is not an exemption). An entry becomes usable only when a human curator
#   has checked it against the source named in `source_hint`, overwritten `evidence` with that
#   real source, raised `confidence` to `low`/`medium`/`high`, and flipped `verified` to true.
#   Until then this file is a list of things to go and check, not a list of facts. See
#   data/benchmarks/README.md.
#
# The six negative-control entries are load-bearing. A pipeline that recovers every positive and
# also "recovers" the negatives is not discriminating; it is matching text. Recovery rate is only
# meaningful when reported alongside the negative-control false-positive rate.

version: 1
zone: I
purpose: >-
  Facts the atlas must independently recover from ingested sources, and claims it must NOT make.
  Recovery rate against this set is the headline number for whether the atlas works.
written_in_phase: 0
written_from: background_knowledge_not_sources
usable_as_evidence: false

# Controlled vocabularies for this file. Validators and tests read these, they are not prose.
categories:
  - pathway_compartment
  - cofactor_redox
  - competing_pathway
  - mitochondrial_genetics
  - ethanol_reference
  - tolerance
  - negative_control
confidence_values:
  - unverified        # the only value permitted while verified is false
  - low
  - medium
  - high              # never writable from memory (CONVENTIONS.md, Curation)
evidence_levels:
  - L1                # direct experimental
  - L2                # repeated experimental, >=2 independent groups
  - L3                # strong cross-study association
  - L4                # computational prediction
  - L5                # hypothesis / literature assertion only
  - 'NA'              # recorded as not applicable: the expected outcome is that nothing is found

entries:

