      study purified and reconstituted the yeast mitochondrial pyruvate (monocarboxylate) carrier
      and reports that it also transports 2-oxoisovalerate, which is 2-ketoisovalerate. That
      DEMONSTRATES the transport activity in proteoliposomes, but the paper predates the
      identification of MPC1/MPC2/MPC3 by two decades and characterises only two polypeptides by
      apparent mass, so it establishes no gene. THE CONTROL SURVIVES ON THE "SPECIFIC GENE HAS
      BEEN ESTABLISHED" CLAUSE ALONE. (b) NEAR-MISS, NAMED GENE, WRONG MEMBRANE: a 2017 study
      reports that the lactate transporter Jen1 transports 2-ketoisovalerate. JEN1 is a
      plasma-membrane permease and so fails the membrane=mitochondrial_inner term of the query
      shape - AN ATLAS THAT DROPS THE MEMBRANE QUALIFIER WILL RETURN JEN1 AND BE WRONG, and this
