      as equivalent.
    organism: Saccharomyces cerevisiae
    product: ethanol
    expected_evidence_level: L2
    source_hint: >-
      SGD locus pages for PDC1 (recalled YLR044C), PDC5, PDC6; a review of pyruvate branch-point
