  - id: BM-PATH-003
    category: pathway_compartment
    statement: >-
      Dihydroxyacid dehydratase Ilv3 is localized to the mitochondrial matrix, requires an
      iron-sulfur cluster, and converts 2,3-dihydroxyisovalerate to 2-ketoisovalerate. The cluster
      type is disputed inside the consulted literature - one source assigns [4Fe-4S] to
      dihydroxyacid dehydratases as a family, another assigns 2Fe-2S to yeast ILV3 specifically,
      and a third records that every solved crystal structure in the ilvD/EDD family so far
      carries [2Fe-2S] - so the requirement is recorded without a stoichiometry.
    query_shape: >-
      reaction(product=2-ketoisovalerate) -> enzyme -> gene_group(ILV3), read
      reaction.compartment and any cofactor/prosthetic-group annotation
    expected_outcome: >-
      compartment = mitochondrial_matrix; an iron-sulfur cluster requirement is recorded as a
      property of the enzyme, because it is what makes cytosolic relocalization hard
      (BM-PATH-010). The requirement is recorded WITHOUT a cluster stoichiometry, or with the
      stoichiometry marked disputed and both citations attached; a single asserted [4Fe-4S] or
      [2Fe-2S] fails this entry. Oxygen lability is asserted in the corpus only as a general
      contrast between the two cluster types and never for yeast Ilv3, so it must not be returned
      as a property of Ilv3.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      SGD locus page for ILV3 (recalled YJR016C - confirm); a structural or biochemical paper on
      dihydroxyacid dehydratase Fe-S cluster type and oxygen lability. The oxygen lability claim
      in particular is recalled, not read.
    evidence: |-
      Corpus evidence pass and reconciliation, 2026-09-21
      (docs/drafts/benchmarks/RECONCILIATION.md). Verdict against the stored corpus:
      partially_supported.

      SUPPORTED: matrix localization [1,2], an Fe-S cluster requirement and its dependence on
      cluster biogenesis for in vivo activity [1], and the reaction itself [5]. NOT SUPPORTED AS
      WRITTEN: the [4Fe-4S] stoichiometry. THE CLUSTER TYPE IS DISPUTED INSIDE THE CORPUS. [1]
      assigns 4Fe-4S to dihydroxyacid dehydratases as a FAMILY; [3] assigns 2Fe-2S to yeast ILV3
      SPECIFICALLY and repeats it in its conclusions; [4] explains the split - the ilvD/EDD family
      spans both types and every solved crystal structure so far is [2Fe-2S]. A fourth corpus
      paper hedges to "[Fe-S] cluster containing" with no type at all. The statement is narrowed
      to record the requirement WITHOUT a stoichiometry. The oxygen-lability sub-claim source_hint
      flags as recalled is asserted in [4] only as a general contrast between the two cluster
      types, never for yeast Ilv3.

