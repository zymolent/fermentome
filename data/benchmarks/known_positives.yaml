  - id: BM-PATH-007
    category: pathway_compartment
    statement: >-
      In the native (unengineered) configuration the isobutanol route crosses the mitochondrial
      inner membrane exactly twice: cytosolic pyruvate is imported into the matrix through the
      mitochondrial pyruvate carrier, and the 2-ketoisovalerate made there is exported back to the
      cytosol for decarboxylation. Counted from cytosolic pyruvate the route is cytosol -> matrix
      -> cytosol.
    query_shape: >-
      enumerate pathway_route(product=isobutanol, compartment_strategy='A_native_split'),
      count compartment transitions along the ordered steps
    expected_outcome: >-
      Exactly two compartment transitions along a route whose start compartment is cytosolic
      pyruvate - pyruvate in at the carrier step, 2-ketoisovalerate out at the branch-point step -
      returned as two distinct transport steps rather than one. A route returned with one
      transition has dropped the pyruvate import step, which is the error this entry was rewritten
      to catch; a route returned with zero transitions means compartment is being dropped
      somewhere in the join. The count returned here must agree with BM-PATH-011, which names the
      first of the two transitions.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      Derivable from BM-PATH-001 to BM-PATH-006 once each is verified; also stated in
      docs/design/ISOBUTANOL_PROGRAM.md section 1, which is itself unverified.
    evidence: |-
      Corpus evidence pass and reconciliation, 2026-09-21
      (docs/drafts/benchmarks/RECONCILIATION.md). Verdict against the stored corpus: contradicted.

      CONTRADICTED AS WRITTEN, AND CORRECTED. [1] is the corpus's own end-to-end description of
      the native compartment split and it names TWO inner-membrane transport events in consecutive
      clauses: cytosolic pyruvate imported via the MPC complex, and matrix 2-KIV exported to the
      cytosol. It does support the transition the old statement pointed at (the KIV step, matrix
      to cytosol); it contradicts the words "exactly once". [2] independently starts the route at
      glycolytic pyruvate in the cytosol, so no consulted source draws the route boundary at
      matrix pyruvate - which is the only reading under which "exactly once" would be true. WHY
      THIS IS THE FINDING THAT MATTERS MOST: the old expected_outcome demanded an exact count of
      one, so an atlas that correctly returned both transitions scored as a FAILURE, and
      BM-PATH-011 of this same file asserts the pyruvate import step, so the set contradicted
      itself and could not be passed. Statement and expected_outcome are rewritten to two
      transitions, with the route's start compartment made explicit, and made mutually consistent
      with BM-PATH-011.

