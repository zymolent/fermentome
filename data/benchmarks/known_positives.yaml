      ranking for host=S. cerevisiae directly against the parts catalog; (iii) assert that every
      part whose ONLY expression_record is host=E. coli comes back flagged untested-in-target-host
      rather than ranked as demonstrated. That is a unit test over the atlas's join and it should
      live next to the join, in tests/, not as a row to be verified in this file. ONE THING TO
      WATCH when BM-COF-004 is curated: adhA is exactly the part where host matters, because the
      yeast literature uses engineered VARIANTS of it - if the catalog stores the E. coli parent
