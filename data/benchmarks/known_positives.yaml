  - id: BM-CMP-002
    category: competing_pathway
    statement: >-
      Deletion of PDC1 reduces ethanol formation, and deletion of all three PDC isozymes
      abolishes fermentative ethanol production and produces a strain that cannot grow on
      glucose as sole carbon source without a C2 supplement.
    query_shape: >-
      genotype(pdc1 deletion) and genotype(pdc1 pdc5 pdc6 deletion) joined to
      measurement(product=ethanol) and to growth phenotype under matched condition_context
    expected_outcome: >-
      A reduction in ethanol for the single deletion and an abolition plus a C2-auxotrophy
      phenotype for the triple, each with its condition context attached. The growth phenotype
      must not be stored as a zero yield.
    organism: Saccharomyces cerevisiae
    product: ethanol
    expected_evidence_level: L2
    source_hint: >-
      Flikweert et al. on Pdc-negative S. cerevisiae and the C2 requirement (recalled - confirm
      authors and year); van Maris et al. on evolved Pdc-negative strains.
    evidence: >-
      Background knowledge, no source consulted. Written from an AI assistant's memory in phase
      0, before any source document was ingested; see source_hint for what a curator must check
      before this entry may carry a real evidence value.
    confidence: unverified
    verified: false

  - id: BM-CMP-003
    category: competing_pathway
    statement: >-
      Deleting both GPD1 and GPD2 reduces glycerol formation and impairs anaerobic growth,
