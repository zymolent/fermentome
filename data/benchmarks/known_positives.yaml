  - id: BM-PATH-006
    category: pathway_compartment
    statement: >-
      The final reduction of isobutyraldehyde to isobutanol is catalysed in the cytosol by alcohol
      dehydrogenases, of which more than one is a candidate: the sources consulted name ADH1-ADH5
      as a group for this step, and ADH6 and ADH7 separately. Cofactor preference is not uniform
      across the candidates and is disputed in the literature for this step, so it must be
      recorded per candidate and never on a merged 'ADH' row.
    query_shape: >-
      reaction(substrate=isobutyraldehyde, product=isobutanol) -> enzyme candidates,
      read compartment and cofactor preference for each
    expected_outcome: >-
      compartment = cytosol; more than one candidate ADH returned, each with its own cofactor
      annotation rather than one merged "ADH" row. Because the consulted sources disagree with one
      another about the cofactor for this step, an atlas that returns a single cofactor on a
      generic ADH step role fails this entry even when the value it returns is one that a paper
      states.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      SGD locus pages for ADH1 (recalled YOL086C) and ADH6 (recalled YMR318C); Hazelwood 2008
      for which ADH actually carries Ehrlich-pathway flux, which a curator should not assume.
    evidence: |-
      Corpus evidence pass and reconciliation, 2026-09-21
      (docs/drafts/benchmarks/RECONCILIATION.md). Verdict against the stored corpus:
      partially_supported.

      SUPPORTED: the cytosolic compartment for the final reduction and that more than one ADH is a
      candidate [1]. NOT SUPPORTED AS WRITTEN, on two counts. (a) The roster is malformed:
      "Adh1-Adh7 and Adh6" names Adh6 twice, because Adh6 falls inside the range - and [1] gives
      ADH1-5, not Adh1-Adh7. Adh6 is separately attested as a cytosolic Ehrlich-pathway candidate
      [2]. (b) THE COFACTOR IS DISPUTED IN THE CORPUS: [1] says NADH-dependent for ADH1-5, [3]
      says the step requires NADPH, and a third corpus paper notes the reported NADPH dependence
      of Sc-Adh7. That spread is exactly why the expected outcome's demand for a per-candidate
      cofactor annotation is the right schema call - and it also means no single source will
      satisfy this entry.

