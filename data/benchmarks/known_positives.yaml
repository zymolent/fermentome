  - id: BM-PATH-004
    category: pathway_compartment
    statement: >-
      2-ketoisovalerate is the branch-point metabolite of the route: it is simultaneously the
      last shared intermediate of valine biosynthesis and the entry point of the Ehrlich
      pathway to isobutanol.
    query_shape: >-
      metabolite(2-ketoisovalerate) -> all reactions consuming it, grouped by
      role in (reaction, product, context)
    expected_outcome: >-
      At least three consuming reactions returned - transamination to valine, isopropylmalate
      synthesis toward leucine, and decarboxylation toward isobutyraldehyde - and the same
      reaction carries role='competing' in the isobutanol context while being the target in the
      valine context. A single static role flag on the reaction is a schema failure.
    organism: Saccharomyces cerevisiae
    product: isobutanol
    expected_evidence_level: L2
    source_hint: >-
      KEGG map00290 (valine, leucine and isoleucine biosynthesis) and MetaCyc's
      L-valine biosynthesis pathway; confirm the map identifiers.
    evidence: |-
      Corpus evidence pass and reconciliation, 2026-09-21
      (docs/drafts/benchmarks/RECONCILIATION.md). Verdict against the stored corpus: supported.

      [1] gives the two fates of KIV in one run of text - transamination to valine inside
      mitochondria by Bat1, or translocation to the cytosol and decarboxylation to
      isobutyraldehyde - which covers both halves of the claim. [2] gives the third consuming
      reaction the expected outcome asks for, the leucine branch, and places it in EITHER
      compartment, which a compartment-aware schema has to represent. Worth knowing for a
      literal-string recovery test: NO corpus paper uses the phrase "branch point" for KIV. The
      claim is a fair paraphrase of what several papers describe, not a sentence anyone wrote.
      KEGG map00290 and the MetaCyc identifier named in source_hint do not appear in the corpus
      and cannot be confirmed from it.

