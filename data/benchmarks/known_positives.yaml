      anonymous - "the high activity of the mitochondrial alpha-KIV carrier", "the bottleneck of
      exporting alpha-KIV to the cytoplasm" - with no gene attached, and every NAMED mitochondrial
      carrier in the corpus is attached to a different substrate (OAC1 to alpha-isopropylmalate,
