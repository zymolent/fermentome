# Every row therefore carries confidence 'unverified', not 'low'. The two are different claims:
# 'low' means the value was checked against a source and the source is weak; 'unverified' means
# it was asserted and never checked at all, which is exactly what happened here. Collapsing the
# two would make a recalled identifier indistinguishable from a checked one.

