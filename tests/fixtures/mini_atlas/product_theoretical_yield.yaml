# Theoretical yields are per (product, substrate): glucose is named, not assumed. The three rows
# are the three states the `<col>_state` companion exists for.
#
#   glucose:  recorded. 1 mol isobutanol (MW 74.12) per mol glucose (MW 180.16) = 0.411 g/g, the
#             standard redox-balanced Ehrlich stoichiometry. Numbers recalled from background
#             knowledge and not re-derived against a cited source this session, so confidence is
#             'unverified' -- asserted but never checked -- rather than 'low' (checked, weak).
#   xylose:   recorded that a theoretical yield exists, unresolved which. The row exists so the
#             absence is a fact rather than an unfinished import; the QC bound must not silently
#             fall back to the glucose number.
#   glycerol: mol_per_mol not applicable in the (synthetic) source's own framing, g_per_g never
#             recorded at all -- numeric NULL and state NULL, the fourth state.

