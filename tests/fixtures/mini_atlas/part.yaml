# Nuclear-encoded, targeted to the matrix by a presequence: NO recoding needed or wanted.
- id: YAA:PART:fx-kdc-matrix-nuclear
  step_role_id: KDC
  source_organism_id: YAA:ORG:fx-scer
  gene_group_id: YAA:GG:fx-kdc
  variant_of: YAA:PART:fx-kdc
  sequence: ATGCTTCTCCTACTGGAATTCTAA
  sequence_compartment_id: mitochondrial_matrix
  sequence_encoding_genome: nuclear
  zone: R
  evidence: "synthetic test fixture, not a real observation; the same invented ORF as fx-adh, filed as a presequence-targeted nuclear construct destined for the matrix -- translated under table 1 on cytosolic ribosomes, so the CUN run is not a hazard here"
  confidence: low

# The same enzyme carried on mtDNA: translated in the matrix under table 3, so recoded first.
- id: YAA:PART:fx-kdc-mtdna
  step_role_id: KDC
  source_organism_id: YAA:ORG:fx-scer
  gene_group_id: YAA:GG:fx-kdc
  variant_of: YAA:PART:fx-kdc
  sequence: ATGTTATTATTATTAGAATTCTAA
  sequence_compartment_id: mitochondrial_matrix
  sequence_encoding_genome: mitochondrial
  zone: R
  evidence: "synthetic test fixture, not a real observation; the fx-kdc-matrix-nuclear ORF recoded for table 3 by fermdb.recode.recode(mode='to_table3'), which encodes the identical protein"
  confidence: low
