# The five parts of the fixture's one complete pathway_configuration (see pathway_route_step.yaml
# for which compartment each is placed in), plus the two-row contrast that is the whole point of
# the encoding-genome model (schema.sql section 3).
#
# fx-adh's `sequence` is the fixture's edge case for the compartment-safety gate: it is a short,
# entirely invented ORF (NOT a real ADH2 coding sequence) containing an unrecoded CUN run, so it
# translates as MLLLLEF* under table 1 and as MTTTTEF* under table 3. Verified by running
# fermdb.recode.check_compartment_safety against it directly.
#
# THE CONTRAST (fx-kdc-matrix-nuclear vs fx-kdc-mtdna). Both parts are the same enzyme in the
# same compartment -- the mitochondrial matrix -- and differ only in which genome encodes them:
#
#   fx-kdc-matrix-nuclear   nuclear-encoded, presequence-targeted. Translated on cytosolic
#                           ribosomes under table 1 and then imported. Its sequence still carries
#                           the unrecoded CUN run and that is CORRECT: recoding it would
#                           mistranslate the protein. check_compartment_safety accepts it.
#   fx-kdc-mtdna            carried on mtDNA, translated in the matrix under table 3. The same
#                           ORF filed this way is REJECTED until recoded, so this row stores the
#                           recoded sequence, which encodes the identical protein (MLLLLEF*).
#
# Keying the genetic code on the compartment instead of the genome would collapse these two rows
# into one and tell a bench scientist to recode the first -- the error this schema now refuses.

- id: YAA:PART:fx-ahas
  step_role_id: AHAS
  source_organism_id: YAA:ORG:fx-scer
  gene_group_id: YAA:GG:fx-ahas
  zone: R
  evidence: synthetic test fixture, not a real observation
  confidence: low

