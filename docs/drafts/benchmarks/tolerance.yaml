# DRAFT - evidence proposals for benchmark claims in data/benchmarks/known_positives.yaml
# Category: tolerance
# Produced by a corpus-evidence pass over the 1,309 stored full texts. NOT a curation act:
# no confidence value is asserted here and nothing is marked verified. A human curator decides.
# Every `quote` is copied character-for-character out of the named corpus file, including the
# empty-bracket artefacts ("[]", "[, ]", "()") left by reference stripping during text
# extraction, and including hard line breaks. Do not normalise them before comparing.
#
# DEAD `corpus_file:` MARKERS REPLACED, 2026-09-22 — 3 of them in this file.
# They pointed at a numbered scratchpad cache (`NNNNN.txt`) that no longer exists anywhere on
# this machine, so as provenance they could not be dereferenced by anyone, including the
# 2026-09-22 provenance sweep. That sweep also established that the cache was not a DIFFERENT
# text — every quote checked against it re-resolves character-identically against the
# `fulltext_asset` store — so nothing is lost by dropping the pointer and keeping the DOI.
#   3 were removed as redundant: a `doi:` or `publication:` sat beside them in the
#   same record and already carried the provenance.
# Checked before removal: across all 15 draft files the 101 distinct cache numbers each map
# to exactly ONE DOI, so the markers were internally consistent and carried no information
# the adjacent DOI does not. No quote string was touched.

- id: BM-TOL-001
  verdict: partially_supported
  publication: "doi:10.1016/j.jbc.2026.113228"
  corpus_title: "Leucyl-tRNA synthetase as a molecular target of isobutanol-mediated growth inhibition in Saccharomyces cerevisiae."
  quote: |-
    In particular, the concentration of isobutanol that inhibits growth (>1.4% w/v, approximately 190 mM) is much higher than the typical concentrations at which specific protein-ligand interactions occur, indicating that the binding affinity of isobutanol for its targets is likely to be low.
  quote_supports: >-
    Establishes the isobutanol half of the comparison in S. cerevisiae, on a MOLAR basis (approximately 190 mM), with a growth endpoint - which is precisely what the benchmark query_shape requires and what most of the corpus statements on this point lack. It does NOT establish the ethanol half and it does not make the comparison. No source in this corpus was found that measures both alcohols in the same strain background under one assay, so the matched comparison itself remains unsourced here.
  endpoint_stated: true
  searches_run:
    - "isobutanol   [--require (more toxic|toxicity|inhibit).{0,300}ethanol]"
    - "(IC50|IC 50|MIC|half.maximal)   [--require isobutanol|butanol]"
    - "(specific growth rate).{0,250}isobutanol   [--require ethanol|molar|mM]"
    - "(50\\s*%|half).{0,120}(growth|reduc|inhibit).{0,120}ethanol   [--require cerevisiae|yeast]"
  note: >-
    ENDPOINT IS STATED, and stated twice, but INCONSISTENTLY IN UNITS within this one paper - flag before storing. Body text (quoted): '>1.4% w/v, approximately 190 mM'. Methods, offset approx. 30034: 'the precultured cells were inoculated into each fresh medium containing either 1.4% (v/v) 1-butanol (Nacalai Tesque) or 1.4% (v/v) isobutanol (Nacalai Tesque) to achieve an initial optical density at 600 nm (OD600) of 0.1 in 96-well plates ... incubated at 30 C for 24 h'. 1.4 percent w/v = 14 g/L = 189 mM, so the paper own 190 mM figure is the w/v reading; 1.4 percent v/v would be 11.2 g/L = 151 mM. That is a 25 percent spread depending on which reading is correct. The endpoint is otherwise fully specified: OD600 after 24 h at 30 C in SC medium in sealed 96-well plates, strain background BY4741. The effect size appears separately at offset approx. 4310 - 'Indeed, previous studies have reported that wild-type S. cerevisiae exhibits a growth reduction exceeding 50% when exposed to 1.4% isobutanol ().' - note that sentence is itself a citation of prior work, not this paper own measurement, and it drops the unit entirely. ETHANOL COUNTERPART, from a DIFFERENT publication, needed to complete the comparison: 00701.txt (doi:10.1186/s12934-025-02663-7) states 'Although S. cerevisiae can tolerate up to 120 g/L of ethanol, a concentration of around 40 g/L can cause 50% growth inhibition, thereby limiting ethanol production [, ].' 40 g/L ethanol is 868 mM - that conversion is the curator arithmetic (46.07 g/mol), NOT a corpus figure; the corpus gives only g/L. Set beside approximately 190 mM isobutanol at a nominally matched endpoint (50 percent growth inhibition), isobutanol is roughly 4-5x more inhibitory on a molar basis, so the DIRECTION of the claim is supported. But the two numbers come from different papers, strains, media and protocols, and by the benchmark own expected_outcome a comparison assembled that way is exactly what the atlas should REFUSE rather than return with a caveat. Treat the direction as supported and the matched-pair row as not_in_corpus. A third ethanol figure, consistent but broader: 00892.txt (doi:10.1371/journal.pone.0077501) - 'yeast can tolerate high ethanol concentrations (>15% (vv-1)), however at lower concentrations (4-6% (vv-1)) a 50% reduction in yeast's growth has been reported []'. 4-6 percent v/v is roughly 0.68-1.03 M. CORROBORATING BUT UNUSABLE AS ROWS - qualitative, no basis and no endpoint: 00080.txt 'Isobutanol exhibits more toxicity to yeast cells than ethanol, attributable to the disruption of plasma membrane lipids, membrane transport mechanisms, and the initiation of protein translation [, , ].'; 00791.txt 'Isobutanol is more hydrophobic than ethanol and is more toxic to cells by disrupting cell membrane.'; 00226.txt 'since isobutanol and other alternatives are more hydrophobic than ethanol, they are more toxic to the microorganisms designed to produce the compounds'. Each of these is a tolerance statement with NO endpoint definition and should not be admitted as a measurement. ONE FURTHER MOLAR-BASIS ALCOHOL COMPARISON EXISTS BUT ON A DIFFERENT ENDPOINT, so it must not be merged with the above: 00068.txt (doi:10.1007/s13205-014-0235-8) - 'The abilities of the different alcohols to induce the heat shock response are proportional to their lipophilicities: the lipophilic alcohol isobutanol is maximally inductive at about 0.6 M, whereas the least lipophilic alcohol, methanol, causes maximal induction at 5.7 M (Meyer et al. ).' Endpoint is heat-shock-response induction, not growth, and the host is bacterial. The Alper-group or Liao-group yeast growth-rate inhibition curves named in the source_hint were NOT found in this corpus.

- id: BM-TOL-002
  verdict: partially_supported
  publication: "doi:10.1186/s13068-021-02048-z"
  corpus_title: "Tryptophan plays an important role in yeast tolerance to isobutanol."
  quote: |-
    Growth assay was applied to two pentose phosphate pathway (PPP) defective strains (Sc1 and Sc3). The two mutant strains showed more sensitive to isobutanol (1%) compared to the wild type. b, c Two PPP-defective strains (Sc1 and Sc3) and two tryptophan pathway defective strains (Sc7 and Sc12) were used in recovery assays and the two tryptophan pathway defective strains were recovered earlier (b) than the two PPP-defective strains (c). d All defective strains were recovered at 70 h. The recovery assays was performed at 200 μg/ml tryptophan addition
  quote_supports: >-
    Shows two non-interconvertible assay types inside one S. cerevisiae paper - a growth assay at a stated concentration (1 percent isobutanol) and a recovery/lag assay scored by time to recovery (recovered earlier vs later, all recovered at 70 h) - and shows that the two rank the same strains DIFFERENTLY from each other, which is the substantive content of the claim. It does not establish the count of five, and it does not establish that the atlas refuses a cross-type aggregate; that second half is a behavioural test of the atlas, not a literature claim, and no source can supply it.
  endpoint_stated: true
  searches_run:
    - "isobutanol   [--require (cerevisiae|yeast).{0,600}(tolera|toxic|inhibit)]"
    - "(IC50|IC 50|MIC|half.maximal)   [--require isobutanol|butanol]"
    - "(% ?\\(?v/v\\)?|g/L) isobutanol   [--require cerevisiae]"
    - "(g/L|% ?\\(?v/v\\)?|w/v).{0,80}isobutanol"
  note: >-
    THE COUNT DOES NOT HOLD AS WRITTEN FOR S. CEREVISIAE, though the benchmark expected_outcome does. expected_outcome asks for at least three distinct assay types: met comfortably. The statement asks for five named types: two of the five are not attested for yeast in this corpus. ASSAY TYPES ACTUALLY FOUND for isobutanol in S. cerevisiae, with the file that carries each: (1) growth / OD600 at a stated concentration - 00118.txt (OD600 at 24 h, 1.4 and 1.5 percent, SC medium, BY4741) and 00791.txt (1 percent, quoted above); (2) viability or survival after exposure - 00791.txt at offset approx. 12233, 'In 1.5% isobutanol, the wild type fed with tryptophan had a higher survival rate compared to the sample without tryptophan supplement (Fig. c).', and 00680.txt Methods, 'After 24 h, survival tests were conducted in YPG plates with a series dilution culturing at 25 C for 72 h.'; (3) colony-size growth on solid medium in a genome-scale screen format - 00791.txt at offset approx. 47847, 'The square plate composed of YPD agar with/without 2% isobutanol was prepared for colony array inoculation ... The colony size was scanned and quanti[fied]'; (4) recovery / lag extension - 00791.txt, quoted above; (5) long-term adapted growth after adaptive laboratory evolution - 00080.txt, the IbOH-1 strain evolved from an industrial isolate. NOT FOUND for isobutanol in S. cerevisiae anywhere in this corpus: an IC50, and an MIC. MIC for isobutanol appears only in a BACTERIAL paper, 00559.txt (doi:10.1186/1475-2859-10-18, E. coli EcNR1): 'concentrations were chosen to correspond to approximately 1/2 of the minimum growth inhibiting concentration (MIC) on glucose minimal medium at 30 C'. So if the atlas expects an assay_type enum with an IC50/MIC slot populated from yeast rows, that slot will be empty, and the emptiness is a real finding about the isobutanol-tolerance literature, not a gap in the search. NON-INTERCONVERTIBILITY IS DEMONSTRATED HERE, not merely asserted, and this is the most useful thing in the quote: in the passage above the two tryptophan-pathway mutants are the WORSE performers on the growth assay (Sc7 and Sc12 were picked as isobutanol-sensitive) but the BETTER performers on the recovery assay, recovering earlier than the PPP mutants. The two assay types invert the strain ranking. That is the strongest single piece of evidence in the corpus that a cross-type aggregate would be meaningless. SEPARATE HAZARD the curator should not conflate with assay type: concentration units vary across these same rows (percent v/v, percent w/v, g/L), and 00118.txt is internally inconsistent between w/v and v/v (see BM-TOL-001 note). Unit normalisation and assay-type segregation are two different guards and both are needed.

- id: BM-TOL-003
  verdict: partially_supported
  publication: "doi:10.1016/j.btre.2026.e00959"
  corpus_title: "Development of Saccharomyces cerevisiae isobutanol production strain from osmotolerant and ethanol-producing industrial isolated yeast."
  quote: |-
    In conclusion, this preliminary genomic characterization of the IbOH-1 strain indicates that the synergistic accumulation of mutations across the HOG, CWI, and NCR pathways, as well as in genes related to ion homeostasis and amino acid biosynthesis, could confer robust isobutanol tolerance to the IbOH-1 strain. However, it is important to note that the proposed mechanisms remain hypothetical, as they are derived from genomic analysis alone.
  quote_supports: >-
    A concrete, in-corpus instance of the epistemic situation the benchmark describes: an S. cerevisiae isobutanol-tolerance mechanism proposed from genomic evidence alone and explicitly self-labelled by its own authors as hypothetical pending demonstration. It supports the PRINCIPLE that such an assertion must not surface at demonstration-grade evidence. It does NOT support the claim as worded - this is a genomics-derived hypothesis about isobutanol, not an ethanol-tolerance mechanism transferred to isobutanol - and no source states the L3 capping rule itself, which is project policy and not a literature finding.
  endpoint_stated: not_applicable
  searches_run:
    - "cross.?toleran|cross.?protect|cross.?resist   [--require alcohol|ethanol|butanol]"
    - "(did not|does not|not necessarily|no(t)? (confer|correlate|translate)).{0,200}(isobutanol|butanol)"
    - "isobutanol   [--require (more toxic|toxicity|inhibit).{0,300}ethanol]"
  note: >-
    THE STRONGEST EVIDENCE FOR THE CLAIM RATIONALE IS IN A BACTERIAL PAPER, so it transfers to yeast only as an argument and not as a finding - which is itself the point the claim is making. 00188.txt (doi:10.1038/msb.2010.98, E. coli): 'The response of ethanol, however, differs significantly from that of n-butanol and isobutanol, which is demonstrated by differential regulation of genes responsible for membrane potential management (). These results indicate that the cytotoxicity of longer chain alcohols is unlike ethanol cytotoxicity, despite the fact that these alcohols commonly disrupt the cell membrane.' That is a direct statement that the ethanol mechanism does not simply carry over to C4 alcohols, and it is the best justification in the corpus for capping transferred mechanisms. THERE IS ALSO A COUNTEREXAMPLE THE CURATOR MUST SEE BEFORE ADOPTING A BLANKET CAP. 00791.txt is a case where an ethanol-associated mechanism was transferred AND THEN DEMONSTRATED for isobutanol in S. cerevisiae. At offset approx. 10111 it reasons from the ethanol literature - 'It has been shown that tryptophan biosynthesis also responds to ethanol stress, while either overexpression or supplement of tryptophan could increase ethanol tolerance. Cellular membrane is a predominant target of ethanol, which decreases membrane integrity [, ]. Isobutanol is more hydrophobic than ethanol and is more toxic to cells by disrupting cell membrane.' - and then tests it directly on isobutanol with TRP2 and TRP5 deletion mutants plus exogenous tryptophan rescue. So for the tryptophan/membrane mechanism specifically, a direct isobutanol demonstration EXISTS in this corpus, and an automatic L3 cap keyed on 'origin was ethanol' would UNDER-rate it. Consequence for the data model: transfer_rationale must record whether a direct isobutanol demonstration was SOUGHT and FOUND, not merely that the mechanism originated in the ethanol literature. The benchmark statement already says 'unless directly demonstrated for isobutanol' - this is the corpus case that makes that clause load-bearing rather than decorative. THE SOURCE_HINT SUGGESTED TEST CASE, heat-shock: NO isobutanol heat-shock demonstration in S. cerevisiae was found in this corpus. The nearest is 00068.txt (E. coli, groESL from C. acetobutylicum) reporting isobutanol maximal heat-shock induction 'at about 0.6 M' - bacterial, and an induction endpoint rather than a tolerance endpoint. Membrane-composition and HSP-mediated ethanol/thermal cross-protection in yeast appear in 00052.txt (doi:10.1007/s10295-018-2107-4) and 00078.txt (doi:10.1016/j.bjm.2017.09.002), but neither tests isobutanol, so for those mechanisms the transfer is genuinely undemonstrated and the cap would be correct. RECOMMENDATION for the curator choosing a concrete test case as the source_hint asks: use BOTH tryptophan/membrane (transfer demonstrated, cap should lift) and heat-shock (transfer not demonstrated, cap should hold). A single test case exercises only one branch of the rule and will pass a broken implementation. ASSAY TYPES DIFFER BETWEEN THE TWO LITERATURES exactly as the source_hint warned: 00052.txt scores ethanol cross-protection by spot assay on plates, 00791.txt scores isobutanol by colony size, survival rate and recovery time, 00118.txt by OD600 in liquid. Per-row assay_type is mandatory or these are silently pooled.
