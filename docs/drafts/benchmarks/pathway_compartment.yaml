# NOTHING HERE IS VERIFIED. No confidence value is asserted; that is a curator's act.
# Tally: supported 7 / partially_supported 3 / contradicted 1 / not_in_corpus 0
# Curator's attention is most needed on BM-PATH-007 (contradicted), BM-PATH-003 (cluster type
# disputed inside the corpus) and BM-PATH-006 (statement is malformed as written).
#
# DEAD `corpus_file:` MARKERS REPLACED, 2026-09-22 — 30 of them in this file.
# They pointed at a numbered scratchpad cache (`NNNNN.txt`) that no longer exists anywhere on
# this machine, so as provenance they could not be dereferenced by anyone, including the
# 2026-09-22 provenance sweep. That sweep also established that the cache was not a DIFFERENT
# text — every quote checked against it re-resolves character-identically against the
# `fulltext_asset` store — so nothing is lost by dropping the pointer and keeping the DOI.
#   30 were removed as redundant: a `doi:` or `publication:` sat beside them in the
