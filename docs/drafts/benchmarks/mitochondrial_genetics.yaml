# DRAFT - evidence found in the local corpus for data/benchmarks/known_positives.yaml
# category: mitochondrial_genetics (6 entries), in input order
#
# This is a read-only evidence-finding pass. No confidence value is asserted here and
# nothing is marked verified - that is a human curator's act. Every quote is copied
# character-for-character out of the corpus text, including hard line breaks and
# PDF-extraction artefacts; empty parentheses "()" are where the stored text dropped a
# citation marker.

- id: BM-MIT-001
  verdict: supported
  publication: "doi:10.7717/peerj.8362"
  corpus_file: "01307.txt"
  quote: |-
    Also, a number of TGG were replaced with UGA, which is a stop codon in the universal codon system but is translated into tryptophan in yeast mitochondria ().
  quote_supports: >-
    Establishes directly that UGA is a stop codon under the standard/universal code but
    is read as tryptophan in yeast mitochondria, and that the difference is relied on in
    practice - TGG codons were deliberately swapped to UGA so that a Cas9 gene would be
    translated only inside mitochondria. It does NOT name "NCBI translation table 3" or
    cite the NCBI page, so the table-number wording of the benchmark statement is not
    what this sentence supplies.
  searches_run:
    - "UGA[^.]{0,80}(tryptophan|Trp)"
    - "(yeast|Saccharomyces) mitochondrial (genetic )?code|translation table 3|NCBI table 3|codon table 3"
    - "mitochondrial genetic code|recod(ed|ing) .{0,60}mitochondrial|codon usage of (the )?mitochondri"
  note: >-
    The corpus does independently state the UGA=Trp reassignment for S. cerevisiae
    mitochondria, so the wiring check has a real source behind it and is not resting only
    on src/fermdb/genetic_code.py. Two further corpus papers tie the name "translation
    table 3" to S. cerevisiae without restating UGA=Trp - doi:10.1093/nar/gkq1345
    (00401.txt, methods - "translation table 4 ... except for S. cerevisiae, where
    translation table 3 (yeast mitochondrial code) applies") and
    doi:10.3389/fmicb.2023.1268944 (01060.txt). Caution - 00401.txt also discusses
    UGA(Trp) in its results, but that passage is about Candida species, not S. cerevisiae;
    do not reuse it as an S. cerevisiae source. No corpus text cites the NCBI taxonomy
    genetic-codes page itself, so the primary citation named in source_hint is still
    uncovered by the corpus.

- id: BM-MIT-002
  verdict: partially_supported
  publication: "doi:10.1093/nar/gkq1345"
  corpus_file: "00401.txt"
  quote: |-
    The presence of tRNATrp with an UCA anticodon, and the absence of an S. cerevisiae homolog of the abnormal tRNAThr1 with 8-nt in the anticodon loop (decoding CUN as threonine), indicate that UGA and CUN codons are recognized as tryptophan and leucine, respectively.
  quote_supports: >-
    Supports CUN = threonine as a property of S. cerevisiae. The parenthetical states that
    the abnormal tRNAThr1 with an 8-nt anticodon loop decodes CUN as threonine, and the
    sentence's logic is that the Candida species studied here LACK the S. cerevisiae
    homolog of that tRNA and therefore read CUN as leucine instead - so S. cerevisiae is
    the reference organism that carries the CUN-to-Thr tRNA. It does NOT enumerate the four
    codons CUU/CUC/CUA/CUG, does not say "translation table 3", and says nothing about
    mistranslation risk when moving a leucine-rich gene into mtDNA.
  searches_run:
    - "CU[NX] codons?|CUN family|leucine codons? .{0,40}threonine|threonine .{0,60}CU"
    - "\\bCU[NAGU]\\b|\\bCTN\\b"
    - "(yeast|Saccharomyces) mitochondrial (genetic )?code|translation table 3|NCBI table 3|codon table 3"
  note: >-
    Read the quote carefully before reusing it - its main clause ("CUN codons are
    recognized as ... leucine") is about Candida, and only the parenthetical carries the
    S. cerevisiae-relevant CUN=Thr fact. A curator may reasonably want a cleaner source
    than this. The second-best corpus source is doi:10.3389/fmicb.2023.1268944 (01060.txt),
    and its preprint doi:10.1101/2023.07.28.551029 (00426.txt), which say NCBI table 3 is
    defined "based on additional reassignments of AUA and CUN codons" but never name the
    destination amino acids. Nothing in the corpus lists all four CUN codons, so the
    expected_outcome's "all four of CUU, CUC, CUA, CUG" cannot be checked against a corpus
    source. The rest of the benchmark statement - that this is "the most dangerous
    difference for anyone moving a gene into mtDNA because a leucine-rich sequence
    mistranslates extensively while still looking like a sensible gene" - is an editorial
    judgement with no corpus support and is not testable by the stated query shape.

- id: BM-MIT-003
  verdict: partially_supported
  publication: "doi:10.3389/fmicb.2023.1268944"
  corpus_file: "01060.txt"
  quote: |-
    Yeast mitochondrial translation tables fall into either the Mold, Protozoan, and Coelenterate Mitochondrial Code and the Mycoplasma/Spiroplasma Code (NCBI table 4, hereafter referred to as the fungal code), which is consistent with other fungi, or the yeast mitochondrial code (NCBI table 3, originally based on S. cerevisiae, hereafter referred to as the Saccharomyces code) based on additional reassignments of AUA and CUN codons, which typically define the order Saccharomycetales.
  quote_supports: >-
    Establishes that NCBI translation table 3 is the yeast mitochondrial code, that it was
    originally based on S. cerevisiae, and that AUA is one of the two codons reassigned in
    it relative to the fungal code (table 4, in which AUA is isoleucine). It does NOT state
    what AUA is reassigned TO. The specific claim "AUA reads as methionine rather than
    isoleucine" is therefore only half covered - the corpus confirms AUA is reassigned in
    table 3, not that the new assignment is methionine.
  searches_run:
    - "\\bAU[AG]\\b|\\bAUA\\b  --require  isoleucine|methionine|codon reassign|read as"
    - "AUA.{0,60}(Met|methionine)"
    - "(Met|methionine).{0,60}AUA"
    - "AUA codon"
    - "codon reassignment"
  note: >-
    No corpus document anywhere states AUA = Met. The only corpus sentences naming AUA as
    reassigned in table 3 are this one and the identical text in the bioRxiv preprint
    (00426.txt). doi:10.1099/mic.0.038646-0 (00422.txt) states AUA = isoleucine, but for
    Candida subhashii under the fungal code, so it is NOT a contradiction of the
    S. cerevisiae claim and should not be read as one. Worth flagging - the same 01060.txt
    passage continues that in many Saccharomycetales the AUA reassignment is not supported
    by codetta and the modified tRNA required for it is not present, making the AUA leg of
    table 3 the shakiest part of that table even in the published literature.

- id: BM-MIT-004
  verdict: supported
  publication: "doi:10.1093/nar/gkx127"
  corpus_file: "00411.txt"
  quote: |-
    Indeed, the S. cerevisiae mitochondrial translational activators can bind to the 5΄-UTRs of their respective cognate mRNAs (–). In S. cerevisiae, translation of COX1, COX2, COX3 and CYTB mRNAs requires specific nuclear-encoded proteins: Pet309/Mss51/Mam33 for COX1 (,–), Pet111 for COX2 (,), Pet54/Pet122/Pet494 for COX3 (–) and Cbp3/Cbp6 for CYTB ().
  quote_supports: >-
    Covers both halves of the statement in one passage - that S. cerevisiae mitochondrial
    translational activators bind the 5' UTRs of their own cognate mRNAs (so translation is
    gene-specific rather than generic), and the two named examples the benchmark uses,
    Pet111 for COX2 and Pet309 with Mss51 for COX1 (given here as Pet309/Mss51/Mam33). It
    adds Pet54/Pet122/Pet494 for COX3 and Cbp3/Cbp6 for CYTB. It says nothing about
    insertion-site design, displaced genes, or what the atlas query layer should return.
  searches_run:
    - "translational activator  --require  5.?(UTR|.untranslated|.-UTR)|leader"
    - "(yeast|Saccharomyces) mitochondrial (genetic )?code|translation table 3"
  note: >-
    This is the best-covered entry in the set - several independent corpus papers say the
    same thing and could be used instead or alongside. doi:10.1093/nar/gkac1229 (00389.txt)
    states it most crisply in its abstract ("mitochondrial mRNAs require specific
    translational activators, which orchestrate protein synthesis by recognition of their
    target gene's 5'-untranslated region"); doi:10.1091/mbc.e15-04-0222 (00316.txt) says
    each mitochondrial gene is controlled by one or more dedicated translational activators;
    doi:10.1016/j.xpro.2022.101359 (00154.txt) states the design consequence that actually
    matters for this benchmark - a reporter inserted into mtDNA was deliberately placed
    under the COX2 5' UTR because mitochondrial translation requires activators that
    interact with the UTRs of mRNAs. One consequence for the expected_outcome - the
    "one or more" phrasing in 00316.txt means a per-locus activator_required field should
    permit multiple activators per gene, not exactly one.

- id: BM-MIT-005
  verdict: partially_supported
  publication: "doi:10.1093/nar/gkx426"
  corpus_file: "00412.txt"
  quote: |-
    The strains are deleted for the nuclear ARG8 gene, and the reporter is a recoded version of ARG8, termed ARG8m, that encodes a matrix-localized biosynthetic enzyme, which allows us to look directly at mitochondrial translation by scoring the growth of yeast in the absence of arginine and accumulation of the reporter protein. In the strain XPM10b, the COX1 coding sequence was completely replaced by ARG8m (Δcox1::ARG8m) (Figure ) and in the strain XPM78a, ARG8m was introduced at the end of the 512-nt long intronless COX1 coding sequence [COX1 (1–512)::ARG8m] (Figure ). In these strains, ARG8 mRNA translation is dependent on the COX1 5΄- and 3΄-untranslated regions (UTRs).
  quote_supports: >-
    Establishes the core of the claim - ARG8m is a recoded version of the nuclear ARG8
    gene, it encodes a matrix-localized (that is, soluble) biosynthetic enzyme, it is
    expressed from mtDNA in place of a mitochondrial ORF, and its translation depends on
    the replaced gene's 5' and 3' UTRs, which is exactly the mechanism the benchmark
    describes. It does NOT support the locus restriction - the locus used here is COX1,
    not COX3 or COX2. It also says nothing about a feasibility rating or about the
    respiration consequence of displacing the resident gene.
  searches_run:
    - "ARG8|Arg8m  --require  reporter|matrix|recoded|COX3|COX2"
    - "Arg8m|ARG8m  --require  soluble|matrix|acetylornithine|aminotransferase|arginine biosynthesis"
    - "cox3::ARG8|COX3::ARG8|ARG8m.{0,80}COX3|Steele"
  note: >-
    The "at the COX3 or COX2 locus" clause is too narrow and should be widened rather than
    curated as verified. The corpus shows ARG8m used at many mtDNA loci - cox1 deleted and
    replaced by ARG8m, and COX1(1-512)::ARG8m (00412.txt); cox3 deleted and replaced by
    ARG8m, plus ARG8m under COX1 5'/3' UTRs (doi:10.1091/mbc.e15-04-0222, 00316.txt); ARG8m
    replacing the COB, COX1, COX2 and VAR1 ORFs (doi:10.1093/nar/gkac1229, 00389.txt);
    ARG8m under VAR1 UTRs (doi:10.1093/nar/gkaa424, 00388.txt); ARG8m inserted 99 bp into
    COX2 (doi:10.1371/journal.pgen.1005664, 00864.txt); atp6::ARG8m
    (doi:10.1016/bs.mie.2024.07.028, 00070.txt and doi:10.1242/dmm.049783, 00845.txt); and
    ATP9 replaced by ARG8m (doi:10.1371/journal.pgen.1002876, 00860.txt). On provenance -
    00070.txt and 00845.txt both describe ARG8m as a mitochondrial version of the nuclear
    ARG8 gene encoding a mitochondrial protein involved in arginine biosynthesis and credit
    Steele et al. 1996, whose full citation appears in 00070.txt's reference list (Steele,
    Butler and Fox 1996, PNAS 93:5253-5257, "Expression of a recoded nuclear gene inserted
    into yeast mitochondrial DNA is limited by mRNA-specific translational activation"), so
    the source_hint's recalled authors and year check out - but that primary paper is NOT
    in the corpus and the locus its original construct used is stated nowhere in the corpus.
    The respiration consequence the expected_outcome asks for IS attested - 00860.txt shows
    that yeast with ATP9 replaced by ARG8m grow on glucose without arginine but cannot grow
    on glycerol. Nothing in the corpus rates feasibility as routine, specialist or frontier;
    that part of the expected_outcome has no source and is a curator's judgement call.

- id: BM-MIT-006
  verdict: contradicted
  publication: "doi:10.7717/peerj.8362"
  corpus_file: "01307.txt"
  quotes:
    # SPLIT BY THE CURATOR, 2026-09-21. The agent submitted these as ONE quote joined by a literal
    # "[...]" and disclosed the splice honestly. A spliced quote still cannot be re-resolved at an
    # offset, so it cannot serve as evidence however honest the splice is. Each span below was
    # re-read in the source independently and each passes. The finding is unchanged.
    - |-
      Organelles have been considered off-limits to CRISPR due to their impermeability to most RNA and DNA. This has prevented applications of Cas9/gRNA-mediated genome editing in organelles
    - |-
      We confirmed donor DNA insertion at the target sites facilitated by homologous recombination only in the presence of Cas9/gRNA activity in yeast mitochondria and Chlamydomonas chloroplasts.
    - |-
      This is the first demonstration of CRISPR-mediated genome editing in both mitochondria and chloroplasts in two distantly related organisms.
  quote_supports: >-
    Contradicts the headline of the statement. The corpus contains a demonstrated
    CRISPR-Cas route for editing yeast mtDNA, and one that INSERTS rather than deletes -
    donor DNA was integrated at Cas9/gRNA-induced target sites in S. cerevisiae
    mitochondria, and the authors describe it as the first demonstration of CRISPR-mediated
    genome editing in mitochondria. The first sentence of the quote does support the premise
    the benchmark rests on, that organelles are impermeable to most RNA and DNA, but the
    paper's answer is to bypass import rather than to solve it - Cas9 and the guide RNAs
    are expressed from a plasmid that is itself delivered into mitochondria biolistically
    and replicates there. The quote does not address mitoTALEN or mitoZFN at all. Note
    that the bracketed ellipsis between the two paragraphs marks the omitted middle of the
    abstract; both halves are verbatim.
  searches_run:
    - "mitoTALEN|mitoZFN|mtZFN|DdCBE|heteroplasmy shift"
    - "biolistic|microprojectile|particle bombardment  --require  rho|\\u03c10|\\uf072|recipient|transformation of mitochond"
    - "UGA[^.]{0,80}(tryptophan|Trp)"
  note: >-
    What the corpus actually says, part by part. (1) "There is no established CRISPR-Cas
    route for editing yeast mtDNA" is contradicted by doi:10.7717/peerj.8362 (2020,
    01307.txt), which reports donor-DNA insertion in yeast mitochondria that occurred only
    in the presence of Cas9/gRNA activity. This is the row going stale exactly as the
    source_hint predicted, except that it had already gone stale before the claim was
    written. (2) The guide-RNA-import premise is still supported, and by a later source -
    doi:10.3390/microorganisms11041040 (2023, 01210.txt) states that mtDNA editing with
    CRISPR-Cas9 "remains highly challenging because of the difficulties in transporting
    gRNA and donor DNA into the mitochondria", that "it remains unclear how functional long
    polynucleotides, such as gRNA and donor DNA, can be transported to mtDNA", and in its
    conclusion that "the established successful example of modifying mtDNA sequences using
    Cas9/gRNA complexes remains insufficient in editing efficiency". The same review reports
    evidence pointing the other way too - in yeast, MTS-Cas9 plus an ordinary SNR52-driven
    gRNA against ATP8 raised the rate of mtDNA-depleted cells, which the authors read as
    some gRNA reaching the matrix by an intrinsic mechanism. So "import is unsolved" is
    defensible on the corpus; "no established route" is not. (3) The biolistic-into-rho-zero
    route IS well attested - doi:10.1016/bs.mie.2024.07.028 (00070.txt) describes cloning
    into a pUC19-based plasmid, biolistic transformation into a yeast strain totally lacking
    mtDNA and bearing kar1-1, then crossing to a rho-plus recipient; the same route appears
    in doi:10.1016/j.xpro.2022.101359 (00154.txt, strain MOY160, rho0 kar1-1),
    doi:10.1093/genetics/iyaf037 (00370.txt, DFS160 rho0), doi:10.1126/sciadv.aav1848
    (00461.txt) and doi:10.1242/dmm.049783 (00845.txt). Watch the PDF-extraction trap in
    00070.txt - rho is rendered as the private-use glyph U+F072, so the genotype reads as
    U+F072 followed by 0 rather than as rho-zero. (4) The mitoTALEN / mitoZFN leg is NOT
    supported for yeast. The only mitoTALEN paper in the corpus,
    doi:10.3390/genes12020153 (01137.txt), is about PLANT mitochondrial genomes (rice,
    rapeseed, Arabidopsis) and reports large deletions repaired by homologous recombination
    rather than NHEJ; 01210.txt tabulates DdCBE, TALED and HiFi-DdCBE for mammalian cells
    only. This benchmark should not assert mitoTALEN or mitoZFN behaviour in S. cerevisiae
    on the strength of the corpus. Suggested rewrite for the curator - split this compound
    row into a technique-by-technique claim, and date-stamp the CRISPR leg.
