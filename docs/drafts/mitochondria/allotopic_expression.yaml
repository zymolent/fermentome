    recoded_to_table_1: "not applicable — plant mitochondria use the universal code; edited cDNA was cloned"
    targeting_sequence: "MT peptide of the S. cerevisiae ATPase delta subunit"
    sequence_changes_required: none
    function_restored: not_tested
    readout: "fluorescence microscopy of MT-Nad-EGFP fusions; growth phenotypes under K+, Na+, H+ load"
    verification_method: microscopy
    import_proxy_reported: null
    why_it_failed: >-
      Not a rescue experiment and cannot be one — S. cerevisiae has no complex I for these
      subunits to join, so no functional complementation was available to test. What the paper
      does establish is the negative control that matters: without the MT peptide the Nad1-EGFP
      fusion did not reach mitochondria at all.
    publication: doi:10.3390/ijms23074054
    evidence:
      - |-
        In order to direct the bamboo Nad1, Nad2, Nad4, and Nad5 subunits to yeast mitochondria, an MT peptide (encoded by nuclear mt gene) of the ATPase δ subunit from S. cerevisiae [] was employed to fuse at the 5′-terminal of the nad1, nad2, nad4, and nad5 genes.
      - |-
        Mitochondrial localizations of the MT-Nad1-EGFP, MT-Nad2-EGFP, MT-Nad4-EGFP, and MT-Nad5-EGFP fusion proteins were confirmed by fluorescence microscopy.
      - |-
        In this study, in the absence of the MT peptide, the import of Nad1-EGFP into yeast mitochondria failed because the green fluorescence mistily appeared over the whole cell ().
    why_it_matters: >-
      Included deliberately as the weakest record in the file, to mark the line. Four
      multi-transmembrane mtDNA-encoded proteins were targeted to yeast mitochondria and detected
      there by fluorescence — and that is the entire result. No processing, no assembly, no
      function. Under this file's own standard (and doi:10.1093/nar/gkq769's), microscopy
      co-localisation of a GFP fusion is the evidence class that produced the field's most famous
      false positive. It counts as an attempt; it does not count as an import success.

# ======================================================================== what is NOT in here

scope_exclusions:

  - item: "doi:10.26508/lsa.202301965 — 'Allotopic expression of COX6'"
    # ATTRIBUTION ADDED 2026-09-22. The DOI was only ever inside the `item` string, which is prose
    # and not a field any tool reads as a source, so the quote below had no machine-readable
    # attribution. Re-resolved byte-exact at [104, 302) in the stored text.
    publication: doi:10.26508/lsa.202301965
    reason: >-
      Wrong direction. Despite the title, this is a NUCLEAR gene moved INTO mtDNA — the strategy-E
      direction, not the mirror image. The word "allotopic" is used in this literature for
      relocation in either direction and the title is not a reliable filter. It belongs with
      `heterologous_orf_precedents.yaml`, not here, and the same paper reports that the Rieske
      FeS protein (Rip1) was previously transferred to mtDNA — another strategy-E precedent that
      file may not yet hold.
    evidence:
      - |-
        Relocation of COX6 from nuclear to the mitochondrial genome helps unveil the role of Atco (Atp9–Cox6 complex) in coupling the biogenesis of cytochrome oxidase and ATP synthase in yeast mitochondria.

  - item: "yeast NDI1 expressed in mouse cells (doi:10.1093/nar/gkq769)"
    reason: >-
      Used in that paper as a hydrophilic positive control for the import route, and it works —
      but NDI1 is a NUCLEAR gene in S. cerevisiae, so moving it to a mouse nucleus is not a
      relocation out of mtDNA. The paper's own wording calls it "mitochondrial-encoded", which
      appears to be an error in the source. Not recorded as a relocation attempt; flagged here so
      the next reader does not re-find it and count it.

# ============================================================== the answer §3 actually asked for

consequences_for_the_programme:

  recoding:
    finding: >-
      Recoding is not a risk. Across every record above, moving a gene between translation table 3
      and table 1 is a solved, commoditised step, and in the one case where the work was counted
      (ATP8) only ONE of thirty-one changed codons was required by the code itself — the other
      thirty were codon-bias optimisation. Not a single failure in this file is attributed to
      recoding. Every failure is attributed to import, to assembly, or to experimental artefact.
    consequence_for_strategy_E: >-
      MITOCHONDRIAL_PROGRAM.md treats table-3 recoding as a design constraint. On this evidence it
      is a design chore. The real lesson is the inverse one: the thirty bias codons say a strategy-E
      ORF recoded only for the dictionary is half-done, and should also be optimised for the
      matrix's own codon preferences.

  import:
    finding: >-
      Import is THE constraint, and it is specifically a transmembrane-helix constraint. Every
      partial and every failed case above is a membrane protein whose helix will not pass TIM23;
      the proposed mechanisms (IMS degradation by i-AAA, stop-transfer instead of conservative
      sorting, stalled precursor with the MTS held by PAM/Hsp70) all require a helix to stall on.
      Both soluble products in the corpus relocated to full function with no sequence change at
      all, one of them using the presequence that explicitly fails for hydrophobic cargo.
    consequence_for_strategy_C: >-
      DUET's KDC and ADH are soluble matrix enzymes. The mirror-image argument therefore predicts
      that strategy C should NOT be import-limited for them, and the import ceiling that
      MITOCHONDRIAL_PROGRAM.md §1 names as the precondition for escalating to strategy E is
      unlikely to be reached. This is evidence AGAINST needing strategy E, and it is the first
      such evidence the programme has. It is a prediction, not a measurement: it should be tested
      by the strategy-C instrumentation ISOBUTANOL_PROGRAM.md already mandates, not assumed.
    numbers_to_compare_against:
      - "6% of wild-type mature protein — allotopic Cox2-W56R, low-copy (doi:10.1093/genetics/iyaf037)"
      - "12% of wild-type mature protein — the same construct, high-copy"
      - "85% of wild-type mature protein — after TMH2 engineering; complex IV to 70%"
      - "30-40% of wild-type assembled ATP synthase — relocated ATP9 via a fungal orthologue (doi:10.1371/journal.pgen.1002876)"
      - "~40% below wild-type CcO — allotopic Cox2-W56R by in-gel activity (doi:10.1091/mbc.e17-09-0560)"
    caveat_on_those_numbers: >-
      None of these is an import efficiency in the schema's sense (imported / synthesised, 0-1).
      They are mature-protein-inside-mitochondria as a fraction of wild type, which convolves
      import with processing, assembly and turnover. `import_efficiency_reported` should be left
      NULL for every one of these records; the numbers belong in a text field. No paper in this
      corpus reports a true import fraction for an allotopically expressed protein.

  what_mitochondrial_synthesis_still_wins:
    finding: >-
      One result in this file favours strategy E honestly and it should not be buried. When the
      mitochondrially made and the allotopically imported Cox2 were expressed in the same cell,
      the assembled enzyme was built overwhelmingly from the mitochondrially made copy. Internal
      synthesis beats import in direct competition, for a protein whose assembly factors expect
      it from inside.
    consequence: >-
      This is an argument for E that survives everything above — but only for cargo whose assembly
      machinery is co-evolved with mitochondrial synthesis, which is exactly what an OXPHOS subunit
      is and exactly what a heterologous decarboxylase is not. DUET's enzymes have no
      mitochondrial assembly factors to disappoint.

# ========================================================================== what remains open

open_gaps:
  - gap: "a true import efficiency for any allotopically expressed protein"
    status: never_reported_in_this_corpus
    note: >-
      The field reports steady-state mature protein, not imported fraction. If the programme wants
      `import_efficiency_reported` populated for anything, it will have to be measured in-house;
      no literature value exists here to seed it.
  - gap: "why cytochrome b has never been relocated"
    status: unexplained
    note: >-
      The universal failure case has no published mechanism in this corpus — only the observation
      that it has never worked and that the protein has eight transmembrane segments.
  - gap: "allotopic expression of a soluble ENZYME with a cofactor or an oligomeric state"
    status: never_attempted
    note: >-
      Var1 is soluble but is a structural ribosomal protein; bI4 is a maturase. Neither requires a
      diffusible cofactor to be loaded nor a homo-oligomer to be assembled after import. This is
      the SAME gap `heterologous_orf_precedents.yaml` records from the mtDNA side, and the fact
      that it is open in both directions is itself worth noting: nothing in the mitochondrial
      corpus, either direction, speaks to TPP loading or tetramer assembly in the matrix.
  - gap: "stability of a relocated construct over generations"
    status: open
    note: >-
      Only touched once, and negatively: overexpression of relocated VAR1 raises petite frequency.
      Not pursued here; it is a separate line of the §3 corpus table.

# =============================================================================== provenance
#
# Method. All 1,309 readable stored full texts were searched by regex for allotopic / relocation
# to the nucleus / nuclear version / recoded version / hydrophobicity / mesohydrophobicity /
# import efficiency. Eleven documents bear on the question and every one of them was read. Quotes
# were then extracted from the cached text BY OFFSET rather than retyped, and each was
# re-resolved through fermdb.llm.validate.verify_span against the text load_source_text returns —
# exact match, no normalisation, single unique occurrence. 78 quotes, 78 passes, 0 failures.
#
# Two things a reviewer should check before this file is promoted out of drafts/:
#
#   1. SECONDARY SOURCES. Five records rest on review statements rather than on experiments read
#      here: bI4, cytochrome b, MT-ATP6/MT-ND4, MT-ATP8+MT-ATP6, and soybean COX2. Each carries
#      `source_type: secondary`. The primary papers are not in this corpus. The cytochrome b
#      record in particular is a single clause in another paper's introduction, and it is doing a
#      lot of work in the hydrophobicity ladder at the top of this file.
#   2. THE LADDER IS ORDINAL, NOT MEASURED. No paper here reports a hydrophobicity SCORE against
#      an outcome. The ordering (0 TM → 1 → 2 → 8) is read off the protein biology, and the two
#      quantitative handles the field uses — mean helix hydrophobicity and "mesohydrophobicity" —
#      are named in this corpus but their values are not. The correlation is strong and stated by
#      four independent papers; it is not a regression, and it should not be written up as one.
