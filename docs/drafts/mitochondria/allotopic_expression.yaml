    import_proxy_reported: "only the unprocessed precursor detected, in very small amounts, exclusively in mitochondria"
    why_it_failed: >-
      Targeted correctly, imported incorrectly, and then destroyed. The precursor reaches
      mitochondria but cannot cross the inner membrane; it sits in the intermembrane space and is
      degraded by the i-AAA protease (Yme1). The proof is a deletion: in a yme1 null the
      unprocessed protein accumulates to much higher levels while the mature form stays absent,
      which separates "not imported" from "not made". Note this contradicts an earlier in vitro
      result showing yeast Atp9p fused to an MTS could be imported and processed by isolated
      mitochondria — in vitro import does not predict in vivo function.
    publication: doi:10.1371/journal.pgen.1002876
    evidence:
      - |-
        Nuclear Versions of the Yeast Mitochondrial ATP9 Gene Fail to Rescue Δatp9 Yeast
      - |-
        In order to express the yeast ATP9 gene from nuclear DNA, we synthesized a version codon-optimized for nuclear expression in yeast and fused to a mitochondrial targeting sequence (MTS) from the subunit 9 precursor encoded by the nuclear gene PaAtp9-7 in P. anserina (named yAtp9-Nuc, and ).
      - |-
        Nonetheless, upon transformation with yAtp9-Nuc, Δatp9 yeast did not grow on respiratory substrates even after more than 20 days (). Using antibodies against yeast Atp9p, only a protein with the size of the unprocessed yAtp9-Nuc was detected in very small amounts and exclusively in mitochondria (). This indicates that yAtp9-Nuc is targeted to mitochondria, but cannot cross the mitochondrial inner membrane.
      - |-
        Using antibodies against yeast Atp9p, only a protein with the size of the unprocessed yAtp9-Nuc was detected in very small amounts and exclusively in mitochondria ().
      - |-
        We confirmed the i-AAA-mediated degradation of yAtp9-Nuc by expressing the latter protein in a Δyme1 strain. In this strain, the unprocessed protein was far more abundant, while the mature form remained almost absent. These observations verify the defective in vivo transport of yAtp9-Nuc across the inner membrane as well as its rapid degradation in the intermembrane space ().
    why_it_matters: >-
      The mechanism of failure is IMS proteolysis of a protein that stalled at the inner membrane.
      That failure mode requires a transmembrane segment to stall on. It is also the sharpest
      warning in this file about evidence standards: an MTS that demonstrably works (the same MTS
      fully rescues a Δatp8 strain) plus correct mitochondrial localisation plus a detectable band
      still add up to zero function. "Detected the protein" and "restored respiration" are not
      the same claim, and here they are separated by everything.

