  - gene: ATP9
    construct: yAtp9-Nuc
    product: "Atp9p (subunit 9/c, the proteolipid of the ATP synthase c-ring)"
    product_class: "inner-membrane proteolipid — extractable into organic solvents"
    transmembrane_segments: 2
