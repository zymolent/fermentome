      block is the SECOND transmembrane helix, not the first. Lowering TMH2 hydrophobicity is
      proposed to push the precursor onto the conservative-sorting route instead of stop-transfer,
      so the protein reaches the matrix and is then inserted by Oxa1 the way a mitochondrially
      made Cox2 would be. Expression-level tuning — promoter, copy number, MTS identity — gave
      only moderate gains; protein sequence was what mattered.
    publication: doi:10.1093/genetics/iyaf037
    evidence:
      - |-
        Western blot analysis confirmed the absence of Cox2p in our Δcox2::ARG8m deletion strain, and we saw a twice higher amount of mature Cox2p in high-copy conditions compared with low-copy conditions (12% vs 6%, ).
      - |-
        However, our results demonstrated that Cox2-W56R protein is still poorly adapted to allotopic expression as: (1) only low levels of mature Cox2-W56R allotopic protein are detected and (2) a large fraction of the unprocessed form is accumulated and might impose a stress on cells.
      - |-
        When we used pADH1 and pJEN1, the OCR increased by 40% and the abundance of the mature Cox2-W56Rp was markedly increased by around 4-fold in comparison to the condition using pACT1.
      - |-
        The last step of this optimization focused on testing different MTSs, but none of the candidate MTSs yielded a better phenotype than the OXA1 MTS.
      - |-
        Interestingly, we observed that several favourable mutations were concentrated in the second TMH, resulting in a significant decrease in hydrophobicity ( and ).
      - |-
        We observed that fine-tuning of these expression parameters afforded only a moderate effect on COX2-W56R allotopic expression. Instead, engineering the protein sequence improved the level of mature Cox2p and cytochrome c oxidase accumulation (up to 70% of the WT level, , ) and decreased the cytoplasmic accumulation of non-matured form ().
      - |-
        When we measured the specific activity of the Complex IV (), we noticed that it was restored to 70% of the WT level and >2-fold and 3-fold higher than in conditions expressing the original construct on a high- and low-copy vector, respectively.
      - |-
        Interestingly, when we measured the Cox2p intramitochondrial level, it was restored to a near-WT level (85% of the WT level, ) while the Cox1p abundance was about 70% of the WT level.
    why_it_matters: >-
      The only real import numbers in the corpus, and they are the ones ISOBUTANOL_PROGRAM.md
      wants. 6-12% of wild-type mature protein is what one transmembrane helix costs at the TIM23
      step; 85% is what it costs after the helices have been engineered. Two consequences.
      (a) If strategy C were ever import-limited for a MEMBRANE cargo, this is the size of the
      ceiling — roughly tenfold — and it is the number to compare a measured strategy-C
      localization against before escalating to E.
      (b) The lever that worked was protein engineering, not expression engineering. Promoter and
      copy number bought 40% more OCR; changing two residues bought seven-fold more mature
      protein. If a DUET strategy-C construct ever does come back import-limited, this says to
      screen enzyme variants, not promoters — which is the same conclusion
      `heterologous_orf_precedents.yaml` reached from the opposite direction with superfolder GFP.

