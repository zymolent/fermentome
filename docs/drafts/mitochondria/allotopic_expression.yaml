# Allotopic expression attempts — mtDNA genes moved to the nucleus, recoded, and re-imported.
#
# MITOCHONDRIAL_PROGRAM.md §3 budgets this at ~20 and gives the reason in six words: "The
# mirror-image problem; informative about recoding and import". Strategy E puts a nuclear gene
# into mtDNA. Allotopic expression is the same experiment run backwards, and it is the only body
# of work that measures the two things strategy E needs and cannot measure directly — how well
# recoding works, and what actually limits import of a protein the matrix normally makes itself.
#
# THE HEADLINE, and it is a result the programme can act on. The corpus does not merely mention
# the hydrophobicity hypothesis; it states it explicitly in four independent papers, and the
# attempts it records line up with it almost without exception. Sorted by how hydrophobic the
# relocated product is, the outcomes are monotone:
#
#     Var1      0 TM, soluble matrix    → full rescue, no sequence change, hydrophilic MTS
#     bI4       soluble RNA maturase    → full rescue, MTS + recoding sufficient
#     Atp8      1 TM, 48 codons         → full rescue, MTS + recoding sufficient
#     Cox2      2 TM                    → partial only, and ONLY with hydrophobicity-lowering
#                                          substitutions in TMS1; still import-limited
#     Atp9      2 TM but a proteolipid  → total failure of the yeast gene; partial rescue only by
#                                          substituting a less hydrophobic fungal orthologue
#     cytochrome b  8 TM                → "entirely unsuccessful", in any organism, ever
#
# WHAT THAT MEANS FOR DUET, which is why this table was commissioned. ISOBUTANOL_PROGRAM.md makes
# `import_efficiency_reported` mandatory because it is the trigger for escalating from strategy C
# (nuclear genes + MTS) to strategy E (genes in mtDNA). This table says that trigger is unlikely
# to fire for DUET. Every documented import failure here is a failure to drag a transmembrane
# helix through TIM23. DUET's KDC and ADH are soluble matrix enzymes with no TM helix at all —
# the Var1 case, not the Cox2 case. Var1 relocated with nothing but a COX4 presequence and a
# codon change, and COX4 is specifically the MTS that FAILS for hydrophobic cargo. The mirror
# image of that is: for a soluble enzyme, import is not the expected bottleneck, and the
# import-ceiling condition that §1 of MITOCHONDRIAL_PROGRAM.md sets as the precondition for
# strategy E is therefore unlikely to be met by this pathway's enzymes.
#
# That is an argument against needing strategy E at all, and it is worth stating plainly because
# it points the opposite way from the rest of the mitochondrial programme's momentum.
#
# THE NUMBERS. Nobody in this corpus reports an import efficiency as a fraction of synthesised
# precursor — the field does not measure it that way. What it reports instead is mature protein
# inside mitochondria as a percentage of wild type, which is import × processing × stability, and
# is the nearest usable proxy. Those numbers are in `import_proxy_reported` on each record. The
# single most useful one: the original allotopic Cox2-W56R construct reaches 6% (low copy) to 12%
# (high copy) of wild-type Cox2p. That is the cost of pulling one transmembrane helix through
# TIM23 — an order of magnitude — and it is the number strategy C would be measured against.
#
# EVERY QUOTE BELOW was extracted from the stored full text by offset, then re-resolved through
# fermdb.llm.validate.verify_span against the text load_source_text returns (exact, no
# normalisation): 78 quotes, 78 passes, 0 failures. `evidence` is a LIST of separate verbatim
# quotes on purpose. No quote in this file splices two passages; where two passages are needed
# they are two list items.
#
# THAT CLAIM WAS FALSE WHEN FIRST WRITTEN, AND IS TRUE AGAIN AS OF 2026-09-22. It was false in a
# specific and instructive way: all 78 quotes did pass, but two of them passed against the paper
# they came from rather than against the paper their record names, and eleven more named no paper
# at all, so they could not be checked from this file in either direction. The 2026-09-22
# provenance sweep caught one of the two and seven of the eleven; the repair pass that followed it
# re-swept all 78 and found the rest. What changed:
#
#   * 2 quotes re-attributed. `relocation_attempts[0]` (VAR1) held a Cox2 sentence from
#     doi:10.1016/j.gendis.2019.08.001, and `relocation_attempts[2]` (ATP8) held a sentence from
#     doi:10.1093/nar/gkaa424. Both were bare list items inheriting a record-level `publication:`
#     that did not contain them. Each now sits in its own attributed block with an
#     `attribution_corrected` note recording the previous attribution, the date and the check.
#     NEITHER RECORD'S CLAIM CHANGES — that was verified field by field, not assumed, and the
#     check is written out in each block.
#   * 11 quotes given attribution they never had: the six in `hydrophobicity_hypothesis.evidence`
#     (four different papers between them), two in `evidence_natural`, two in `evidence_caveats`,
#     and the one in `scope_exclusions[0]`. All eleven were located and all eleven re-resolve
#     byte-exact; none was a fabrication. The list shape changed from bare strings to
#     `{publication, quote}` pairs where the sources differ per item, because a record-level field
#     cannot attribute a multi-paper synthesis.
#
# NO QUOTE STRING WAS EDITED in the repair. Every one is the same contiguous slice it was, and the
# current standing after the repair is: 78 quotes, 78 resolve byte-exact against the publication
# the record itself names, 0 absent, 0 unattributed.
#
# WHAT THIS FILE STILL DOES NOT DO, stated plainly because the header above overclaims it: the
# quotes are verbatim and verified, but this file records no `char_start`/`char_end`, so "by
# offset" is a description of how the work was done and not something a reader can reproduce from
# the file. `ethanol/phase2_admissions.yaml` and `configurations/host_resolution.yaml` are the
# model for doing that properly.
#
# CONVENTIONS.md: no `confidence` is written anywhere in this file. A human sets it.

version: 1
zone: R
question: "What does the reverse experiment — mtDNA genes moved to the nucleus — say about recoding and about import?"
answer_in_one_line: >-
  Recoding is routine and never the limiting step. Import is the limiting step, and it is limited
  by transmembrane hydrophobicity specifically. Soluble cargo (Var1, bI4) relocates cleanly;
  every partial or failed case in the corpus is a membrane protein stuck in or before TIM23.

corpus_searched:
  stored_full_texts: 1310
  readable: 1309
  documents_bearing_on_allotopic_relocation: 11
  note: >-
    Searched for allotopic / relocat* to the nucleus / nuclear version of / recoded version of /
    mesohydrophobic / hydrophobicity, in every stored full text. Eleven documents carry signal.
    Two of the eleven are reviews rather than primary reports and are marked as such on every
    record that leans on them. One further document, doi:10.26508/lsa.202301965, uses the word
    "allotopic" for the OPPOSITE direction and is excluded — see `scope_exclusions`.
    doi:10.2323/jgam.2022.05.001 remains the one unreadable text in the store (AES-encrypted PDF);
    its metadata carries no mitochondrial-genetics signal.

# ============================================================ the hypothesis, stated by the field

hydrophobicity_hypothesis:
  status: stated_explicitly_in_four_papers_and_supported_by_the_attempts_recorded_here
  the_claim: >-
    That mtDNA retains the genes it retains because their products are too hydrophobic to be
    imported from the cytosol, and therefore that relocation succeeds in inverse proportion to
    the hydrophobicity of the product. Four papers in this corpus state it in so many words, and
    two of them offer a quantitative form of it (mean hydrophobicity of a transmembrane helix;
    "mesohydrophobicity" as a predictor of importability).
  # ATTRIBUTION ADDED 2026-09-22. This block is a multi-paper synthesis, so a record-level
  # `publication:` cannot carry it: the six quotes below come from four different papers, which is
  # precisely the "four papers" `status` claims. Until this repair the quotes were bare strings
  # with no source anywhere in the file, so none of them could be re-verified from the file as
  # written — the finding was true and unfalsifiable at the same time. Each now names its own
  # publication; the quote strings are unchanged and each was re-resolved byte-exact at its own
  # offsets with fermdb.llm.validate.verify_span against the fulltext_asset store.
  evidence:
    - publication: doi:10.1371/journal.pgen.1002876
      quote: |-
        Alternatively, genes may have been confined to mitochondria due to the difficulty of transporting their protein products into the organelle, an idea that stems from the enrichment of genes encoding hydrophobic proteins in organellar genomes .
    - publication: doi:10.1091/mbc.e17-09-0560
      quote: |-
        The hydrophobic nature of the proteins encoded in this genome plays a central role in gene retention (; ; ).
    - publication: doi:10.1093/nar/gkq769
      quote: |-
        The major impediment to allotopic expression is the highly hydrophobic nature of the mitochondrial-endoced polypeptides.
    - publication: doi:10.1093/nar/gkq769
      quote: |-
        Several studies suggest that allotopic expression of most mitochondrial proteins is not feasible because of their high mesohydrophobicity, a parameter that can be used to predict the importability of hydrophobic peptides ().
    - publication: doi:10.1016/j.gendis.2019.08.001
      quote: |-
        One of the critical steps dictating the success of the allotopic expression approach is the protein import process into mitochondria. Hydrophobicity of the proteins has been considered to be the primary barrier.
    - publication: doi:10.1016/j.gendis.2019.08.001
      quote: |-
        It is important to note that the high hydrophobicity of the nascent polypeptides has been indicated to be one of the limiting constraints for successful mitochondrial import of allotopically expressed mitochondrial proteins. This can be overcome by reducing the hydrophobicity of the proteins which are to be allotopically expressed.
  the_four_papers: >-
    Named explicitly now that each quote carries its source, so the `status` line above can be
    checked rather than taken: doi:10.1371/journal.pgen.1002876, doi:10.1091/mbc.e17-09-0560,
    doi:10.1093/nar/gkq769 and doi:10.1016/j.gendis.2019.08.001 — four distinct papers, which is
    what `stated_explicitly_in_four_papers` asserts. The two that give the quantitative form
    (mesohydrophobicity as a predictor) are gkq769 and gendis.
  the_natural_experiment: >-
    The strongest support is not from the engineering at all but from evolution: the few mtDNA
    genes that went nuclear on their own did so with a hydrophobicity reduction attached.
  evidence_natural:
    - publication: doi:10.1093/nar/gkq769
      quote: |-
        Interestingly, in the few cases where these genes have transferred to the nucleus naturally, this was accompanied by a significant reduction in hydrophobicity.
    - publication: doi:10.1091/mbc.e17-09-0560
      quote: |-
        Inner-membrane protein products of genes that naturally migrated to the nucleus tend to be less hydrophobic than their mitochondria-­encoded counterparts (; ; , ).
  where_it_is_incomplete: >-
    Two caveats a human reviewer should not let this table hide. (1) Hydrophobicity is necessary
    but demonstrably not sufficient: Cox2-W56R is importable and still only partly functional,
    and doi:10.1093/genetics/iyaf037 shows the residual limit sits in TMH2 and in assembly, not
    in TMH1. (2) Hydrophobicity can be reduced too far — doi:10.1091/mbc.e17-09-0560 argues for a
    window, not a gradient, because the helix must still be recognised as a helix by Oxa1.
  evidence_caveats:
    - publication: doi:10.1091/mbc.e17-09-0560
      quote: |-
        A delicate balance between a low hydrophobicity that allows the effective translocation of the first TMS through TIM23, and a high enough hydrophobicity to be recognized as a TMS by the membrane insertion machinery (Oxa1), and therefore to be introduced with the right topology into the inner mitochondrial membrane, is required.
    - publication: doi:10.1093/genetics/iyaf037
      quote: |-
        Interestingly, we observed that several favourable mutations were concentrated in the second TMH, resulting in a significant decrease in hydrophobicity ( and ).

# ================================================================== the relocation attempts

relocation_attempts:

  # ---------------------------------------------------------------- soluble cargo: it just works

  - gene: VAR1
    product: "Var1p (uS3m) — mitoribosomal small-subunit protein"
    product_class: soluble matrix protein
    transmembrane_segments: 0
    host: S. cerevisiae
    recoded_to_table_1: true
    targeting_sequence: "COX4 presequence"
    sequence_changes_required: none_reported
    function_restored: full
    readout: "complementation of a mitochondrial var1 mutant; respiratory growth; incorporation into the mtSSU"
    verification_method: fractionation
    import_proxy_reported: null
    why_it_failed: not_applicable
    publication: "doi:10.1093/nar/gkaa424, doi:10.1093/nar/gkx426"
    evidence:
      - |-
        Additionally, the strain carries a mtDNA devoid of introns (I0) and the pRS316-VAR1u construct (), which allows for the allotopic expression of a fully functional Var1 protein fused to the Cox4 mitochondrial targeting sequence, hereinafter referred to as universal Var1 (Var1u).
      - |-
        the Δmss116/SUP intronless strain was transformed with a construct that successfully relocates a recoded version of the VAR1 gene to the nucleus as described previously ().
      - |-
        Similar to the other mtSSU proteins, Var1 accumulated in equal amounts in WT and sov1 null mutant mitochondria (Figure ), suggesting that Var1u is stable in the absence of Sov1. However, while in WT mitochondria all detected Var1 protein appeared to incorporate into the mtSSU, in the Δsov1/VAR1u strain, only a small portion of Var1u sedimented in the fractions corresponding to the mtSSU (Figure ), suggesting that Var1 protein assembly into the mitoribosome is impaired.
    # The COX4-presequence contrast drawn in `why_it_matters` below is a Cox2 fact from a review,
    # not a Var1 fact from either paper this record names. It was previously the fourth item of
    # `evidence:` above and so was charged to `publication:`; it is now its own attributed block.
    evidence_for_the_MTS_contrast:
      publication: doi:10.1016/j.gendis.2019.08.001
      is_this_record_s_evidence: false
      what_it_supports: >-
        Only the parenthetical in `why_it_matters` — that COX4 is the presequence which does NOT
        work for hydrophobic cargo. It says nothing about Var1 and carries none of this record's
        fields. It is kept here rather than deleted because the contrast is the reason this record
        matters to the programme, and the contrast needs a source.
      source_type: "review, not a primary report — the same paper the hypothesis section leans on"
      attribution_corrected:
        date: 2026-09-22
        was: >-
          relocation_attempts[0].evidence[3], carrying no attribution of its own and therefore
          inheriting this record's `publication: doi:10.1093/nar/gkaa424, doi:10.1093/nar/gkx426`.
          The sentence occurs in neither of those papers.
        now: "doi:10.1016/j.gendis.2019.08.001 — Allotopic expression of mitochondrial genes: Basic strategy and progress"
        how_checked: >-
          fermdb.extract.harness.load_source_text on all three papers, then
          fermdb.llm.validate.verify_span at the quote's own offsets. EXACT at [15656, 16057) in
          gendis, one occurrence; absent from gkaa424 and from gkx426.
        is_the_record_s_claim_affected: >-
          NO, and this was checked rather than assumed. Every field of this record — the COX4
          presequence, full function restored, no sequence changes, fractionation as the readout —
          rests on evidence[0..2], and those three were re-verified against the papers this record
          names: [0] EXACT in doi:10.1093/nar/gkaa424, [1] EXACT in doi:10.1093/nar/gkx426, [2]
          EXACT in doi:10.1093/nar/gkaa424. Both `evidence_caveats` entries are EXACT in
          doi:10.1093/nar/gkaa424 as well. The Var1 result stands unchanged; what was wrong was
          the filing of a Cox2 sentence, not the finding.
        why_it_happened: >-
          `why_it_matters` names doi:10.1016/j.gendis.2019.08.001 as the source of exactly this
          fact two lines below, so the curator knew where it came from. The quote was simply
          appended to an `evidence:` list whose attribution is a record-level field, and a
          record-level field cannot carry a second source.
      evidence:
        - |-
          For example, the W56R mutant of the yeast cytochrome c oxidase could be allotopically expressed using an MTS derived from the S. cerevisiae—OXA1 gene or Neurospora crassa mitochondrial ATP synthase subunit 9 gene, both of which code for hydrophobic mitochondrial proteins, but not with an MTS derived from the COX4 gene, which codes for a hydrophilic protein, the yeast cytochrome c oxidase subunit 4.
    why_it_matters: >-
      THE record in this file for DUET's purposes. Var1 is the only soluble protein yeast mtDNA
      encodes, and it relocates with nothing but a codon change and a presequence — and the
      presequence is COX4's, which doi:10.1016/j.gendis.2019.08.001 records as the one that does
      NOT work for hydrophobic cargo. Two independent labs use the relocated construct as a
      routine reagent (doi:10.1093/nar/gkx426 uses it to uncouple an mss116 phenotype from loss of
      Var1 translation), which is a stronger statement of reliability than any single rescue
      experiment. Read with `activator_map.yaml` (locus VAR1, the only soluble mtDNA product) and
      with `heterologous_orf_precedents.yaml` (`leader_choice_matters`, where Var1's mitoribosomes
      are the matrix-directed ones): the same protein is the easy case in BOTH directions. A
      soluble matrix protein moves out of mtDNA without adaptation, and a soluble matrix protein
      is what the VAR1 leader is built to make. That symmetry is the file's main finding.
    caveats: >-
      Not free of cost, and two limits are recorded. Overexpressing the relocated gene raises
      petite frequency, and a C-terminally HA-tagged version of the same construct is NOT
      functional — the margin on a soluble matrix protein is real but not infinite, and a tag can
      spend it.
    evidence_caveats:
      - |-
        It has been previously reported that Var1u expression in a WT strain increases petite accumulation ().
      - |-
        However, the VAR1u-HA construct that was used for the study was not able to complement the respiratory deficient phenotype of a mitochondrial var1 mutant (), suggesting that the tagged Var1 protein is not functional and may be more prone to aggregation.

  - gene: "bI4 (COB intron 4 ORF)"
    product: "bI4 maturase — intron-encoded RNA maturase"
    product_class: soluble (hydrophilic) protein
    transmembrane_segments: 0
    host: S. cerevisiae
    recoded_to_table_1: true
    targeting_sequence: "an MTS, source not specified in this corpus"
    sequence_changes_required: none_reported
    function_restored: full
    readout: not_specified_in_this_corpus
    verification_method: none_reported
    import_proxy_reported: null
    why_it_failed: not_applicable
    publication: doi:10.1371/journal.pgen.1002876
    source_type: "secondary — reported in the introduction of a primary paper, not demonstrated in it"
    evidence:
      - |-
        This test has been carried out for five yeast proteins, two hydrophilic: bI4, an intron-encoded RNA maturase , and Var1p, a subunit of the mitochondrial ribosome , and three hydrophobic: the Atp8p subunit of mitochondrial ATP synthase with one transmembrane domain , the Cox2p subunit of respiratory complex IV (cytochrome c oxidase) which has two transmembrane segments , and the cytochrome b subunit of respiratory complex III, which is a highly hydrophobic protein with eight transmembrane segments .
      - |-
        In the cases of bI4, Var1p and Atp8p, adding a mitochondrial targeting sequence (MTS) and adjusting the genetic code were sufficient for functional allotopic expression of these proteins from nuclear DNA.
    why_it_matters: >-
      The second soluble case, and it matters only because it is a second one. Two soluble
      products, two clean successes with nothing but MTS + recoding. The sentence quoted is also
      the single most economical statement of this whole file's thesis: it sorts the five
      pre-2012 yeast attempts into "two hydrophilic" and "three hydrophobic" before reporting a
      single outcome, because in this field that sort predicts the outcome.

  # ------------------------------------------------- one transmembrane helix: still works, cleanly

  - gene: ATP8
    product: "Atp8p (subunit 8 / Aap1) of ATP synthase"
    product_class: inner-membrane protein
    transmembrane_segments: 1
    host: S. cerevisiae
    recoded_to_table_1: true
    recoding_extent: "31 of 48 codons changed — one for the code, thirty for cytosolic codon bias"
    targeting_sequence: "MTS from the Neurospora crassa ATP synthase subunit 9 precursor"
    sequence_changes_required: none_reported
    function_restored: full
    readout: "restoration of respiratory growth on ethanol/glycerol; assembly into ATP synthase"
    verification_method: activity_in_fraction
    import_proxy_reported: null
    why_it_failed: not_applicable
    publication: "doi:10.1091/mbc.e16-11-0775, doi:10.1016/j.gendis.2019.08.001"
    evidence:
      - |-
        As expected, absence of ATP8 in the arginine-independent clones precluded growth on respiratory carbon sources, which was rescued by nATP8ADH1, a nuclear version of ATP8 (; ) flanked by the ADH1 promoter and terminator in pMGL3 ().
      - |-
        The combination of allotopic ARG8m and nATP8ADH1 conferred both arginine prototrophy and respiratory competence on the arg8 null mutant ().
      - |-
        To ensure the mitochondrial import of allotopically expressed subunit 8 protein of the yeast mitochondrial ATP synthase, a sequence encoding an MTS derived from a precursor of subunit 9 of Neurospora crassa mitochondrial ATP synthase was fused to the N-terminal end of the subunit 8 gene.
      - |-
        In the nuclear version of the subunit 8 gene, as many as 31 out of 48 codons of the natural mitochondrial subunit 8 gene were changed.
      - |-
        Further experiments revealed that allotopic expression of the subunit 8 gene in yeast host cells lacking endogenous subunit 8 led to its successful assembly into functional ATP synthase complexes. This was demonstrated by the ability of the allotopically expressed subunit 8 protein to complement the ethanol-negative growth phenotype of the host cells.
    why_it_matters: >-
      The recoding datum, and it is larger than "adjust the stop codons". Thirty of the thirty-one
      changed codons were for cytosolic codon BIAS, not for the code — one single codon actually
      had to change to avoid mistranslation. The dominant cost of moving a gene between the two
      translation systems is bias, not dictionary. Strategy E runs this in reverse and inherits
      the same asymmetry: a table-3 recoding that only fixes the dictionary and ignores the
      matrix's codon preferences is doing the small half of the job.
      Note also the operational fact the 2017 paper turns on: nATP8's ability to rescue is
      sensitive to promoter, terminator and copy number — the same construct rescues or fails to
      rescue depending on whether it carries a proper 3' end. That is a nuclear-expression
      artefact with no analogue inside mtDNA, and it is a reason allotopic numbers understate
      what import can do.
    evidence_expression_sensitivity:
      - |-
        In an attempt to search for additional factors that affect ATP8, we took advantage of the ability of allotopically expressed ATP8 (nATP8) to complement and restore respiratory growth of atp8 mutants (; ; ).
      - |-
        The genetic screen used in this study to isolate mutants in nuclear gene products required specifically for expression of mitochondrial ATP8 was based on the ability of nATP8 to complement atp8 mutants (; ).
      - |-
        In other studies, tandem duplication of MTS was found to improve the mitochondrial import efficiency of allotopically expressed subunit 8 of yeast mitochondrial ATP synthase.
    # NOT FOUND BY THE 2026-09-22 PROVENANCE SWEEP — found by the repair pass that followed it,
    # because the sweep's extractor reached 67 of this file's 78 quotes and this was one of the 11
    # it missed. Same defect as the VAR1 record above: a quote from a third paper appended to a
    # list whose attribution is a record-level field.
    evidence_expression_level_dependence:
      publication: doi:10.1093/nar/gkaa424
      attribution_corrected:
        date: 2026-09-22
        was: >-
          relocation_attempts[2].evidence_expression_sensitivity[3], carrying no attribution of
          its own and therefore inheriting this record's `publication: doi:10.1091/mbc.e16-11-0775,
          doi:10.1016/j.gendis.2019.08.001`. The sentence occurs in neither of those papers — the
          strings "Pet111 and Aep3", "multicopy vectors" and "allotopic expression of COX2 and
          ATP8" appear nowhere in either stored text.
        now: "doi:10.1093/nar/gkaa424 — the same NAR paper the VAR1 record above is built on"
        how_checked: >-
          fermdb.extract.harness.load_source_text, then fermdb.llm.validate.verify_span at the
          quote's own offsets. EXACT at [28552, 28806) in doi:10.1093/nar/gkaa424, one occurrence;
          absent from every other publication named anywhere in this file.
        is_the_record_s_claim_affected: >-
          NO. This quote sits under `evidence_expression_sensitivity`, which qualifies the ATP8
          result rather than establishing it, and the qualification it makes — that complementation
          needs multicopy expression — is if anything strengthened by coming from a third,
          independent paper. The ATP8 record's own fields rest on `evidence[0..4]`, all of which
          re-resolve EXACT against the two papers the record names.
      evidence:
        - |-
          It has been previously shown that complementation of mutants in the mitochondrial translation factors Pet111 and Aep3 by allotopic expression of COX2 and ATP8 respectively depends on a high level of expression achieved by the use of multicopy vectors ().

  # ------------------------------ two transmembrane helices: partial, and the limit is measurable

  - gene: COX2
    construct: cCox2W56R
    product: "Cox2p (cytochrome c oxidase subunit 2)"
    product_class: inner-membrane protein, Nout-Cout
    transmembrane_segments: 2
    host: S. cerevisiae
    recoded_to_table_1: true
    targeting_sequence: "Oxa1 MTS (residues 1-47) followed by the natural 15-residue Cox2 leader peptide"
    sequence_changes_required: "W56R in TMS1 — found by massive random mutagenesis, not by design"
    function_restored: partial
    readout: "respiratory growth on ethanol/glycerol, slower than wild type; CcO in-gel activity"
    verification_method: fractionation
    import_proxy_reported: "CcO ~40% below wild type; the majority of cellular Cox2 signal is unprocessed precursor"
    why_it_failed: >-
      It did not fail, it plateaued — and the paper pins the plateau on import rather than on the
      mutation. The discriminating experiment is the one worth copying: they put W56R into the
      MITOCHONDRIAL gene and it behaved as a silent mutation, which rules out the substitution
      itself as the cause and leaves translocation of TMS1 through TIM23 as the limiting step.
      The precursor is at the mitochondria but not inside them.
    publication: doi:10.1091/mbc.e17-09-0560
    evidence:
      - |-
        Several unsuccessful efforts have been made to restore respiratory growth of Δcox2 mutants by expressing a recoded mitochondrial COX2 gene from the nucleus after adding a sequence encoding a mitochondrial targeting signal (MTS) to the construct.
      - |-
        A strategy involving massive random mutagenesis led to the identification of the point mutation W56R, which allows a cytosol-synthesized yeast Cox2 precursor (cCox2W56R) to complement a Δcox2 strain.
      - |-
        The Δcox2 mutant was transformed with a plasmid encoding Cox2 with the W56R mutation preceded by the MTS of Oxa1 (amino acids 1–47) and the natural 15–amino acid leader peptide of Cox2 (cCox2W56R) ().
      - |-
        Moreover, the strain carrying the allotopically expressed cCox2W56R subunit contains ∼40% less CcO than the wild-type strain, as judged by in-gel activity of the enzyme and spectroscopic quantitation of cytochromes ().
      - |-
        The point mutation W56R, located in the first transmembrane segment of the Cox2 protein, diminishes the mean hydrophobicity of the alpha helix, thus allowing the import of the precursor into mitochondria.
      - |-
        In contrast, relatively low levels of the mature cCox2W56R subunit were observed in the Δcox2+cCox2W56R transformant, and the majority of the Cox2 signal is observed as a high–molecular weight band, which must correspond to the precursor form of the protein, that is, the form still carrying the MTS (A).
      - |-
        Surprisingly, that was also the case for the majority of the allotopically expressed cCox2W56R precursor, indicating that although this unprocessed form is mainly localized to mitochondria, it is not available for processing by the matrix proteases.
      - |-
