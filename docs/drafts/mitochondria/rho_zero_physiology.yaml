  method: >-
    Every stored full text was decoded once through fermdb.extract.harness.load_source_text — the
    same function verify_span reads — and searched with regex across all the ρ spellings listed
    under corpus_searched. Every quote above was then re-resolved through
    fermdb.llm.validate.verify_span against that text at the offsets the text itself reports.
  quotes_written: 57
  quotes_verified: 57
  quotes_failed: 0
  each_quote_unique_in_its_document: true
  no_quote_is_spliced: true
  publications_drawn_on: 26
  confidence_fields: >-
    Deliberately absent. CONVENTIONS.md reserves confidence to a human; this is a draft and nothing
    in it has been graded.
  data_directory_untouched: true
  transcription_notes:
    - >-
      doi:10.1186/1754-6834-5-65 spells "mitochdrondria"; reproduced verbatim.
    - >-
      doi:10.3390/microorganisms11041040 renders ρ⁰ as "ρ °cells" with a stray space; reproduced
      verbatim.
    - >-
      doi:10.1038/s41586-019-1549-9 has an unclosed "(" where a figure citation was stripped;
      reproduced verbatim.
    - >-
      doi:10.1128/aem.01015-25 uses curly quotes around “petite” and a right single quote in
      "ancestor’s"; reproduced verbatim.
    - >-
      doi:10.1128/mbio.00084-18 uses MICRO SIGN U+00B5 in "µ = 0.26", not GREEK SMALL LETTER MU;
      reproduced verbatim.
    - >-
      doi:10.1186/s12915-025-02409-2 and doi:10.1091/mbc.e18-06-0356 use U+2206 INCREMENT for ∆Ψ
      while doi:10.1093/femsre/fuv028 uses U+0394 GREEK CAPITAL DELTA; both reproduced as published.
