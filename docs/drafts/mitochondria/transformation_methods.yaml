# ==================================================================== what the numbers support

efficiency:
  reported_frequencies:
    - value: "~0.1%"
      denominator: "colonies tested after the shot (i.e. nuclear Leu+ transformants), not cells bombarded"
      numerator: "colonies whose mitochondria received the plasmid and could restore functional Cox2"
      publication: doi:10.1016/j.xpro.2022.101359
  operational_scale:
    - "10^9 cells plated and shot per bombardment — doi:10.1016/bs.mie.2024.07.028"
    - "7 bombardment plates per transformation, at least 1,000 colonies restreaked for screening — doi:10.1016/j.xpro.2022.101359"
    - "a few hundred nuclear (Leu+) transformants per plate — doi:10.1242/dmm.049783"
    - "5 µg nuclear marker plasmid, 10–15 µg mitochondrial construct, tungsten 0.5 µm — doi:10.15698/mic2018.03.621"
  construct_level_attrition:
    - "2 of 4 attempted mitochondrial genes yielded allele replacements — doi:10.1126/sciadv.aav1848"
    - "8 of 8 attempted ATP6 point-mutant constructs yielded respiring clones — doi:10.1242/dmm.049783"
  what_this_does_not_license: >-
    There is no transformants-per-µg figure, no transformants-per-bombardment figure and no
    cells-transformed-per-cells-shot figure anywhere in the 1,309 texts. The 0.1% is a screening
    yield and it is stated "in our hands" by one group in one protocol; it should not be
    multiplied against 10^9 cells to estimate anything, because the two numbers have different
    denominators and come from different laboratories. For a strategy-E decision, the defensible
    statement is the qualitative one both numbers support and which §2.4 already makes: throughput
    is a handful of constructs, the limiting resource is colony screening by hand, and the
    campaign that most resembles a library in this corpus is eight constructs, not eighty.
  absence_is_the_finding: >-
    Fourteen of fifteen papers report no efficiency of any kind. This is not an oversight in the
    curation; it is the literature's convention. A mitochondrial transformation is reported as the
    strain it produced, because the frequency is not the result and nobody is optimising it. A
    programme that needs an efficiency number to size strategy E will have to generate it, or ask
    a practising laboratory directly — which is the other thing §3 said this table was for.

# ============================================================ where the corpus contradicts §2.4

contradictions:

  - field: marker
    says_2_4: >-
      "Selection markers: complementation of a mit- lesion restoring growth on a non-fermentable
      carbon source (the classical COX2/COX3 approach), or ARG8m complementing a nuclear arg8Δ."
    corpus_says: >-
      Both are real, but neither is the marker that makes the transformation work. In every
      classical record the FIRST marker is nuclear — LEU2 on pRS315 or Yep351, URA3 on pYES2 — on a
      separate plasmid co-bombarded with the construct, and it is the only thing under selection.
      The mitochondrial event is a SCREEN performed afterwards by mating. §2.4's single `marker`
      field cannot hold this, and a record filled in from §2.4 alone would omit the reagent without
      which nothing grows.

  - field: generations_to_homoplasmy
    says_2_4: >-
      Homoplasmy is framed as a step to "select and screen for ... by mitotic segregation".
    corpus_says: >-
      It is not screened for so much as waited out, and the wait is short: about a dozen mitotic
      divisions with no selection pressure (doi:10.1242/dmm.049783), 20-40 generations
      (doi:10.1016/bs.mie.2024.07.028), two passages (doi:10.1038/s41598-023-36637-9). Yeast cannot
      stably hold heteroplasmy, which two papers state as the reason the method is tractable at all.

  - field: heteroplasmy_achieved
    says_2_4: >-
      Listed as a field to record, implying heteroplasmy is a state a construct can be held in.
    corpus_says: >-
      In the classical route it is transient by construction and nobody measures it. The one record
      where a heteroplasmic state PERSISTED is the autonomous Cas9 Edit Plasmid
      (doi:10.7717/peerj.8362), and there it persisted only because the element was not integrated
      — and it was then lost. So for yeast the field is close to binary: an integrated construct
      goes homoplasmic quickly, and an unintegrated one goes away.

  - field: technique
    says_2_4: >-
      One route: biolistic bombardment of a ρ0 recipient, then kar1-1 cytoduction.
    corpus_says: >-
      That route holds for 13 of 15 records. Two variants exist and both matter. Cas9/gRNA
      editing (doi:10.7717/peerj.8362) still enters through a ρ0 biolistic shot but then edits the
      resident genome at a double-strand break instead of complementing a mit- lesion, so it need
      not spend a locus or a marker. Marker-free spheroplast fusion (doi:10.4014/jmb.2004.04033)
      moves a whole mitochondrial genome between strains with neither kar1-1 nor a mit- tester.
      A third, smaller variant: doi:10.7554/elife.35330 transforms LINEAR homology-armed fragments
      rather than a plasmid.

# =============================================================== what this corpus cannot tell you

open_gaps:

  - gap: "insert stability over generations for a homoplasmic chromosomal insert, under non-selective growth"
    status: never_tested
    note: >-
      This is §2.4's own explicit requirement and the answer is that no one in this corpus has done
      it for the construct class DUET would build. Thirteen records confirm integration once by PCR
      or sequencing and stop. The two that did measure retention measured something else: an
      autonomous plasmid, lost in 30–40 generations (doi:10.7717/peerj.8362), and a transplanted
      foreign genome in a ρ0 host, retained at more than 75% over four days of passaging
      (doi:10.4014/jmb.2004.04033). Neither is a homoplasmic insert in an otherwise wild-type ρ+
      genome. Note that most constructs in this corpus carry a built-in selection — respiration
      restored via COX2, or arginine prototrophy via ARG8m — so even the strains that have been
      propagated for years have been propagated under selection.
      The experiment is cheap and already designed: four days of serial non-selective passaging,
      PCR-scoring colonies at each passage, reported as percent of cells retaining the insert. It
      should be phase-1 work, not phase-3.

  - gap: "transformation frequency per bombardment or per µg DNA"
    status: not_reported_anywhere
    note: >-
      One screening yield (0.1%) from one protocol paper. No frequency with cells or DNA in the
      denominator exists in the 1,309 texts. See `efficiency.what_this_does_not_license`.

  - gap: "whether any of this has been done with a construct that must fold a soluble, cofactor-dependent, oligomeric enzyme"
