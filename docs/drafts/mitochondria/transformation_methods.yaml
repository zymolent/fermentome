      the labour, which §2.4 does not. Two further things this protocol alone supplies: a
      cytoduction timing window of 3 h 30 min to 4 h, narrow enough that the paper warns it varies
      between hands; and the only stability-adjacent design argument in the whole file, that SHORT
      COX2 flanks are preferred because long ones invite spontaneous recombination. That is a
      construct-design rule DUET can use immediately, and it points the same way as the
      instability actually observed in doi:10.26508/lsa.202301965.

