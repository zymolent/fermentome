      The only record that gives the DNA amounts — 5 µg nuclear marker plasmid against 10–15 µg of
      the mitochondrial construct, a deliberate 2–3-fold excess of the thing you cannot select for.
      It also names the third strain move that the shorter methods sections omit: transformant →
