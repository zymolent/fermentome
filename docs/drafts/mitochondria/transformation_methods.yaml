# Transformation method records — how a construct actually gets into yeast mtDNA, in whose hands,
# at what cost, and whether anybody checked that it stayed there.
#
# MITOCHONDRIAL_PROGRAM.md §3 budgets this as "~30–60 papers" and §2.4 names the fields:
# technique, recipient_state, marker, recoded_for_table_3, heteroplasmy_achieved,
# generations_to_homoplasmy, stability_tested. This file is that table, built from the 1,309
# readable stored full texts.
#
# THE HEADLINE, and it is a downward correction. There are FIFTEEN papers in this corpus that
# report a yeast mitochondrial transformation the authors themselves performed. Not 30–60. The
# earlier keyword sweep that found 43 documents mentioning biolistic/microprojectile/bombardment
# was counting the word, not the experiment: of those 43, most are plant or algal chloroplast
# transformation, Cryptococcus or C. elegans nuclear biolistics, or reviews citing the yeast
# technique in passing. §3's size estimate was written from the technique's reputation. The
# corpus says the technique is practised by a handful of groups, nearly all of them working from
# one ρ0 kar1-1 strain out of one laboratory. That is a finding about who to ask, which is what
# §3 said this table was for.
#
# THE NUMBER THE PROGRAMME ASKED FOR. "Efficiency is transformation's binding constraint" and the
# corpus yields exactly ONE reported frequency, from the one paper written as a protocol rather
# than as a result:
#
#     "In our hands only around 0.1% of the tested colonies contained the mitochondrial plasmid
#      and could restore fully functional Cox2."   — doi:10.1016/j.xpro.2022.101359
#
# That is 0.1% of the NUCLEAR (Leu+) transformants recovered from a shot, not 0.1% of cells shot,
# and it is a screening yield, not a transformation frequency. Every other number in this file is
# operational scale rather than efficiency: 10^9 cells per shoot, seven plates per bombardment, a
# few hundred nuclear transformants per plate, at least 1,000 colonies to restreak and screen.
# Fourteen of the fifteen papers report NO efficiency at all — they report the strain they got.
# See `efficiency` at the foot for what those numbers do and do not license.
#
# WHAT §2.4 GETS RIGHT: the five-step route is confirmed, almost step for step, by thirteen of the
# fifteen records. Construct on a pUC/pJM2-family plasmid → biolistic bombardment of a ρ0 kar1-1
# recipient → synthetic ρ- clone → cross to a mit- ρ+ strain → recombination and mitotic
# segregation. It is not a reconstruction from memory; it is what these labs write down.
#
# WHERE §2.4 IS WRONG OR THIN, three places:
#
#   1. `marker` is not one field. Every classical record uses TWO tiers, and they do different
#      jobs. A nuclear marker (LEU2 on pRS315 or Yep351, URA3 on pYES2) on a CO-BOMBARDED plasmid
#      SELECTS the shot — it is what makes any colony at all appear. The mitochondrial event is
#      then SCREENED, not selected: the candidate is mated to a tester carrying a mit- lesion
#      (cox2-62, cox2-75c, cox2-22, cox2-208, cox3-10) and scored for respiratory rescue of the
#      diploid. Nothing selects the mitochondrial transformant directly, which is precisely why
#      1,000 colonies have to be restreaked by hand. §2.4's selection-marker note (mit-
#      complementation, or ARG8m) describes the SECOND tier only. The schema needs
#      `nuclear_selection_marker` and `mitochondrial_screen` as separate fields.
#
#   2. Homoplasmy is the CHEAP step, and the corpus gives it a number. §2.4 treats "select and
#      screen for homoplasmy by mitotic segregation" as a step to design around. Three independent
#      papers say it happens by itself in roughly ten to forty divisions with no selection at all:
#      "about a dozen mitotic divisions" (doi:10.1242/dmm.049783), "20-40 generations"
#      (doi:10.1016/bs.mie.2024.07.028), "two passages" (doi:10.1038/s41598-023-36637-9). Yeast
#      does not stably hold heteroplasmy, and that is a gift, not an obstacle. The expensive step
#      is upstream: getting the plasmid into a mitochondrion at all.
#
#   3. `stability_tested` is the field this corpus mostly cannot fill, and §2.4's own instruction
#      — "insert stability must be tested over generations rather than assumed, especially under
#      non-selective conditions" — is met by NOBODY for a classical homoplasmic integrant. Of
#      fifteen records, thirteen confirm the integration once, by PCR and sequencing, and stop.
#      Two tested persistence over generations, and neither is a homoplasmic chromosomal insert:
#      an autonomous Cas9 Edit Plasmid (doi:10.7717/peerj.8362) and a transplanted mouse mtDNA
#      (doi:10.4014/jmb.2004.04033). Both LOST it. See `contradictions` and `open_gaps`.
#
# EVERY QUOTE BELOW is a single verbatim span of one stored full text, sliced from the text by
# offset rather than retyped, and re-resolved in that text after this file was parsed: 50 spans,
# 50 exact single-occurrence matches. Quotes are written as double-quoted YAML scalars, not folded
# ones, because several come from PDF text layers where the line wraps and the private-use rho
# glyph (U+F072) are part of the string and folding would silently destroy them. No quote here
# splices two passages; where two passages are needed, there are two strings.

version: 1
zone: R
question: "What does it actually take to put a construct into yeast mtDNA, and does it stay there?"
answer_in_one_line: >-
  Thirteen papers run §2.4's route almost verbatim, one number exists for its efficiency (0.1% of
  screened colonies), homoplasmy arrives free in about a dozen divisions, and nobody has tested
  whether a mtDNA insert survives non-selective growth — which is the condition DUET would use it
  under.

corpus_searched:
  stored_full_texts: 1309
  documents_matching_biolistic_keywords: 43
  documents_reporting_a_transformation_the_authors_performed: 15
  note: >-
    The 43 is the earlier keyword count and it is reproduced here so the gap is visible rather than
    quietly corrected. Searches run: biolistic|microprojectile|bombard; kar1-1|cytoduct; synthetic
    rho|rho0 strain|transformed into rho; mitochondrial transformation phrasings; and
    transformation/transformant within 80 characters of frequency/efficiency/rate, required to
    co-occur with "mitochondri". Greek rho was searched as ρ, rho, and the private-use glyph U+F072
    together, because doi:10.1016/bs.mie.2024.07.028 renders it that way throughout its body text
    and a plain ρ search misses its entire methods section.

