      - "Identification of the transformants is a key aspect of the method. Here, a two-step procedure is used (). First, general transformants are identified with the help of a nuclear plasmid that carries a selection marker cassette that reverts leucine auxotrophy. The plasmid is co-delivered with pPT24 into cells during the biolistic transformation. Next, mitochondrial transformants are identified by regain of respiratory growth. Because recombination restores the damaged COX2 gene, cells that show respiratory competence have obtained the transformed plasmid ()."
