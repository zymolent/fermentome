      - "During the cytoduction, exchange of cytoplasmic organelles occurs regularly, in our hands this process starts around 3 h 30 min after the two strains were mixed. On the other hand, nuclear genomes’ recombination is delayed by around 30 min. This timeframe between 3 h 30 min and 4 h allows for stopping the cytoduction, when the mitochondrial transfer occurred, but the original nuclear genomes are maintained."
