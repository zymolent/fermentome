# Method. Every stored full text was read through the same decoder the span verifier uses, and
# searched with regex. Each quote above was then extracted BY OFFSET from that text rather than
# retyped — 33 spans, every one an exact substring of its source, single-line, no ellipsis
# splices. Where a claim needed two passages, both are given in full and labelled.
#
# Two mechanical notes for whoever re-resolves these.
#
#   1. doi:10.1016/bs.mie.2024.07.028 is PDF-sourced and hard-wrapped at ~85 characters, so no
#      quote from it can run past one line without carrying a newline. The two quotes taken from
#      it are consecutive source lines, given separately for exactly that reason. Its text also
#      renders ρ as U+F072, a private-use glyph — it is preserved verbatim in the quote and will
#      not match a search for ρ (U+03C1). The same paper uses the real ρ elsewhere in the same
#      document, so BOTH spellings occur in one file.
#   2. ARG8ᵐ is spelled three ways across the corpus — ARG8m, Arg8m and "ARG8 m" (the last in
#      doi:10.1371/journal.pgen.1005664, where the PDF pipeline split the subscript). A search for
#      only the first spelling misses the loop-out paper, which is the most important record in
#      this file. That is how the DRMD cassette went unnoticed until this pass.
