# Slot 5 candidate shortlist — ethanol reference layer
# Criterion E2, "the performance ceiling the programme is calibrated against"
# (docs/reference/ETHANOL_REFERENCE_SLOTS.md; PLAN.md B.3.2)
#
# This is a SHORTLIST, not a decision. The agent does not choose; the owner picks one.
# Nothing here is marked accepted or verified and no confidence value is asserted.
# Every quote is a verbatim character-for-character substring of the named corpus file.
# Quotes are never spliced: where two passages are needed they are listed separately.
# Every titre / yield / productivity below is stated with the conditions it was measured under.
# Arithmetic the agent performed (e.g. % v/v -> g/L at 0.789 g/mL) is labelled as such and is
# never presented as the paper's own number.
#
# DEAD `corpus_file:` MARKERS REPLACED, 2026-09-22 — 7 of them in this file.
# They pointed at a numbered scratchpad cache (`NNNNN.txt`) that no longer exists anywhere on
# this machine, so as provenance they could not be dereferenced by anyone, including the
# 2026-09-22 provenance sweep. That sweep also established that the cache was not a DIFFERENT
# text — every quote checked against it re-resolves character-identically against the
# `fulltext_asset` store — so nothing is lost by dropping the pointer and keeping the DOI.
#   7 were removed as redundant: a `doi:` or `publication:` sat beside them in the
#   same record and already carried the provenance.
# Checked before removal: across all 15 draft files the 101 distinct cache numbers each map
# to exactly ONE DOI, so the markers were internally consistent and carried no information
# the adjacent DOI does not. No quote string was touched.

slot:
  number: 5
  name: "Industrial strain under VHG (Very High Gravity)"
  criterion: E2
  question: "What does a high-performing fermentation actually look like?"
  budget: 20
  slots_doc_wording: "Ethanol Red or equivalent"
  calibration_target: "The owner's own chassis reaches ~120 g/L ethanol; a candidate at or above that, with conditions, is directly calibrating."
  what_makes_a_candidate_strong: >-
    Completeness of the process record, not novelty. The atlas needs gravity/initial sugar, final
    titre, yield as a fraction of theoretical, volumetric productivity, duration, temperature,
    nitrogen supplementation, batch vs fed-batch vs SSF vs cell-recycle, and the strain.
    condition_context is mandatory (PLAN.md C.5); a headline titre without conditions is close to useless.
  standing_cautions_applied_here:
    - "Industrial process yields (90-95% of theoretical) and laboratory wild-type physiology (~78% in anaerobic chemostat) are different quantities and must not be pooled. All three candidates below are batch or fed-batch with an uncontrolled, non-zero growth rate — none is a chemostat, so none reports a dilution rate, and none of these yields is the near-theoretical, near-zero-growth figure."
    - "The theoretical ceiling from glucose is 0.511 g/g. Denominators were checked per candidate; see `yield_denominator_check` on each."
  differentiation_intended:
    A: "most complete process record (fed-batch feed + 6-cycle cell recycle, sugarcane juice, nitrogen arm)"
    B: "named commercial strain — Ethanol Red measured directly, on defined YP + glucose"
    C: "different substrate and process mode — corn dry-grind SSF at high solids, with Ethanol Red as the control"

candidates:

  - id: SLOT5-A
    label: "most complete process record"
    pmid: "30237826"
    doi: "10.1186/s13068-018-1239-0"
    title: "Conditions promoting effective very high gravity sugarcane juice fermentation."
    year: 2018
    journal: "Biotechnology for Biofuels"
    open_access: "Open access (BioMed Central / Biotechnology for Biofuels); full text stored in the corpus."
    strains:
      - "S. cerevisiae CAT-1 (Brazilian industrial bioethanol strain, purchased from LNF Latino Americana)"
      - "S. cerevisiae PE-2 (Brazilian industrial bioethanol strain, same supplier)"
      - "S. cerevisiae W303-1A (laboratory strain, used only for the gene-expression arm)"
    conditions:
      substrate: "sugarcane juice (SCJ), variety SP83-2487, concentrated then diluted to 25, 30 or 35 degrees Brix; no other added carbon source"
      gravity_initial_sugar: "25 / 30 / 35 degrees Bx (g sugar per 100 g juice); sugar actually consumed reported per condition, e.g. 261 +/- 22 g/L by CAT-1 under supplementation, against an apparent ~250 g/L ceiling without supplementation"
      process_mode: "fed-batch inoculation into cell-recycle: 7 g yeast wet biomass fed with must at 20 mL/h for 5 h, then 6 consecutive 24-h cycles with the pellet recovered by centrifugation and re-fed — a reduced-scale mimic of the Brazilian Melle-Boinot industrial process"
      duration: "6 cycles x 24 h (the industrial process it mimics uses 8-h cycles; the paper says so explicitly)"
      temperature: "30 degrees C"
      agitation: "orbital, 70 rpm"
      volume: "100 mL broth in 150 mL tubes"
      inoculum: "~10^8 cells (Neubauer chamber count)"
      nitrogen_supplementation: "three arms — none, 16 mM urea, or 24 mM diammonium phosphate (DAP)"
      titre: "CAT-1, 30 degrees Bx + urea: 17% (v/v) ethanol (agent's arithmetic at 0.789 g/mL: ~134 g/L). Across the study the per-cycle maximum was ~15% (v/v) (~118 g/L), ~14% (v/v) of it already in cycle 1."
      yield: "CAT-1, 30 degrees Bx + urea: 91.32% of theoretical. PE-2, 35 degrees Bx + urea: 93% of theoretical."
      productivity: "CAT-1, 30 degrees Bx + urea: 5.63 +/- 0.28 g/L/h (highest in the study). PE-2, 35 degrees Bx + urea: 4.19 g/L/h."
      residual_sugar: "0.2% unfermented (the abstract writes w/v, the body writes v/v — see what_it_lacks)"
      viability: "~60% of the initial viable inoculum fraction surviving 6 cycles of 24 h"
      growth_regime: "batch/fed-batch with cell recycle and an uncontrolled growth rate; no dilution rate, no specific growth rate reported"
    yield_denominator_check: >-
      The paper states its denominator explicitly: 100 g glucose -> 51.1 g (64.75 mL) ethanol, i.e.
      the correct 0.511 g/g glucose figure, and defines fermentation efficiency as produced/theoretical
      x 100. The substrate, however, is sugarcane juice, whose sugar is largely sucrose; 1 g sucrose
      takes up water on inversion and yields ~1.053 g hexose, so the sucrose-basis ceiling is ~0.538 g/g.
      If "total fermentable sugar" was measured on a sucrose basis rather than as post-inversion
      reducing sugar, the reported efficiencies would be high by roughly 5% relative (91.32% would be
      ~86.7%). The paper does not say which basis the sugar assay used. A curator should resolve this
      before the 91.32% is admitted as a yield fraction.
    what_data_it_actually_contains: >-
      Processed tabular fermentation data in the paper's own tables (ethanol produced and sugar consumed
      per strain x gravity x nitrogen arm; derived efficiency and productivity tables), biomass wet
      weight and viability across all six cycles as figures, intracellular and extracellular glycerol by
      HPLC after TCA deproteinisation, and qRT-PCR expression for STL1 and FPS1 in CAT-1 and W303-1A.
      No raw deposited datasets; the cycle-resolved numbers that are not tabulated live only in figures.
    accessions: "none found in the stored text (no sequencing; the molecular work is qRT-PCR only)"
    why_this_slot: >-
      This is the most complete process record found anywhere in the 209-candidate pool: it is the only
      shortlisted paper that carries all nine fields the atlas asks for and carries them per condition
      rather than only for a headline — gravity, titre, yield as a stated fraction of a stated
      theoretical, productivity in g/L/h, duration, temperature, an explicit nitrogen-source arm, the
      process mode, and named industrial strains. It is also the only candidate whose process mode is the
      real industrial one (cell recycle across cycles), and the nitrogen arm directly answers the
      "nitrogen supplementation" field the slot demands rather than leaving it to a medium recipe.
      CAT-1 at 17% (v/v) with 91.32% of theoretical and 5.63 g/L/h sits above the owner's ~120 g/L chassis.
    what_it_lacks: >-
      (1) Internal unit inconsistencies that a curator must resolve before extraction. The abstract says
      "17% (w/v) ethanol yield" while the body says "17% (v/v)"; residual sugar is "0.2% (w/v)" in the
      abstract and "0.2% (v/v)" in the body. (2) The Methods define productivity as fermentation
      efficiency (%) divided by cycle extension (h) — a dimensionless-over-hours quantity — yet the
      Results report productivity in g/L/h. The two definitions cannot both be right and the paper never
      reconciles them, so 5.63 g/L/h should not be taken at face value without recomputing it from the
      titre and cycle time. (3) No ethanol figure is ever printed in g/L; every titre needs converting.
      (4) The sucrose-vs-glucose denominator question above. (5) No sequencing, no accessions, no raw
      data deposit. (6) 17% (v/v) is a striking number for a strain the same paper says loses viability
      above ~14-15% (v/v); whether it is a per-cycle titre or a cumulative figure is not stated in the
      running text and must be read off the table.
    evidence:
      - claim: "Headline result: strain, gravity, nitrogen source, titre, residual sugar."
        quote: |-
          Highest process efficiency, with a 17% (w/v) ethanol yield and only 0.2% (w/v) sugar remaining unfermented, was observed with the Saccharomyces cerevisiae industrial strain CAT-1 in 30 °Bx broth with urea supplementation.
      - claim: "Best condition with all four performance numbers and the viability figure."
        quote: |-
          Still, when all is taken into consideration, the best performance in VHG conditions was for CAT-1 at 30 °Bx with SCJ supplemented with urea: (a) highest ethanol production (17% (v/v)—Table ), (b) low residual unfermented sugar (0.2% (v/v)—not shown), (c) high ethanol yield (91.32%—Table ), (d) highest productivity (5.63 ± 0.28 g L−1 h−1—Table ), and (e) high yeast viability after 6 cycles of 24 h (approximately 60% of the initial fraction of the viable inoculum—Fig. ).
      - claim: "Second-best condition (PE-2, 35 degrees Bx, urea) with its yield and productivity."
        quote: |-
          In fact, at 35 °Bx/urea, PE-2 presented the extraordinary yield of 93% with a matching productivity of 4.19 g L−1 h−1 (Table ).
      - claim: "Process mode, volume, inoculum, duration, temperature, agitation, cell recycle."
        quote: |-
          Fermentations were carried out with ~ 108 cells (enumerated with a Neubauer chamber and Leica light microscope) in 100 mL broth, in 150 mL tubes, for 24 h at 30 °C with orbital agitation at 70 rpm (New Brunswick Scientific Co., US), followed by centrifugation (Damon IEC BP-6000) at 2250 rpm for 10 min. The cell pellet was weighed and supplemented with an identical number of grams of fresh must, followed by a new 24-h fermentation cycle, and this whole process was repeated 6 times.
      - claim: "Fed-batch feed rate and the industrial process being mimicked."
        quote: |-
          A reduced scale fermentation procedure which mimics the industrial fermentation process used in the Brazilian bioethanol industry was utilised. Yeast wet biomass (7 g) was gradually supplemented with must, prepared as described above, at 20 mL h−1 for 5 h.
      - claim: "The nitrogen supplementation arms and their concentrations."
        quote: |-
          Both non-supplemented and 16 mM urea ((NH2)2CO) or 24 mM diammonium phosphate (DAP) ((NH4)2HPO) supplemented musts were used.
      - claim: "The theoretical denominator the yield fractions are computed against."
        quote: |-
          Ethanol yield was calculated according to the theoretical consideration that the conversion of 100 g glucose should give rise to 51.1 g, or 64.75 mL, ethanol
      - claim: "The per-cycle ethanol ceiling and its viability cost."
        quote: |-
          In the present study, ethanol production reached a maximum of ~ 15% (v/v) (Table , italics); ~ 14% (v/v) of which was already reached in the first cycle of fermentation and which was accompanied by a strong reduction in cell viability (Fig. ).
      - claim: "Sugar actually consumed under supplementation."
        quote: |-
          CAT-1 in particular consumed more sugar (261 ± 22 g L−1) (Table )

  - id: SLOT5-B
    label: "named commercial strain — Ethanol Red measured directly"
    pmid: "25759747"
    doi: "10.1186/s13068-015-0216-0"
    title: "Large-scale robot-assisted genome shuffling yields industrial Saccharomyces cerevisiae yeasts with increased ethanol tolerance."
    year: 2015
    journal: "Biotechnology for Biofuels"
    open_access: "Open access (BioMed Central / Biotechnology for Biofuels); full text stored in the corpus."
    strains:
      - "Ethanol Red (commercial biofuel strain, coded P7) — used as the in-batch control strain in every fermentation"
      - "Hybrids H1-H9 from genome shuffling of eight heterothallic parents drawn from a 318-strain Saccharomyces collection"
      - "Industrial isolates Y145, Y116, Y111 (pilot scale comparators)"
    conditions:
      substrate: "defined rich medium — YP + 35% (w/v) glucose for the small-scale VHG comparison; 320 g/L glucose with 2% peptone, 2% malt extract, 0.12% Fermaid and ZnSO4.7H2O for the semi-industrial pre-screen; 8 L VHG medium with 32% (w/v) glucose for the pilot"
      gravity_initial_sugar: "350 g/L glucose (small scale), 320 g/L glucose (semi-industrial pre-screen and 8 L pilot)"
      process_mode: "batch. Small scale: 150 mL in sealed 250 mL Schott bottles with a waterlock (self-anaerobic via CO2 blanket). Pilot: 8 L stirred bioreactor (Sartorius Biostat B plus)"
      duration: "small scale terminated per-flask when daily weight loss fell below 0.20 g/day; the productivity column is normalised to day 7, the day Ethanol Red finished. Pilot terminated after 7 days."
      temperature: "30 degrees C (small scale, and the 100 mL semi-industrial pre-screen). The 8 L pilot temperature is not stated in the stored Methods text."
      inoculum: "small scale: OD600 = 1.0, approximately 2.0 x 10^7 cells/mL, from YP + 4% glucose stationary phase. Pilot: 80 mL of a 50 g wet biomass / 100 mL Ringer suspension into 8 L."
      nitrogen_supplementation: "supplied as the medium, not as a variable — YP (yeast extract + peptone) at small scale; peptone + malt extract + Fermaid at semi-industrial scale; 12% ammonia used for pH control at pilot scale (pH held at 4.5)"
      agitation: "150 rpm magnetic stirring (small scale); 300 rpm for 4 h then 50 rpm (pilot); static for the 100 mL pre-screen"
      titre: "Ethanol Red, small-scale VHG (150 mL YP + 35% w/v glucose, 30 degrees C, 150 rpm): 19.0 +/- 0.40% (v/v) = 149.7 +/- 2.94 g/L. Best hybrid H1 same conditions: 20.0 +/- 0.22% (v/v) = 158.1 +/- 1.70 g/L. H1 at 8 L pilot on 32% (w/v) glucose: 18.7% (v/v)."
      yield: "Ethanol Red, small-scale VHG: 0.49 +/- 0.01 g/g sugar consumed (agent's arithmetic against 0.511 g/g: ~96% of theoretical). H1 at pilot on 32% (w/v) glucose: 0.45 g/g, which the paper's own table reports as 88.8%."
      productivity: "Ethanol Red, small-scale VHG, estimated at day 7: 0.90 +/- 0.03 g/L/h. H1 same basis: 0.94 +/- 0.01 g/L/h. H1 at 8 L pilot: 0.90 g/L/h."
      growth_regime: "batch from a stationary-phase inoculum, growth rate uncontrolled and unreported; no chemostat, no dilution rate"
    yield_denominator_check: >-
      Substrate is pure glucose throughout, so 0.511 g/g is the right ceiling and the paper applies it
      consistently: the pilot table's 0.45 g/g and 88.8% agree (0.45/0.511 = 88.1%). Yield is defined in
      the supplementary legend as ethanol formed against the maximum formable from glucose consumed —
      i.e. per sugar consumed, not per sugar charged. Ethanol Red's 0.49 g/g is therefore a
      consumed-basis number, and at 96% of theoretical it is close enough to the ceiling that a curator
      should note it is a consumed-basis yield before comparing it with charged-basis figures elsewhere.
    what_data_it_actually_contains: >-
      Two in-paper tables of processed fermentation data (Table 1: relative and absolute ethanol in
      % v/v and g/L, relative and absolute estimated productivity, and yield in g/g, for nine hybrids
      against Ethanol Red in triplicate; Table 2: % v/v, yield % , yield g/g and productivity g/L/h for
      four strains at 8 L pilot), plus five supplementary data files carrying the per-strain fermentation
      data for the full hybrid panel and a 26-strain screen. Genetic fingerprints and a 318-strain
      phenotype screen are reported as figures/heat maps. No sequencing deposits.
    accessions: "none found in the stored text; the strain collection is described but no INSDC/SRA accessions are given"
    why_this_slot: >-
      This is the only candidate in the pool that puts a number on Ethanol Red itself, in triplicate,
      in the same batch as everything it is compared with: 149.7 +/- 2.94 g/L at 0.49 +/- 0.01 g/g and
      0.90 +/- 0.03 g/L/h from 350 g/L glucose at 30 degrees C. The slots doc names "Ethanol Red or
      equivalent", and this gives Ethanol Red as an in-batch control rather than as a citation. The
      substrate is pure glucose in a defined rich medium, which makes it the most directly comparable of
      the three to a lab chassis measured on glucose — the owner's ~120 g/L is read against 149.7 g/L
      without a feedstock conversion in between. It also supplies a matched pilot-scale (8 L bioreactor)
      point for the same process, which is the closest thing in the pool to a scale check.
    what_it_lacks: >-
      (1) The productivity figure is not a measured completion rate: hybrids took longer than Ethanol Red
      to finish, so the paper normalises everything to day 7, the day Ethanol Red finished. 0.90 g/L/h is
      therefore an "estimated productivity at d = 7" and is not comparable with a productivity computed to
      actual completion. (2) Fermentation duration is a stopping rule (weight loss < 0.20 g/day), not a
      stated time, so per-flask duration is not recoverable from the text. (3) The 8 L pilot temperature
      is not stated. (4) Ethanol Red was not run at pilot scale at all — it ranked ninth in the pre-screen
      and was dropped — so the pilot numbers belong to H1/Y145/Y116/Y111, not to the commercial strain.
      (5) Nitrogen is a fixed medium component, not a studied variable, so this candidate cannot answer
      the nitrogen-supplementation question the slot lists. (6) YP + 35% glucose is a laboratory VHG
      medium, not an industrial feedstock; it is clean but it is not a plant. (7) No accessions, no
      deposited raw data.
