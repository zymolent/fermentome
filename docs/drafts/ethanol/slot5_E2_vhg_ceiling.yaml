      - claim: "The lab-scale VHG screening condition used for the 318-strain collection."
        quote: |-
          We first determined the ethanol accumulation capacity under lab-scale VHG conditions (fermentation of 150 ml YP + 35% (w/v) glucose).

  - id: SLOT5-C
    label: "different substrate and process mode — corn dry-grind SSF at high solids"
    pmid: "38647773"
    doi: "10.1186/s40643-022-00580-w"
    title: "Brazilian industrial yeasts show high fermentative performance in high solids content for corn ethanol process."
    year: 2022
    journal: "Bioresources and Bioprocessing"
    open_access: "Open access (SpringerOpen / Bioresources and Bioprocessing); full text stored in the corpus."
    strains:
      - "Ethanol Red (ER) — the control, donated by Leaf by Lesaffre"
      - "BG-1, CAT-1, PE-2, SA-1 (Brazilian industrial sugarcane-ethanol strains)"
    conditions:
      substrate: "dent-type corn, hammer-milled, dry-grind; liquefied with Liquozyme alpha-amylase then saccharified in parallel with fermentation (SSF) using Spirizyme Ultra XHS glucoamylase"
      gravity_initial_sugar: "expressed as solids loading, 30% (standard) or 35% (high-solids), assuming 10% corn moisture. Initial fermentable sugar is never given in g/L — see what_it_lacks."
      process_mode: "simultaneous saccharification and fermentation (SSF) in batch; glucose is released slowly rather than charged, which the paper notes avoids the initial osmotic shock of a VHG sugar charge"
      duration: "72 h standard; extended to 96 h for the high-solids condition because sugars were not exhausted at 72 h"
      temperature: "32 degrees C standard; a 35 degrees C stress arm"
      pH: "5.3 for liquefaction (85 degrees C, 90 min), adjusted to 4.9 for SSF, both with 10 N sulfuric acid"
      nitrogen_supplementation: "urea, 160 microlitres of a 50% w/v solution per 100 mL (agent's arithmetic: ~0.8 g urea per kg of paste)"
      enzymes: "Liquozyme 0.02% m/m at liquefaction; Spirizyme 0.035% m/m at SSF"
      inoculum: "0.4% initial cell concentration (standard) or 0.02% (low-inoculum stress arm), from a 14-h YPD propagation"
      volume_and_vessel: "100 g liquefied paste in a 250 mL Erlenmeyer, shaken at 150 rpm, biological triplicates"
      titre: "35% solids, 0.02% inoculum, 32 degrees C, 96 h: ER 18.78, BG-1 19.81, CAT-1 17.06, PE-2 17.27, SA-1 18.82% (v/v) (agent's arithmetic at 0.789 g/mL: ER ~148 g/L, BG-1 ~156 g/L). 30% solids, 0.4% inoculum, 32 degrees C, 72 h: ER 16.46, BG-1 16.7, CAT-1 16.89, PE-2 16.47, SA-1 16.76% (v/v) (~130-133 g/L)."
      yield: "reported only as L ethanol per kg of dry corn, in a figure; no fraction of the 0.511 g/g theoretical is given anywhere. Relative changes are given: BG-1 and ER lose at least 9.3% of conversion efficiency at 72 h under high solids, recovering 2.75% and 2.15% respectively by 96 h."
      productivity: "reported in g/L.h in a figure only; the text gives relative changes at 35% vs 30% solids over 72 h — BG-1 +5.8%, ER +3.4%, CAT-1 -14.1%"
      growth_regime: "batch SSF from a defined inoculum; growth rate uncontrolled and unreported"
    yield_denominator_check: >-
      Not applicable as printed: this paper never expresses yield as a fraction of theoretical. Its yield
      is L ethanol per kg dry corn (Kumar's method 1, over the whole slurry volume and the initial dry
      corn mass), which is a feedstock-conversion metric, not a sugar-to-ethanol metric. Converting it to
      a fraction of 0.511 g/g would require the starch content of the corn, which is not reported. This
      is the single largest gap in the candidate.
    what_data_it_actually_contains: >-
      Fermentation profiles (glucose and ethanol over time, for five strains x four conditions) as
      figures; productivity and yield as figures only; full time-resolved profiles including maltose,
      maltotriose, glycerol and acetic acid in four supplementary tables (S1-S4); growth curves at
      30/35 degrees C with and without 14% ethanol in supplementary tables S5-S6. The final ethanol
      concentrations for every strain and condition are given numerically in the running text. No raw
      deposited data; the paper states all data are in the main text and the additional file. Genomic
      claims about BG-1 (STL1, PAD1, FDC1, MCH2, YKL222C copy number) are cited to another paper, not
      generated here.
    accessions: "none found in the stored text; no sequencing performed in this work"
    why_this_slot: >-
      It is the kind of reference the other two are not: a starch feedstock under industrial dry-grind
      SSF, where sugar is released slowly instead of charged, at solids loadings (35%) above the 30-32%
      the paper says the industry is normally restricted to. It carries Ethanol Red as an explicit
      in-batch control against four named industrial strains, so it gives a five-strain spread rather
      than a single number, and it reaches the highest titres of the three candidates (BG-1 19.81% v/v,
      ER 18.78% v/v at 96 h). If the owner wants the ceiling defined by what a plant actually runs rather
      than by a defined-medium VHG flask, this is the candidate. It also separates two stresses the other
      papers conflate — temperature (35 degrees C) and solids/ethanol — into distinct arms.
    what_it_lacks: >-
      (1) No yield as a fraction of theoretical, anywhere, and no starch content with which to compute
      one. For a slot whose stated purpose is "the achievable yield fraction", this is a serious
      omission. (2) No initial sugar in g/L — only solids %, which is not a gravity a measurement can be
      keyed to without the corn composition. (3) Productivity and yield exist only inside figures; the
      text gives percentage changes, not absolute g/L/h. (4) Ethanol is reported in % v/v throughout, so
      every titre needs converting. (5) The abstract says BG-1 reached "higher than 19% w/v" while the
      results say 19.81% v/v — w/v and v/v are not interchangeable and the abstract appears to be wrong.
      (6) The text quotes BG-1's peak twice with different digits, "19.81" in one sentence and "19.78%"
      with "18,79%" for ER a few lines later (comma decimal), so the figures need reading off the source
      table. (7) The 96-h high-solids point was collected because 72 h was incomplete, so the 72-h and
      96-h numbers are not two timepoints of one designed series. (8) No accessions, no sequencing.
    evidence:
      - claim: "Headline: high-solids condition, strain, titre, productivity gain."
        quote: |-
          In fermentations with high solids concentration (35%), strain BG-1 reached ethanol contents higher than 19% w/v and had a productivity gain of 5.8% compared to fermentation at 30%.
      - claim: "SSF conditions: vessel, mass, pH, enzyme dose, urea dose, temperature, duration, agitation."
        quote: |-
          All fermentation experiments were carried out in triplicate, in a 250-mL Erlenmeyer flask, containing 100 g of the liquefied paste. After the liquefied paste had undergone cooling, its pH was applied to 4.9 using using sulfuric acid solution (10 N). Then, the Spirizyme enzyme was added in an amount of 0.035% m/m and urea (160 µL of solution at 50% w/v in 100 mL). Then, the inoculum of the yeasts was made in a standardized way for all strains, and the cell concentration was measured by measurements in an optical spectrometer. The SSF process took place at 32 °C for 72 h in a shaker with a continuous output of 150 rpm.
      - claim: "Liquefaction conditions preceding SSF."
        quote: |-
          The pH of the mixture was prepared to 5.3 (optimal pH for alpha-amylase) using sulfuric acid solution (10 N). The mixture was then conducted to a reactor with a heating mantle and continuous suspension of 1200 rpm, and subjected to liquefaction for 90 min at a temperature of 85 ºC, the amount of Liquozyme added was 0.02% m / m.
      - claim: "The standard condition's three defining parameters."
        quote: |-
          The standard fermentation condition (initial cell concentration of 0.4%, solids content of 30%, and temperature of 32 °C) was based on the work of Kumar and Singh and represents the basic operating parameters used by corn-ethanol plants.
      - claim: "Standard-condition titres for all five strains including Ethanol Red."
        quote: |-
          The final ethanol concentrations were 16.46, 16.7, 16.89, 16.47, and 16.76% v/v for ER, BG-1, CAT-1, PE-2, and SA-1, respectively.
      - claim: "High-solids titres for all five strains at 96 h."
        quote: |-
          Thus, a second point was collected at 96 h of fermentation that resulted in average final ethanol concentrations of 18.78, 19.81, 17.06, 17.27, 18.82% v/v, respectively.
      - claim: "Productivity reported as relative change only."
        quote: |-
          When comparing the productivity (Fig. .A) of the standard condition (30%) versus the high solids condition (35%) in 72 h, we observe a productivity gain of 5.8% and 3.4% using the BG-1 and ER, respectively, while for the CAT-1 yeast there is a loss of productivity of 14.1%.
      - claim: "How yield was defined — per kg of dry corn, not against theoretical."
        quote: |-
          Productivity was obtained by concentration as a function of time, and yield was calculated using method 1 described by Kumar, , which considers the entire volume of slurry and the initial mass of dry corn.

how_i_narrowed: >-
  209 candidates is far past reading, so the triage was mechanical first and manual only at the end.
  Step 1 — scripted scoring over all 209 stored full texts, not over titles. Titles alone were
  unreliable here: several of the strongest VHG papers do not say "VHG" in the title, and several that
  do are brewing or wine papers with beverage-scale titres. So each document was scanned for eight
  regex families corresponding to the fields the slot demands — VHG/very-high-gravity wording, named
  commercial strains (Ethanol Red, Thermosacc, Fermiol, Angel), fed-batch, a theoretical-yield
  denominator, a volumetric productivity in g/L/h, an ethanol titre in g/L or % v/v, a temperature in
  the 25-39 degrees C band, and a nitrogen term (urea, DAP, ammonium, yeast extract, Fermaid) — and
  scored. Step 2 — a targeted pass for the two phrases that define the slot: "Ethanol Red" (29
  documents mention it, most only as a citation) and VHG/very-high-gravity used three or more times
  (18 documents, which separates papers about VHG from papers that mention it once in an
  introduction). Their union is 43 documents, of which about 25 survived a look at title and journal. Step 3 — a separate scripted sweep for any ethanol titre at
  or above 120 g/L anywhere in the pool, so that a high-performing paper missed by the keyword pass
  would still surface; this added 00043, 00264, 00699 and 01118 to the reading list and confirmed
  nothing above 158 g/L exists in the pool. Step 4 — read the abstracts of the leading 12, then the
  Methods and Results of the leading 8 in full (00755, 00840, 00715, 00609, 00602, 00879, 00110,
  00184), checking each against the nine required condition fields one at a time. Step 5 — chose for
  difference rather than for score: the three shortlisted are a fed-batch cell-recycle sugar-juice
  process, a defined-glucose batch with the commercial strain itself as the control, and a starch SSF
  at high solids. Papers that scored well but were dropped: 00609 (Ethanol Red with the highest yield
  fraction in the pool, 94.9% of theoretical, but only ~98 g/L — below the owner's chassis, so it
  calibrates yield and not the ceiling); 00602 (excellent VHG record but the interesting variable is
  redox-potential control, a process intervention the programme is not calibrating against); 00879 and
  00599 (VHG-focused but the fermentation record is thin and the subject is strain construction);
  00110 (the best nitrogen-supplementation arm in the pool, but wine yeasts on grape juice, not an
  industrial fuel-ethanol process); 00699 (111.65 g/L from 250 g/L molasses in a 5 L fermenter at
  95.53% conversion — a good fourth pick, just below the chassis titre).

ceiling_summary: >-
  The highest well-conditioned ethanol titre found anywhere in the 209-candidate pool is 158.1 +/- 1.70
  g/L (20.0 +/- 0.22% v/v), by genome-shuffled hybrid H1 in 00715, from 150 mL of YP + 35% (w/v) glucose
  in a waterlock-sealed 250 mL bottle, 30 degrees C, 150 rpm, inoculated at OD600 = 1.0 (~2.0 x 10^7
  cells/mL), batch, terminated on a weight-loss stopping rule, at 0.49 +/- 0.00 g/g of sugar consumed
  and an estimated 0.94 +/- 0.01 g/L/h normalised to day 7. The commercial reference in the same batch,
  Ethanol Red, gave 149.7 +/- 2.94 g/L (19.0 +/- 0.40% v/v) at 0.49 +/- 0.01 g/g and 0.90 +/- 0.03
  g/L/h. On a feedstock rather than a defined medium, the highest is BG-1 at 19.81% (v/v) (agent's
  arithmetic ~156 g/L) in 00840, from 35% corn solids under SSF at 32 degrees C with urea, 96 h, with
  Ethanol Red at 18.78% (v/v) (~148 g/L) in the same experiment — but that paper reports no yield
  fraction, so the titre travels without a yield. The highest well-conditioned YIELD in the pool is a
  different paper from the highest titre: 94.9 +/- 2.8% of theoretical, by Ethanol Red dry yeast at 2 g/L
  on sugar beet thick juice wort of 250 g/kg extract supplemented with diammonium hydrogen phosphate at
  0.3 g/L (00609, not shortlisted) — but that fermentation reached only 12.4 +/- 0.3% (v/v) (~98 g/L)
  after 94 h, below the owner's chassis. Read together: the ceiling the programme is calibrated against
  is roughly 150-158 g/L at 0.45-0.49 g/g (88-96% of the 0.511 g/g glucose theoretical) and 0.9-5.6
  g/L/h depending entirely on whether productivity is computed to completion or across a recycle cycle.
  All of these are batch or fed-batch with uncontrolled growth; none is the near-zero-growth chemostat
  regime where yield approaches theoretical, and none should be compared with the ~78% anaerobic
  chemostat wild-type figure.

pool_assessment: >-
  Yes, 20 is fillable, but not with 20 papers of the quality of the three above, and the budget should
  not be spent on titre alone. A scripted completeness screen across all 209 stored texts — asking
  whether each of titre, initial gravity, a theoretical-yield denominator, a g/L/h productivity, a
  temperature, a fermentation duration, a nitrogen term and a process mode appears anywhere in the
  document — put 11 documents at 8/8 and 39 at 7/8 or better. That is comfortably more than 20. The
  screen is generous, though: it detects a field anywhere in the text, including in an introduction or
  a reference, not attached to the measurement being reported, and two of the three shortlisted papers
  score only 6-7 on it while actually carrying complete records. So the honest reading is that roughly
  25-40 candidates carry most of the fields, and about 15-25 will survive a curator confirming that
  the fields belong to the same measurement. Three cautions about what filling the remaining slots
  would pull in. First, the pool skews lignocellulosic and xylose-fermenting rather than industrial
  first-generation: of the 39 that score 7/8 or better, a large share are xylose, cellulosic-hydrolysate
  or non-Saccharomyces papers, and at least twelve documents in the pool apply the 0.51 g/g figure to
  xylose as the theoretical maximum. That value is right for xylose as it happens (3 xylose -> 5 ethanol
  gives the same 0.51 g/g), but several of these papers apply a single 0.51 denominator to mixed
  glucose-xylose hydrolysates and to SSF where the available sugar is itself an estimate, so the
  denominators are not comparable across the set and each needs checking individually before any yield
  fraction is admitted. Second, the unit hygiene in this literature is poor: % v/v and % w/v are used
  interchangeably in abstracts of papers whose bodies use the other, and two of the three shortlisted
  candidates contain exactly that error, so extraction should key on the body tables and not the
  abstracts. Third, and most limiting for the slot's stated purpose, very few of these papers report
  yield as a fraction of theoretical AND a volumetric productivity AND a titre for the same run; the
  common failure is a paper with two of the three, and the commonest missing one is the yield fraction.
  If the owner wants 20 records rather than 20 papers, the budget is easily filled; if the owner wants
  20 papers each carrying a complete, internally consistent process record, the realistic number from
  this pool is closer to 12-15, and reporting that shortfall is itself the finding the slots document
  asks for.

