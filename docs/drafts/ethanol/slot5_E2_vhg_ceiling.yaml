          H8 | Unknown | F3 | 102.0 ± 0.70 | 19.0 ± 0.13 | 150.3 ± 1.03 | 98.3 ± 0.59 | 0.88 ± 0.01 | 0.49 ± 0.00

          H9 | 78 | F1 | 100.0 ± 1.05 | 19.1 ± 0.20 | 151.0 ± 1.58 | NA | NA | 0.48 ± 0.01

          P7 | EtOH Red | - | 100 ± 0.83 | 19.0 ± 0.40 | 149.7 ± 2.94 | 100 ± 0.84 | 0.90 ± 0.03 | 0.49 ± 0.01
      - claim: "Small-scale VHG conditions: volume, medium and gravity, inoculum density, seal, agitation, temperature."
        quote: |-
          250-ml Schott bottles each filled with 150 ml YP + 35% (w/v) glucose and a magnetic rod (35 × 5 mm) were inoculated to a starting OD600 = 1.0 (approximately 2.0 × 107 cells/ml). These bottles were sealed with a waterlock and stirred continuously at 150 rpm on a magnetic stirring platform (IKA® RO 15) at 30°C.
      - claim: "The stopping rule that stands in for a stated fermentation duration."
        quote: |-
          The bottles were weighed on a daily base to determine the cumulative weight loss, a proxy for CO2 production. Each fermentation was terminated when its weight loss dropped below 0.20 g/day.
      - claim: "Ethanol Red's yield stated in running text, and the basis (per gram of sugar consumed)."
