# Phase 2 — the ethanol reference layer: proposed admissions.
# DRAFT. Nothing accepted, nothing verified, no confidence set, nothing written to the
# database or under data/. Generated from verified spans; do not hand-edit the offsets.

meta:
  produced: '2026-09-21'
  status: DRAFT PROPOSAL. Nothing written to the database and nothing under data/. No confidence value
    is set anywhere in this file and no record is marked verified. Project rule L.5 / decision D2.
  what_this_is: 'The phase-2 admission set as it actually is: a half-filled layer. Each record names its
    admission criterion, carries at least one verbatim quote with character offsets re-resolved by fermdb.llm.validate.verify_span,
    and every E4 record carries the transfer_rationale B.3.4 requires. E5 admits nothing; see PHASE2_STATUS.md
    for why.'
  quote_policy: Every quote is a contiguous verbatim span of the stored full text for that publication_id,
    taken through fermdb.extract.harness.load_source_text. No ellipses, no splicing of non-adjacent sentences,
    no paraphrase inside quote marks. Hyphenation, ligatures, line breaks and PDF extraction artefacts
    are reproduced exactly, because cleaning them would break the offsets. Offsets are 0-based half-open
    [char_start, char_end).
  span_verification:
    spans_checked: 63
    re_resolved_exact: 63
    absent: 0
    spliced: 0
    note: Three quotes occur more than once in their source (repeated data-availability statements); they
      are exact but not positionally unique, and the recorded offset is the first occurrence. occurrences_in_source
      records this per span.
    what_the_63_is_made_of: >-
      ADDED 2026-09-22 to stop a recurring conflation. 63 = 53 spans under `records` + 10 basis
      spans under `retagging_E5`. The installed layer
      `data/literature/ethanol_admissions.yaml` carries only the admissions themselves, so it
      holds 53 spans and its header correctly states `spans_in_this_file: 53,
      re_resolved_exact: 53`. The 10 re-tagging basis quotes stay in this draft because nothing
      is re-tagged by installing the admissions. BOTH HEADERS ARE CORRECT AND ALWAYS WERE — 63
      and 53 are counts of two different things, not two counts of one thing. Earlier reporting
      cited "63 of 63" against the data/ file, which is the only error here, and it is in the
      reporting rather than in either file. Re-counted 2026-09-22 by walking both documents for
      objects carrying `quote` + `char_start` + `char_end`: this file 63 (53 records + 10
      retagging_E5), the data/ file 53 (all under records). `retagging_other` carries 8 entries
      and no spans, which is why it adds nothing to either total.
  caps:
    publication_cap: 150
    measurement_study_cap: 60
    publications_admitted_here: 23
    measurement_bearing_admitted_here: 22
