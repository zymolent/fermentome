      is on GPD1, ADH3 gets a single hemizygosity panel and no follow-up, and nothing is measured
      in the matrix — the redox readout is cytosolic glycerol. Likely as useful to slot 7 (E6) as
      to this slot.

  - doi: 10.1093/femsyr/foac007
    pmid: '35137036'
    year: 2022
    corpus_file: 00334.txt
    title: >-
      Respiratory reoxidation of NADH is a key contributor to high oxygen requirements of
      oxygen-limited cultures of Ogataea parapolymorpha.
    note: >-
      Same group and the same non-Saccharomyces caveat as candidate 1, but it is the pool's
      clearest treatment of where NADH reoxidation capacity actually binds under oxygen limitation.
      Worth holding as the alternate if the owner picks candidate 1 and then wants its
      oxygen-limitation counterpart.

pool_assessment:
  question_asked: >-
    Does the 45-publication E5 budget, set before anyone looked at the corpus, correspond to 45
    admissible papers in this pool?
  short_answer: NO — not at any admission bar that would make an E5 record worth extracting.
  counts_measured:
    method: >-
      Regex over the stored full text of all 129 pool members for the criterion's own vocabulary:
      POS5/Pos5/NAD(H) kinase/NAD+ kinase; ADH3/Adh3; NDI1/NDE1/NDE2; "mitochondrial NADPH" or
      "matrix NADPH"; "mitochondrial NADH" or "matrix NADH" or "intramitochondrial NADH"; "redox
      shuttle" or "ethanol-acetaldehyde shuttle". This measures PRESENCE OF A TERM, not relevance.
    total_pool: 129
    mention_Saccharomyces_cerevisiae_anywhere: 114
    mention_at_least_one_core_matrix_redox_term: 43
    mention_at_least_two_core_terms: 18
    mention_POS5_or_NAD_kinase: 17
    mention_ADH3: 14
    mention_NDI1_or_NDE1_NDE2: 10
    mention_mitochondrial_or_matrix_NADH: 18
    mention_mitochondrial_or_matrix_NADPH: 4
    mention_a_redox_shuttle_by_name: 4
  what_those_numbers_mean: >-
    43 of 129 mention the vocabulary at all; 18 mention two or more terms; only 4 use the phrase
    "mitochondrial NADPH" or "matrix NADPH" and only 4 name a redox shuttle. Mentioning is a
    generous bar — several of the 43 hits are a single sentence in an introduction or a gene name
    in a supplementary table. Reading the titles of the 18 two-term papers, roughly a dozen are
    engineering studies that deploy Pos5 as a tool in the CYTOSOL, which is the wrong compartment
    for this slot. The pool also carries clearly off-criterion material that discovery's E5 tag
    swept in - rice dehydration tolerance, Euphorbia diterpenes, mouse hippocampus, Drosophila
    alternative oxidase, horse liver alcohol dehydrogenase, human LIPT1, Arabidopsis ALDHs - and
    none of that should be counted against the budget.
  honest_estimate: >-
    If "admissible" means the paper carries at least one extractable, condition-annotated
    measurement bearing on matrix redox, this pool supports roughly 15-25 records, not 45. If
    "admissible" is tightened to COMPARTMENT-RESOLVED measurement — the preference the slot itself
    states — the number is well under 10, and this shortlist holds three of them. If it is
    tightened further to a matrix NAD(P)H pool or ratio measured in living S. cerevisiae under a
    named condition, the number is ZERO.
  recommendation_to_the_owner: >-
    ETHANOL_REFERENCE_SLOTS.md already says what to do with this: "an unspent share is not
    reallocated automatically — it is reported, because 'we found fewer admissible papers than
    expected' is a finding about the literature, not slack to consume." This is that report. The
    45 should be recorded as substantially unspent rather than padded with cytosolic-Pos5
    engineering papers, which would fill the count while leaving the matrix question exactly as
    unanswered as it is now. The residual gap does not look like a discovery failure and a wider
    search is unlikely to close it: the measurement does not appear to exist in this corpus. It
    should be entered as a knowledge_gap row — matrix NAD+/NADH and NADP+/NADPH pools in
    S. cerevisiae under fermentative conditions, unmeasured — alongside the POS5-capacity gap that
    DUET_TARGET.md section 7 already calls for. The STAR Protocols mito-roGFP entry above is the
    method note that belongs with it.
  caveat_on_this_assessment: >-
    The counts are term presence in stored full text, computed by regex, and were not
    hand-adjudicated paper by paper. They bound the pool from above rather than from below — a
    paper could carry relevant data without using any of these words, though for this criterion
    that is unlikely. Ten of the 129 leading candidates were read in full; the remainder were
    triaged on title plus targeted full-text search.
