# Slot 6 — Mitochondrial redox shuttle (criterion E5). THREE CANDIDATES, OWNER PICKS ONE.
#
# Drafted by the literature agent per docs/reference/ETHANOL_REFERENCE_SLOTS.md, which sets the
# procedure: "the literature agent proposes three candidates per slot, and the owner picks one.
# The agent does not choose; it shortlists."
#
# NO `confidence` FIELD IS WRITTEN ANYWHERE IN THIS FILE, and nothing here is marked accepted or
# verified. Nothing under data/ was touched. This is a draft for a human decision.
#
# READING THE QUOTES. Every string under `evidence` is a verbatim, contiguous span of the stored
# full text — no ellipses, no splicing. Where two passages are used they are listed separately.
# The corpus cache strips inline citation markers, so the stored text contains empty parentheses
# "()" and bracket pairs "[, ]" where the publisher had reference numbers. Those artefacts are
# reproduced exactly rather than cleaned, because cleaning them would break character-for-character
# fidelity. The spelling "mitochondriona" in candidate 3's third quote is in the published text.
#
# QUOTE CHECK, RUN AFTER DRAFTING. All 20 evidence strings were re-resolved against the stored
# full text: 20/20 exact matches, 0 failures, no ellipses, nothing spliced. 18 of the 20 are
# unique in their document; the two data-availability quotes (candidate 2's fifth, candidate 3's
# eighth) each occur TWICE in the cached text because the cache repeats the availability statement
# in a trailing section. Both occurrences are identical, so those quotes are exact but not
# positionally unique.
#
# ──────────────────────────────────────────────────────────── WHAT THE POOL ACTUALLY CONTAINS
#
# The honest headline before the candidates: NOTHING IN THIS POOL MEASURES MATRIX NAD(P)H IN A
# LIVING S. CEREVISIAE CELL UNDER A NAMED CONDITION. No compartment-resolved NAD+/NADH or
# NADP+/NADPH ratio, no matrix-targeted Peredox/SoNar/iNap sensor dataset, no absolute matrix
# cofactor pool measured against a fermentation. The one compartment-resolved live-cell redox
# method in the pool (STAR Protocols, listed below) reports glutathione redox potential via
# mito-roGFP, which is not the NAD(P)H pool. So the gap the slot was opened to close — "the atlas
# currently has no transcriptomic or quantitative anchor for matrix redox at all" — CANNOT BE
# FULLY CLOSED FROM THIS POOL. The three candidates are the three best partial anchors, and they
# are partial in three different directions on purpose: one measures WHERE the ethanol-oxidising
# enzyme sits, one measures HOW MUCH mitochondrial protein there is per condition with the raw
# data deposited, and one PERTURBS matrix NADPH supply in a DUET-shaped pathway and reads the
# consequence as titer.
#
# THE THREE PRIOR FINDINGS, RE-CHECKED IN THE STORED TEXT RATHER THAN INHERITED:
#   * "Pos5 is considered as the main source" — CONFIRMED verbatim in doi:10.1186/s13068-023-02309-z
#     (candidate 3, quote 3). The same paper's preceding sentence lists Ald4/Ald5, Idp1 and Mae1 as
#     the other routes (quote 2), so "primary, not exclusive" is the paper's own framing rather
#     than a gloss placed on it.
#   * "Pos5 converts NADH to NADPH by consuming ATP" — the foae006 claim is INDEPENDENTLY
#     CORROBORATED inside candidate 3, which says "active NADPH synthesis from NADH with ATP
#     consumed". Note that neither paper MEASURES the ATP cost; both assert it from the enzymology.
#   * The Mae1 contradiction is VISIBLE WITHIN A SINGLE CANDIDATE: in candidate 3, MAE1
#     overexpression cut 3-HP titer from 3.42 to 2.56 g/L, and an NADP+-preferring MaeA* mutant
#     also lost ground. Whatever the second corpus paper reports, this one is negative on Mae1.

slot:
  number: 6
  name: Mitochondrial redox shuttle
  criterion: E5
  budget: 45
  question: How do reducing equivalents reach the matrix?
  why_load_bearing: >-
    DUET runs the Ehrlich pathway in the mitochondrial matrix. Ilv5 needs NADPH and the ADH step
    needs NADH. Ethanol oxidation by Adh3 supplies matrix NADH directly, and Pos5 is the named
    route from matrix NADH to matrix NADPH (DUET_TARGET.md section 7, which calls POS5 "a single
    point of failure"). The atlas has no transcriptomic or quantitative anchor for matrix redox.
  pool: 129 readable candidates tagged E5 by discovery
  procedure: agent shortlists three, owner picks one

