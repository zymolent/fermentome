provenance:
  produced: 2026-09-21
  produced_by: literature agent, slot 7 shortlist task
  read_in_full: >-
    Corpus files 00430, 00632 and 00863 end to end; 00448, 01009, 00897, 00636, 00545, 00934,
    00992, 00795 and 00363 read in substantial part; abstracts, strain tables and data-availability
    sections read for the remainder of the leading set.
  quote_discipline: >-
    Every string under an `evidence` key was taken by exact-offset slice from the stored full text
    and emitted as a YAML literal block, so the characters are the document's own and internal
    whitespace is preserved. No quote is spliced and no ellipsis joins two passages; where two
    passages are needed they appear as two separate quote entries. Empty bracketed citations "()"
    and "[]" are artefacts of the stored text's citation stripping and are preserved rather than
    cleaned.
  not_written: >-
    No `confidence` value appears in this file. Nothing is marked accepted or verified. Nothing
    under data/ was read for writing or modified. The owner picks one candidate; this file does
    not pick.
