recommended:
  pick: doi:10.1016/j.mec.2024.e00245
  runner_up: doi:10.1186/s13068-023-02309-z
  reasoning: >-
    Four reasons, and the fourth is the one that decides it.
    (1) It is the only paper in the pool that puts a CONDITION on Pos5's usefulness instead of
    treating Pos5 as a monotonic knob, and it names the mechanism: the NADH/NAD+ ratio falls by an
    order of magnitude after the diauxic shift, so Pos5 runs out of substrate.
    (2) That condition is DUET's condition. DUET proposes to feed Pos5 from matrix NADH generated by
    Adh3 oxidising ethanol — i.e. in an ethanol-consuming redox state. This is the corpus's
    strongest available warning that the substrate may not be there when the architecture needs it,
    and G.8 already names POS5 capacity as the atlas's highest-priority bottleneck hypothesis.
    (3) It is in S. cerevisiae (CEN.PK2-1C derivatives), in controlled bioreactors, in triplicate,
    with t-tests — which candidates 3, 5 and 6 are not, and which candidate 4 is only in the wrong
    organism.
    (4) It is the only candidate that argues AGAINST the programme's own hypothesis. An atlas whose
    E5 anchor is a paper that says "Pos5 helps" is worth less than one whose anchor says
    "Pos5 helps, and here is the metabolic state in which it stops helping".
  the_honest_caveat_on_this_pick: >-
    ITS POS5 IS CYTOSOLIC. The N-terminal mitochondrial targeting sequence (amino acids 1-17) is
    deleted, so the enzyme is in the wrong compartment for slot 6's literal question, and the
    substrate pool whose collapse it reports is the CYTOSOLIC NADH/NAD+ ratio. The matrix NADH/NAD+
    ratio after the diauxic shift is a different quantity and is exactly the thing nobody has
    measured — it is the knowledge_gap row this layer already carries
    (YAA:GAP:ethanol-0-matrix-nad-p-h-pool-size-and-nad-p-h-nad). So the warning transfers to DUET
    as an L3 transfer claim under B.3.5's own evidence ceiling, NOT as a refutation, and an
    admission of this record must say so on its face. It is also worth stating plainly that the
    order-of-magnitude NADH/NAD+ figure is CITED by this paper from another study, not measured in
    it, and the 50-fold NADH preference of Pos5 is likewise cited. Neither is this paper's own
    measurement.
  why_the_runner_up_could_win_instead: >-
    doi:10.1186/s13068-023-02309-z is architecturally closer: a heterologous NADPH-consuming pathway
    targeted INTO the matrix of a CEN.PK strain, with NATIVE (matrix) POS5 overexpressed against it
    and the result read out as titer (+23.4% with -13.6% biomass; +33% with IDP1 co-overexpression;
    ALD4 nothing; MAE1 negative). If the owner's priority is "what does raising matrix Pos5 buy",
    that paper answers it and this one does not. The trade is: candidate 2 has the right compartment
    and no condition-dependence; candidate 1 has the wrong compartment and the condition-dependence
    that bears on whether DUET's regime supplies Pos5 at all. Picking both would spend 2 of 45 and
    is defensible; they contradict each other in no respect.

