mis_tagged_candidates:

  - doi: "10.1186/s13068-019-1486-8"
    pmid: "31303893"
    currently_tagged: "E3 and E5"
    should_carry: "E1 (in addition to, or instead of, its current tags)"
    severity: "high — this is candidate 1 above"
    why: >-
      Its central Pdc results are pure E1 material: a pdc1Δ pdc5Δ strain with ethanol driven from
      13 g/L to 0.01 g/L, glucose consumption crippled, both MTH1 workarounds applied, C2
      supplementation tested and excluded as the bottleneck, and the glycerol branch taking over
      NAD+ regeneration when ADH1 is deleted. Tagging it E3 (wild-type baseline physiology) and E5
      (redox shuttle) but not E1 means the counterfactual slot's strongest paper is invisible to
      the query that should find it. The E5 tag is defensible on the NADH/NADPH discussion; the E3
      tag looks like an artefact of the CEN.PK113-7D wild-type controls.

  - doi: "10.1016/j.meteno.2016.01.002"
    pmid: "29142820"
    currently_tagged: >-
      none of E1–E6 — it is in the 1,311-document corpus but absent from every ethanol criterion
      pool, so it is presumably held in the isobutanol layer rather than the ethanol layer
    should_carry: "E1 as well"
    severity: "high"
    why: >-
      IMZ500 and IME307 are pdc1Δ pdc5Δ pdc6Δ MTH1ΔT strains, and the paper's quantitative finding
      is precisely what the Pdc-minus route costs: no anaerobic growth, ~45% of carbon to glycerol,
      and 2,3-butanediol outyielding isobutanol thirty-six-fold. If the ethanol layer's E1 records
      are meant to let the atlas read the Gevo/Butamax-lineage literature, this is the paper that
      shows why the academic version of that lineage does not work.

  - doi: "10.1186/s13068-015-0374-0"
    currently_tagged: "none of E1–E6"
    should_carry: "worth checking for E1"
    severity: "medium"
    why: >-
      Titled "Comparative assessment of native and heterologous 2-oxo acid decarboxylases for
      application in isobutanol production by Saccharomyces cerevisiae". It matched the pdc-minus
      sweep and is directly on the Pdc/Aro10/KdcA dual-role question that this slot must document.
      Not read in full in this session; flagged for triage rather than asserted.

  - doi: "10.1016/j.synbio.2022.02.007"
    currently_tagged: "none of E1–E6"
    should_carry: "worth checking for E1 and E5"
    severity: "medium"
    why: >-
      "Comparative functional genomics identifies an iron-limited bottleneck in a Saccharomyces
      cerevisiae strain with a cytosolic-localized isobutanol pathway" — matched the pdc-minus
      sweep. Not read in full in this session.

  - doi: "10.1128/mbio.00520-16"
    currently_tagged: "none of E1–E6"
    should_carry: "worth checking for E1"
    severity: "low-to-medium"
    why: >-
      "Requirements for Carnitine Shuttle-Mediated Translocation of Mitochondrial Acetyl Moieties to
      the Yeast Cytosol" — the carnitine shuttle is one of the named routes for relieving the
      cytosolic acetyl-CoA shortage that causes the Pdc-minus C2 auxotrophy, and candidate 3's
      review cites exactly this line of work. Not read in full in this session.

  - doi: "10.3390/ijms242216378"
    currently_tagged: "E2"
    should_carry: "possibly E1 as well"
    severity: "low"
    why: >-
      "Improved 2,3-Butanediol Production Rate of Metabolically Engineered Saccharomyces cerevisiae
      by Deletion of RIM15 and Activation of Pyruvate Consumption Pathway" — 2,3-butanediol strains
      in this field are routinely pdc1 pdc5 pdc6 triples with MTH1 alleles, and candidate 3's
      applications table lists several. Tagged E2 (performance ceiling), which is a poor fit for an
      engineered non-ethanol producer. Genotype not confirmed in this session.

  - doi: "10.1128/spectrum.02277-22"
    currently_tagged: "E2"
