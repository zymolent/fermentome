    why_this_slot: >-
      This is the paper that prices the workaround, and MTH1-ΔT is the exact allele the incumbent
      Pdc-minus isobutanol literature runs on — it reappears in the Delft chassis IMI302/IMX708
      (doi:10.1016/j.meteno.2016.01.002) and in the Frankfurt strain JWY13 (candidate 1). Reading
