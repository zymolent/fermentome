    conditions: >-
      Aerobic shake flask, 30 °C, selective SC medium without valine, 40 g/L glucose, inoculated at
      OD600 8, duplicate per experiment and repeated at least twice; a parallel series with 1% (v/v)
      ethanol supplemented as a C2 source. HPLC for glucose, ethanol, glycerol, isobutanol,
