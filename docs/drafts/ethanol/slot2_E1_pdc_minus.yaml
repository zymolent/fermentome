      costs. It is also the cleanest available statement of the two-part Pdc-minus defect — C2
      auxotrophy and glucose sensitivity — as separable phenotypes, since MTH1-ΔT fixes the second
      fully and the first only partially. And it names the redox reading of the defect explicitly:
      that alcoholic fermentation exists to reoxidise glycolytic NADH, which is precisely DUET's
      reason for keeping it.

    what_it_lacks:
      - >-
        It does not characterise the unmodified Pdc- defect quantitatively. The ancestral strain's
        phenotype is reported as growth/no-growth on plates and cited to earlier work; there is no
        measured growth rate, biomass yield or C2 requirement titration for RWB837 itself.
      - >-
        The mechanism is left as a hypothesis, and the paper says so — reduced glucose uptake may
        prevent toxic pyruvate accumulation OR may be a redox effect, and the study does not
        separate them. No intracellular pyruvate, no NADH/NAD+ measurement.
      - >-
        The reverse-engineered strain does not reproduce the evolved strain. 0.097 h-1 versus
        0.20 h-1 on glucose alone, and a 4-fold lower pyruvate yield, so unidentified additional
        mutations in TAM are doing real work and are not identified here.
      - >-
        Aerobic only, and at low glucose (7.5 g/L in the bioreactor). Nothing anaerobic, nothing at
        industrial sugar concentrations.
      - "No deposited data of any kind, and 2012-era methods (no whole-genome sequencing in this paper)."
      - >-
        Nothing about isobutanol, KIV or branched-chain metabolism. Its relevance to DUET is
        entirely through the incumbent chassis, not through any measurement made here.

    evidence:
      - quote: >-
          Pyruvate-decarboxylase negative (Pdc-) strains of Saccharomyces cerevisiae combine the
          robustness and high glycolytic capacity of this yeast with the absence of alcoholic
          fermentation. This makes Pdc-S. cerevisiae an interesting platform for efficient
          conversion of glucose towards pyruvate-derived products without formation of ethanol as a
          by-product. However, Pdc- strains cannot grow on high glucose concentrations and require
          C2-compounds (ethanol or acetate) for growth under conditions with low glucose
          concentrations, which hitherto has limited application in industry.
        what_it_establishes: "the two-part defect, stated as two separable phenotypes"
      - quote: >-
          S. cerevisiae strains in which all three structural genes encoding pyruvate decarboxylase
          (PDC1PDC5 and PDC6[]) were deleted, did not produce ethanol, but were unable to grow in
          the presence of high glucose concentrations and, when grown in glucose-limited cultures,
          required the addition of ethanol or acetate to growth media, due to their inability to
          synthesize cytosolic acetyl-CoA from pyruvate [-].
        what_it_establishes: >-
          the triple-deletion phenotype and the cytosolic acetyl-CoA mechanism behind the C2
          auxotrophy. Note the gene names run together as "PDC1PDC5" in the stored text; this is a
          markup artefact and is preserved verbatim.
      - quote: >-
          This experiment confirmed that introduction of the MTH1-ΔT mutation was sufficient to
          enable growth in batch cultures on glucose as sole carbon source (Figure ). In four
          replicate experiments a reproducible specific growth rate of 0.097 ± 0.007 h-1 was
          observed. This specific growth rate is lower than that of the evolved Pdc- strain under
          these conditions (0.20 h-1) [], suggesting that this strain may harbor additional
          mutations which could also contribute to the growth on glucose in the absence of added
          C2-compounds.
        what_it_establishes: >-
          the price of the workaround, and the admission that the workaround is incomplete
      - quote: >-
          The observed increase of glucose tolerance in Pdc-S. cerevisiae upon expression of a
          mutated allele of MTH1 does not, in itself, explain the mechanism by which Pdc- strains
          become glucose sensitive. Pdc- strains are pyruvate hyperproducers and, in contrast to
          ethanol, pyruvate is unlikely to be exported by passive diffusion through the yeast plasma
          membrane. If it is assumed that the MTH1 mutation mainly acts by restricting glucose
          transport and, therefore, glycolytic flux, it might prevent intracellular accumulation of
          pyruvate to toxic levels. A possible alternative explanation is related to redox
          metabolism. The major function of alcoholic fermentation in wild-type S. cerevisiae is the
          fast reoxidation of NADH formed in glycolysis. Unrestricted glycolytic activity in a Pdc-
          strain, in combination with a limited capacity of the mitochondrial respiratory chain for
          reoxidation of cytosolic NADH, might lead to a reduction of the cytosolic NADH/NAD+ pool
          and thereby inhibit key reactions in biosynthesis.
        what_it_establishes: >-
          the redox reading of the Pdc- defect, in the authors' own hedged terms — and the sentence
          DUET's architecture inverts: alcoholic fermentation exists to reoxidise glycolytic NADH
      - quote: >-
          Reverse engineering of phenotypes obtained by laboratory evolution has the added benefit
          that potential detrimental effects of random mutations obtained during evolution can be
          eliminated.
        what_it_establishes: "the methodological claim the paper's value rests on"

