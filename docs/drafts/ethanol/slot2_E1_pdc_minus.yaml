      Pdc1 and Pdc5 are not purely competitors but also perform the KIV → isobutyraldehyde step,
      so deleting them destroys the product as well as the by-product. That is the sharpest
      available argument for a Pdc-positive chassis, made by a group that was trying to build a
      Pdc-minus one.

    what_it_lacks:
      - >-
        It is a DOUBLE deletion (pdc1Δ pdc5Δ), not the triple. PDC6 is intact. The authors argue
        PDC6 is not expressed on glucose, but the atlas cannot record this strain as a Pdc-null.
      - >-
        Shake flask only. No bioreactor, no pH control, no chemostat, no gas analysis — so there
        are no specific rates, no carbon balance and no biomass yields. Everything is titre at a
        time point.
      - >-
        Aerobic throughout. It says nothing about anaerobic or micro-aerobic Pdc-minus physiology,
        which is where DUET's process sits.
      - >-
        No accessions and no supplementary datasets; the numbers must be read from the text and
        from figures.
      - >-
        The dual-role conclusion is inferential, not enzymological — it rests on isobutanol going
        to zero in the double mutant, not on a KIV decarboxylase assay in that strain. The assay
        evidence for the dual role is in candidate-adjacent doi:10.1186/1754-6834-5-65 (see
        pdc_dual_role below).
      - >-
        Every effect is measured in a heavily modified background (seven prior deletions plus a
        multicopy plasmid), so the Pdc phenotypes are not isogenic-to-wild-type comparisons.
      - >-
        It is currently tagged E3/E5. Choosing it means correcting the tag.

    evidence:
      - quote: >-
          Additional deletions of PDC1 and PDC5, even after restoring slow growth by overexpressing
          Mth1 (strain JWY12) or by engineering Mth1∆T (strain JWY13), had negative effects and
          stopped isobutanol biosynthesis completely (Fig. b, c). Even after 168 h, isobutanol was
          not detectable (data not shown). This confirmed the results of Choo et al. [], Brat et al.
          [] and Milne et al. [], indicating that Pdc1 and Pdc5 significantly contribute also in the
          conversion of KIV to isobutyraldehyde within the Ehrlich pathway.
        what_it_establishes: "the Pdc dual role, and that deleting the sink deletes the product"
      - quote: >-
          Compared to the wt strain CEN.PK113-7D (13 g/L), JWY0 (13.8 g/L) and JWY04 (13.4 g/L),
          single deletion strains JWY14 (∆pdc1) and JWY15 (∆pdc5) showed only minor effects in
          ethanol production, resulting in ethanol titers of 12.6 g/L and 12.3 g/L, respectively,
          whereas the pdc1/5 double deletion strain JWY13 showed an ethanol titer of only 0.01 g/L
          (Fig. c).
        what_it_establishes: >-
          the single-vs-double genotype distinction, quantitatively. This is the source of the
          12.6 / 13 / 0.01 g/L figures carried in earlier project notes; they are confirmed here in
          the paper's own words, and the pdc5Δ single (12.3 g/L) is added.
      - quote: >-
          Since PDC6 normally is not expressed [], deletions of PDC1 together with PDC5 were
          sufficient to block ethanol biosynthesis. However, pdc− strains cannot grow on high
          glucose concentrations [].
        what_it_establishes: >-
          the paper's own justification for leaving PDC6 intact, and the glucose-sensitivity
          premise
      - quote: >-
          Moreover, while glucose was consumed completely within 24 h in strains JWY0 to JWY04,
          pdc1/5 double deletions severely affected the glucose consumption even with overexpressed
          or engineered Mth1ΔT (glucose consumption after 168 h: 7.54 g/L for JWY12 and 6.79 g/L for
          JWY13) (Fig. a).
        what_it_establishes: >-
          the size of the glycolytic penalty, and that the MTH1 workaround does not remove it —
          under 7 g/L of 40 g/L glucose consumed in a week
      - quote: >-
          This clearly demonstrates that a potential C2 auxotrophy is not the bottleneck for
          isobutanol production in Pdc-deficient cells.
        what_it_establishes: >-
          a NEGATIVE result the atlas should carry: C2 supplementation is not sufficient rescue.
          Read with the preceding sentence, which reports that ethanol supplementation raised
          JWY13 only to 0.03 g/L isobutanol while also raising the Pdc-proficient strains.
      - quote: >-
          Due to an autoregulation of PDC expression, pdc1 and pdc5 single mutants exhibit only
          slightly reduced Pdc activities [, ].
        what_it_establishes: >-
          the derepression mechanism behind the near-null effect of a single deletion

