    what_data_it_actually_contains: >-
      Quantitative maximum specific growth rates from controlled bioreactors, in replicate:
      0.24 ± 0.00 h-1 (reverse-engineered MTH1-ΔT) versus 0.23 ± 0.00 h-1 (evolved) on glucose plus
      ethanol, and 0.097 ± 0.007 h-1 across four replicates on glucose as sole carbon source.
      Pyruvate yields on substrate for both strains with a t-test. Tetrad segregation data (23
