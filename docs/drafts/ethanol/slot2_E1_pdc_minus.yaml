# Slot 2 — pdc-minus / Pdc-attenuated background (criterion E1).
# THREE CANDIDATES. The owner picks one. This file does not choose.
#
# ────────────────────────────────────────────────────────── READ THIS FIRST
#
# THIS SLOT IS THE ROAD NOT TAKEN. PLAN.md B.3.1 (amended 2026-09-20, DUET §5.1) struck the
# sentence that called a Pdc-minus background "the likely starting chassis" and replaced it with
# the opposite: "The chassis is Pdc-POSITIVE." DUET keeps Pdc because the ethanol–acetaldehyde
# shuttle is the mechanism, not the competition. Whatever the owner admits here characterises the
# ALTERNATIVE DUET REJECTED, never DUET itself. An assertion about DUET derived from any record in
# this slot is a cross-chassis inference and is capped under J.3.
#
# ALWAYS STATE THE GENOTYPE. Every candidate below names which PDC genes are deleted, because
# single, double and triple deletions have different phenotypes and the corpus itself confuses
# them. "pdc-minus" without a genotype is not usable.
#
# THE POOL IS SHORT AND THE SHORTAGE IS AN ACQUISITION GAP, NOT SCARCITY. 16 readable candidates
# against a 25 budget. See pool_assessment: all 16 were opened, 5 read end to end, and the missing
# 9 are not missing from the literature — they are sitting in the manual download queue. The
# founding measurements of the Pdc-minus phenotype (Flikweert 1996, van Maris 2004) are among
# them, which is why NO candidate below is a primary characterisation of the defect itself.
#
# ONE CANDIDATE IS NOT FROM THE E1 POOL. Candidate 1 (doi:10.1186/s13068-019-1486-8) currently
# carries E3 and E5, not E1. It is flagged in mis_tagged_candidates and would need re-tagging if
# chosen. It is proposed anyway because it is the only paper found anywhere in the 1,311-document
# corpus that measures the FULL E1 cost ledger — ethanol abolished, growth crippled, C2 auxotrophy
# tested and excluded as the bottleneck, glycerol compensation, and the Pdc dual role — inside an
# isobutanol-producing strain. Hiding it in a footnote would not serve the choice.
#
# NO `confidence` FIELD IS WRITTEN ANYWHERE IN THIS FILE, and nothing is marked accepted or
# verified. A human sets those. Nothing under data/ was touched.
#
# QUOTE HANDLING. Every `evidence` string is a verbatim, unspliced run of text from the stored full
# text. No ellipses; where two passages are needed they are listed as separate quotes. Quotes are
# written as YAML folded scalars (>-): the source passages are single continuous paragraphs with
# single spaces, so folding line breaks back to single spaces reproduces them character for
# character. Empty reference brackets "[]" and empty parentheses "(Fig. )" are artefacts of the
# stored text and are preserved as they stand.
#
# DEAD `corpus_file:` MARKERS REPLACED, 2026-09-22 — 15 of them in this file.
# They pointed at a numbered scratchpad cache (`NNNNN.txt`) that no longer exists anywhere on
# this machine, so as provenance they could not be dereferenced by anyone, including the
# 2026-09-22 provenance sweep. That sweep also established that the cache was not a DIFFERENT
# text — every quote checked against it re-resolves character-identically against the
# `fulltext_asset` store — so nothing is lost by dropping the pointer and keeping the DOI.
#   15 were removed as redundant: a `doi:` or `publication:` sat beside them in the
#   same record and already carried the provenance.
# Checked before removal: across all 15 draft files the 101 distinct cache numbers each map
# to exactly ONE DOI, so the markers were internally consistent and carried no information
# the adjacent DOI does not. No quote string was touched.

