        It is the only item in the pool that holds the whole genotype ladder in one place, which is
        exactly the distinction PLAN.md insists on and which individual papers keep collapsing.

    strains: "n/a — secondary source covering S. cerevisiae lab and engineered strains"
    conditions: "n/a"

    what_data_it_actually_contains: >-
      No primary data. Figures are schematics. One substantial table summarising titre, yield,
      productivity and conditions for lactic acid, 2,3-butanediol, malic acid, succinic acid and
      isobutanol production in Crabtree-negative strains, each row with an explicit genotype and a
      citation. Narrative sections on the two mechanisms of the growth defect (cytosolic acetyl-CoA
      shortage; NADH/NAD+ imbalance), on the ALE-derived suppressor catalogue (MTH1Δ57–131,
      MTH1A81D, MTH1A81P, PYK1R68*/K196*/R91I, OCA5S383*, MED2*432Y, SNF1/MIG1), and on the
      acetyl-CoA replenishment strategies (GLY1, PFL, CIT1 deletion with the Ach1 route, PO/PTA,
      cytoPDH, carnitine shuttle, ACL).
    accessions: "none"
    open_access: >-
      FEMS Yeast Research, Oxford University Press. FEMS titles are published open access; the
      specific licence was not independently verified in this session. Full text held in the
      project corpus.

    why_this_slot: >-
      The programme needs the cost of pdc-minus stated once, completely, with the suppressor
      landscape attached — and the primary papers that would supply it are in the download queue,
      not here. This review is the only item in the pool that delivers that whole picture, and it
      is current (2025), so it includes suppressors discovered after the MTH1 papers (PYK1, OCA5,
      MED2) that no other readable candidate mentions. It also states the two independent causes of
      the growth defect cleanly, and it confirms from the literature side the two facts earlier
      project notes carry: PDC6 is not transcribed on glucose, and PDC5 derepresses when PDC1 is
      removed. As a curator's reference for framing the counterfactual it is unusually efficient.

    what_it_lacks:
      - >-
        It is a review. Every number in it is somebody else's, at one remove, and several of its
        summary sentences are looser than the papers they compress. Anything admitted from it is
        secondary evidence and should be capped as such.
      - >-
        Its framing is Crabtree-negativity for chemical production, not the cost of pdc-minus as
        such. The counterfactual reading is the owner's to impose; the review itself is arguing
        FOR removing Pdc.
      - "No accessions, no deposited data, no measurements, no error bars."
      - >-
        It treats PDC deletion and ADH deletion as alternative routes to the same end. For DUET
        that conflation is actively unhelpful, because the ethanol–acetaldehyde shuttle depends on
        both enzymes being present and on Adh3 in particular.
      - >-
        Its isobutanol coverage is thin — one line in the applications table — so it does not
        connect the Pdc-minus cost to the branched-chain pathway, which is the join the programme
        needs.
      - >-
        Because it is recent and broad, several of its claims rest on papers not present in this
        corpus, so they cannot be checked here.

    evidence:
      - quote: >-
          Deletion of all PDC genes prevented ethanol production, but because the Pdc defect
          resulted in a deficiency of cytoplasmic acetyl-coenzyme A, the strain could not grow in
          medium with glucose as the sole carbon source (Flikweert et al. , Zhang et al. ) (Fig. ).
          Growth can be partially restored by adding acetic acid or ethanol to the medium (Van Maris
          et al. ).
        what_it_establishes: "the C2 auxotrophy, with the founding citations named"
      - quote: >-
          Pdc1 plays a major role and has a very high expression level. Pdc5 is only active when
          there is no Pdc1 protein expression, because its promoter is inhibited by Pdc1 protein
          (Eberhardt et al. ). Pdc2 is not a direct PDC gene, but a transcription factor (Iosue et
          al. ). It regulates the expression of Pdc1 and Pdc5, and is important for their functions
          (Mojzita and Hohmann , Nosaka et al. ). With a nonfermentable carbon source, Pdc6 is
          activated under sulfur limitation. When glucose is the carbon source, PDC6 cannot be
          transcribed (Boer et al. ).
        what_it_establishes: >-
          both of the isozyme facts earlier project notes carry — PDC5 derepression on loss of
          Pdc1, and PDC6 silence on glucose — in one passage
      - quote: >-
          It is suspected that the deficiency of intracellular C2 compounds and cofactor imbalance
          are the possible causes of growth defect. First, PDC deletion causes a deficiency of
          intracellular C2 compounds, such as ethanol and acetic acid, resulting in a lack of
          acetyl-CoA in the cytoplasm. Thus, the synthesis of lysine and fatty acids is affected,
          which is essential for cell growth (Flikweert et al. , Pham et al. ). Second,
          Crabtree-negative strains grow very slowly on fermentable carbon sources because of the
          redox imbalance. NADH produced by glycolysis is generally oxidized by Adh to generate
          ethanol. The deletion of PDC blocks this reaction, meanwhile glucose inhibits respiration
          and NADH cannot be fully oxidized through the respiratory chain, thereby cause cofactor
          imbalance (Pronk et al. ).
        what_it_establishes: "the two independent causes of the defect, separated"
      - quote: >-
          For example, the mutations of Mth1 including Mth1∆57–131 (Oud et al. ), Mth1A81D (Zhang et
          al. ), and Mth1A81P (Kim et al. ) were found to restore the cell growth. Mth1 mutations are
          primarily associated with glucose uptake. Pyruvate kinase mutations Pyk1R68*, Pyk1K196*,
          Pyk1R91I (Yu et al. ), pyrophosphatase Oca5S383* (Qin et al. ), and RNA polymerase II
          mediator complex Med2*432Y (Dai et al. ) were also identified which have a beneficial
          effect on balancing glycolysis and respiratory metabolism.
        what_it_establishes: >-
          the evolved-suppressor catalogue — the answer to "what does it take to make such a strain
          viable"
      - quote: >-
          Although the mutations identified from the evolved strains are different, they generally
          play a role in limiting glucose uptake, decreasing glycolytic flux, and elevating
          respiratory metabolism (Fig. ). These mutations balance the flux of glycolysis, TCA cycle,
          and oxidative phosphorylation, thereby contributing to NAD+/NADH homeostasis and growth
          recovery.
        what_it_establishes: >-
          the unifying mechanism of every known suppressor — they all slow the cell down. This is
          the sentence that makes the counterfactual argument for the owner: the price of removing
          the pyruvate sink is throttled glycolysis.
      - quote: >-
          PDC-negative strains slow down glucose utilization, and the rate of product production
          decreases.
        what_it_establishes: "the process consequence, stated plainly"

# ═══════════════════════════════════════════════════════ THE PARAGRAPH A CURATOR CAN REUSE

counterfactual_framing: >-
  Criterion E1 records the road DUET did not take. Most of the isobutanol literature reaches for
  pyruvate by deleting pyruvate decarboxylase, and the records admitted under E1 exist so that the
  atlas can read that literature and price what it costs — not so that they can describe the DUET
  chassis, which they may never be used to do. DUET is deliberately Pdc-POSITIVE (DUET_TARGET §5.1;
  PLAN.md B.3.1 as amended 2026-09-20), because in DUET's architecture ethanol is the mechanism
  rather than the competitor: ethanol diffuses into the matrix, Adh3 oxidises it there, and the
  resulting matrix NADH feeds both the final Ehrlich reduction and, through Pos5, the matrix NADPH
  that Ilv5 requires. Deleting PDC would remove that carrier, not merely a by-product. The measured
  cost of removing it, as recorded in this slot, is fourfold. First, C2 auxotrophy: with no
  cytosolic acetyl-CoA route from pyruvate, a pdc1Δ pdc5Δ pdc6Δ strain cannot grow on glucose as
  sole carbon source and must be fed ethanol or acetate. Second, glucose sensitivity: the strain
  cannot grow at high glucose at all until a suppressor throttles hexose uptake. Third, redox: the
  principal NADH sink is gone, glucose still represses respiration, and the cell compensates
  through the glycerol branch — which is itself carbon lost, and which GPD1 deletion alone does not
  abolish because GPD2 remains. Fourth, and most directly relevant here, Pdc1 and Pdc5 also
  catalyse the KIV → isobutyraldehyde step of the Ehrlich pathway, so deleting them does not merely
  redirect flux toward isobutanol, it removes the decarboxylase that makes isobutanol. The known
  workarounds — the MTH1-ΔT internal deletion and its point-mutant relatives, and the PYK1, OCA5
  and MED2 alleles found by adaptive evolution — all work the same way: they slow glycolysis down.
  That is the trade. A Pdc-minus chassis buys the absence of ethanol by becoming a slower, C2-fed,
  redox-constrained cell, and by 2019 it was still not producing isobutanol at all in an academic
  strain. Every record in this slot characterises that alternative. None of them characterises DUET,
  and an assertion about DUET derived from any of them is a cross-chassis inference capped under
  J.3.

# ═══════════════════════════════════════════════════════ PDC1/PDC5 ALSO DECARBOXYLATE KIV

pdc_dual_role:
  bearing_on_duet: >-
    This is the finding in the slot that touches DUET most directly, and it cuts in DUET's favour.
    If Pdc1 and Pdc5 carry a substantial share of the KIV → isobutyraldehyde flux, then a
    Pdc-positive chassis is not merely tolerating a competing sink, it is retaining a
    KIV-decarboxylating enzyme that the Ehrlich pathway uses. The corpus supports the claim from
    two independent directions — a phenotype and an enzyme assay — but note that both come from the
    same laboratory lineage (Boles, Frankfurt), so this is not two fully independent groups.

  the_phenotype:
    publication: "doi:10.1186/s13068-019-1486-8"
    genotype: "pdc1Δ pdc5Δ (PDC6 intact), CEN.PK113-7D background, with MTH1ΔT or MTH1 overexpression"
    quote: >-
      Additional deletions of PDC1 and PDC5, even after restoring slow growth by overexpressing
      Mth1 (strain JWY12) or by engineering Mth1∆T (strain JWY13), had negative effects and stopped
      isobutanol biosynthesis completely (Fig. b, c). Even after 168 h, isobutanol was not
      detectable (data not shown). This confirmed the results of Choo et al. [], Brat et al. [] and
      Milne et al. [], indicating that Pdc1 and Pdc5 significantly contribute also in the conversion
      of KIV to isobutyraldehyde within the Ehrlich pathway.
    caveat: >-
      The strain also consumed almost no glucose (6.79 g/L of 40 g/L in 168 h), so "no isobutanol"
      is confounded with "almost no flux through anything". The authors do not separate the two.

  the_enzyme_assay:
    publication: "doi:10.1186/1754-6834-5-65"
    pmid: "22954227"
    pool_status: "in the E1 pool"
    genotype: >-
      Isoy21 — MATa leu2-3,112 ura3-52 trp1-289 his3-Δ1 MAL2-8c SUC2 Δpdc1::loxP Δpdc5::loxP
      Δpdc6::loxP, carrying unknown beneficial mutations for growth on glucose as sole carbon
      source. A FULL TRIPLE, with an unidentified suppressor.
    quote: >-
      Pdc1,5,6 triple mutants expressed only a very low KDC activity (8.66 ± 0.41 mU mg protein-1)
      whereas the wild-type strain exhibited the highest activity (38.73 ± 6.24 mU mg protein-1).
    second_quote: >-
      Overexpression of ARO10 in strain Isoy21 could nearly fully substitute the KDC activity of Pdc
      enzymes (32.83 ± 8.72 mU mg protein-1) (Figure ) whereas kivD overexpression resulted in only
      partial complementation (19.61 ± 2.52 mU mg protein-1) (Figure ). As ARO10 overexpression
      could not restore ethanolic fermentation of Isoy21 and did not show any decarboxylation
      activity on pyruvate (data not shown), Aro10 was a promising candidate enzyme for increasing
      the decarboxylation of KIV for increased isobutanol production.
    what_the_numbers_say: >-
      Roughly 78% of cellular 2-ketoisovalerate decarboxylase activity is lost when all three PDC
      genes are removed, measured in crude extract with 2 mM KIV. That is a direct measurement of
      the dual role rather than an inference from a titre. It also shows the loss is recoverable:
      ARO10 overexpression restores KDC activity to near wild-type WITHOUT restoring pyruvate
      decarboxylation, which is the one clean piece of evidence in this slot that the two Pdc
      activities can in principle be separated.
    caveat: >-
      Crude-extract activity, not in vivo flux, and Isoy21 carries unidentified suppressor
      mutations. The residual 8.66 mU/mg in the triple mutant is presumably native Aro10 and Thi3.

  what_the_pool_does_not_settle:
    - >-
      No paper in the pool measures the KIV decarboxylase contribution of Pdc1 and Pdc5
      SEPARATELY. The assay is on the triple; the phenotype is on the double. The relative
      contribution of each isozyme is unresolved here.
    - >-
      No paper measures isobutanol in a strain where PDC is retained and the ethanol–acetaldehyde
      shuttle is deliberately strengthened, which is DUET's actual design. The dual-role evidence
      supports keeping Pdc; it does not demonstrate DUET.
    - >-
      One candidate-adjacent paper reports the OPPOSITE expectation and fails to reproduce it —
      doi:10.1186/s13068-019-1486-8 notes that single PDC1 or PDC5 deletion is described in the
      literature as improving isobutanol significantly, but in its own hands both single deletions
      slightly REDUCED isobutanol (0.54 and 0.48 g/L against 0.56 g/L). That disagreement is on the
      record and should not be smoothed over.

# ═══════════════════════════════════════════════════════════════ IS 25 FILLABLE?

pool_assessment:
  budget: 25
  readable_candidates: 16
  shortfall: 9
  fillable: false

  verdict: >-
    NOT fillable from what is readable, and the gap is an ACQUISITION GAP, not scarcity in the
    literature. 52 further E1-tagged publications sit in the manual download queue and cannot be
    opened in this session. The shortfall is therefore a statement about this workstation, not
    about the field.

  but_the_admissible_fraction_is_genuinely_small: >-
    The more useful finding is inside the 16. Of the pool, only about six papers carry a
    S. cerevisiae PDC deletion genotype that is both explicit and load-bearing for their result —
    doi:10.1186/1475-2859-11-131, doi:10.1186/s12934-015-0305-6, doi:10.1186/1754-6834-5-65,
    doi:10.1186/s12934-021-01594-3, doi:10.1002/elsc.201900080 and doi:10.3390/foods15071163. The
    remainder are in the pool for weaker reasons: three are about Pdc2 as a thiamine-pathway
    transcription factor in Candida glabrata / Nakaseomyces glabratus rather than about removing
    the pyruvate sink (doi:10.1093/g3journal/jkae132, doi:10.1371/journal.pone.0286744); one is a
    tombusvirus replication study that uses pdc1 pdc5 genetics as a tool
    (doi:10.1371/journal.ppat.1008092); one is a PFK1 co-culture study that only measures PDC
    transcript levels (doi:10.1007/s00253-024-13091-9); three are PDC knockouts in other yeasts —
    Pichia pastoris, Candida sonorensis, Issatchenkia orientalis
    (doi:10.3390/bioengineering5010017, doi:10.1186/1475-2859-12-53, doi:10.1002/bit.28877) — whose
    transfer to S. cerevisiae is not established; one is a wine-strain PDC1 deletion aimed at
    acetate rather than at the Pdc-minus phenotype (doi:10.1186/s12934-016-0555-y); and one is an
    isopentanol screen in which PDC barely appears (doi:10.1016/j.synbio.2024.12.010). So the
    honest reading is: the acquisition gap is real, and even the acquired fraction is thinner than
    16 suggests.

  the_structural_hole: >-
    THE FOUNDING MEASUREMENTS ARE NOT HERE. Nothing readable in this pool is a primary
    characterisation of the pdc1Δ pdc5Δ pdc6Δ phenotype itself. Flikweert et al. (the C2 auxotrophy
    and cytosolic acetyl-CoA argument) and van Maris et al. (the TAM evolution, C2 independence,
    glucose tolerance and pyruvate hyperproduction) are cited by almost every candidate above and
    are readable in none of them. That is why candidate 3 is a review: it is the only readable
    route to that material. If the owner can acquire those two papers, the slot's composition
    should be revisited before it is closed.

  unspent_share: >-
    Reported, not reallocated, per ETHANOL_REFERENCE_SLOTS.md. Nine of the 25 cannot be spent from
    what is held. The recommendation is to leave the share unspent and re-run the slot after the
    download queue clears, rather than to pad it with the Pdc2/thiamine and non-cerevisiae papers
    listed above, which would satisfy the count without answering the question.

  runners_up_the_owner_may_prefer_to_swap_in:
    - doi: "10.1186/s12934-015-0305-6"
      pmid: "26253003"
      pool_status: "in the E1 pool"
      genotype: "pdc1Δ pdc5Δ pdc6Δ (PDC-E1), CEN.PK 113-5D × CEN.PK 110-10C background"
      one_line: >-
        Three independent adaptive evolution lines with Illumina whole-genome sequencing,
        converging on MTH1, HXT2, CIT1 and RPD3; MTH1(A81D) reverse engineered to 0.053 h-1 and
        CIT1 deletion pushing it to 0.069 h-1, with an Ach1-based mechanism for cytosolic
        acetyl-CoA. Richer data than candidate 2 and a better answer to "how does the cell evolve
        around it", but the reverse-engineered growth is worse and no sequence accession is given.
      swap_it_in_if: >-
        the owner wants EVOLVED suppressors and genome sequencing rather than the specific MTH1-ΔT
        allele that the incumbent isobutanol chassis actually uses.
    - doi: "10.1186/s12934-021-01594-3"
      pmid: "34098954"
      pool_status: "in the E1 pool"
      genotype: >-
        diploid xylose-utilizing S. cerevisiae; both copies of PDC1, PDC5 and PDC6 replaced, plus a
        different MTH1 internal deletion (MTH1ΔM41-T78)
      one_line: >-
        The only pool candidate with a deposited accession (NCBI BioProject PRJNA699459, whole-genome
        sequencing of five independent pdc-negative transformants) and the only one that shows the
        MTH1 workaround failing in an industrially shaped, diploid background — it states that the
        internal deletion "only partially overcame the C2 requirement and ethanol addition was still
        necessary for efficient sugar consumption", and reports ploidy changes across the
        transformants.
      swap_it_in_if: >-
        the owner wants deposited data and an industrial-strain reality check on the workaround,
        and can accept that the Pdc content is incidental to a muconic acid paper.
    - doi: "10.1016/j.meteno.2016.01.002"
      pmid: "29142820"
      pool_status: "NOT in any ethanol criterion pool — see mis_tagged_candidates"
      genotype: >-
        IME307 — pdc1Δ pdc5Δ pdc6Δ MTH1ΔT ilv2Δ, CEN.PK, carrying a bacterial cofactor-balanced
        isobutanol pathway; IMZ500 (pdc1Δ pdc5Δ pdc6Δ MTH1ΔT) as the Pdc- reference
      one_line: >-
        The most complete mass balance of a Pdc-minus isobutanol chassis in the corpus: the strain
        would not grow anaerobically even after weeks of attempted selection, ~45% of carbon went
        to glycerol to hold the redox balance, 2,3-butanediol reached 0.649 ± 0.067 mol/mol glucose
        against isobutanol at 0.018 ± 0.003, and the DHAD iron–sulfur cluster is identified as the
        bottleneck.
      swap_it_in_if: >-
        the owner wants the counterfactual chassis costed end to end rather than the Pdc genetics
        per se. It overlaps candidate 1 thematically, which is why it is listed here rather than
        shortlisted.

  a_result_that_should_be_treated_with_caution:
    doi: "10.3390/foods15071163"
    pmid: "41976457"
    pool_status: "in the E1 pool"
    genotype: "S. cerevisiae GlmDP/pdc1Δpdc5Δpdc6Δ, CRISPR-Cas9, sequential knockouts"
    the_problem: >-
      This 2026 paper reports a claimed pdc1 pdc5 pdc6 TRIPLE deletant that still produces
      6.05 ± 0.13 g/L ethanol (a 26% reduction from 8.20 ± 0.21 g/L) and grows normally on YPD. Its
      own abstract says the improvement came "without significantly affecting cell growth or glucose
      consumption". That is irreconcilable with every other Pdc-null description in this pool and
      in the wider literature, where the triple abolishes ethanol, imposes C2 auxotrophy and cannot
      grow on glucose at all. Either the deletions are incomplete, or the strain carries a
      compensating activity, or the phenotype was not confirmed. The paper does not address the
      discrepancy. It should not be admitted as evidence about the pdc-minus phenotype, and if it
      is recorded at all it should be recorded as a contradiction.

