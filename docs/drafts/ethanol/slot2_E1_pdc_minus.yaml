  - rank_in_shortlist: 2
    role_in_the_trio: "engineering around the defect — the workaround priced"
    pmid: "22978798"
    doi: "10.1186/1475-2859-11-131"
    title: >-
      An internal deletion in MTH1 enables growth on glucose of pyruvate-decarboxylase negative,
