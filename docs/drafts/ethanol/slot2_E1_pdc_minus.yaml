  - rank_in_shortlist: 3
    role_in_the_trio: >-
      characterising the defect and cataloguing every known workaround — but as a review, not a
      primary measurement
    pmid: "40121184"
    doi: "10.1093/femsyr/foaf014"
    title: >-
      The advances in creating Crabtree-negative Saccharomyces cerevisiae and the application for
      chemicals biosynthesis
    year: 2025
    journal: "FEMS Yeast Research"
    pool_status: "in the E1 pool"
    publication_type: "REVIEW — this is the single most important thing to know about it"

    pdc_genes_deleted:
      genotype: >-
        none of its own — it is a review. It surveys, and names genotypes for, pdc1Δ singles,
