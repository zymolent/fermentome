    what_data_it_actually_contains: >-
      Figures only for the primary time courses — no supplementary data tables and no deposited
      raw data. What it does contain, in text, are the paired titres that matter: ethanol titre for
      wild type, for each single pdc deletion and for the double; glucose consumption at 24 h and
      168 h for the Pdc-deficient strains; isobutanol titre with and without ethanol supplementation
      for Pdc-deficient and Pdc-proficient strains; and glycerol titres across the adh1Δ gpd1Δ gpd2Δ
      series. No transcriptomics, no proteomics, no enzyme assays, no chemostats.
    accessions: "none — no sequence, expression or raw-data accession is reported"
    open_access: >-
      BMC / Biotechnology for Biofuels — fully open access, CC-BY. Full text held in the project
