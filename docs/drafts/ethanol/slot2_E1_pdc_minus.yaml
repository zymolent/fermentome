  - rank_in_shortlist: 1
    role_in_the_trio: "speaks to the Pdc dual role, and prices the whole cost ledger in an isobutanol strain"
    pmid: "31303893"
    doi: "10.1186/s13068-019-1486-8"
    title: >-
      Improving isobutanol production with the yeast Saccharomyces cerevisiae by successively
      blocking competing metabolic pathways as well as ethanol and glycerol formation
    year: 2019
    journal: "Biotechnology for Biofuels"
    pool_status: >-
      NOT IN THE E1 POOL. Discovery tagged it E3 and E5. See mis_tagged_candidates.

    pdc_genes_deleted:
      primary_pdc_strain: "JWY13 — pdc1Δ pdc5Δ, plus an engineered internal deletion in MTH1 (MTH1ΔT, +169/+393)"
      comparison_strain: "JWY12 — pdc1Δ::MTH1 (PDC1 coding region replaced by MTH1, i.e. MTH1 under the PDC1 promoter) pdc5Δ"
      single_deletion_controls: "JWY14 — pdc1Δ; JWY15 — pdc5Δ"
      pdc6: >-
        NOT deleted. The authors state PDC6 is normally not expressed and that deleting PDC1 with
