    year: 2012
    journal: "Microbial Cell Factories"
    pool_status: "in the E1 pool"

    pdc_genes_deleted:
      genotype: "pdc1Δ(-6,-2)::loxP pdc5Δ(-6,-2)::loxP pdc6Δ(-6,-2)::loxP — full triple"
