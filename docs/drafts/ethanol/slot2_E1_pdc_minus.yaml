    why_this_slot: >-
      It is the only paper located in this corpus that measures, in one strain series, every
      consequence B.3.1 says E1 exists to record: ethanol abolished, glucose consumption crippled,
      the C2 auxotrophy explicitly tested and then EXCLUDED as the limiting factor, the glycerol
      branch taking over NAD+ regeneration, and the MTH1 workaround applied in two forms and shown
