# written; the database was opened read-only. Project rule L.5/D2: agents draft only.
#
# Source (READ-ONLY, never written to): D:/Agentic/bifserver-works/literatures/pdf_included
# Manifest rows: 127   PDFs on disk: 127
# NOTE ON COUNT: the task brief says 128 PDFs. The directory holds 127 PDFs and the
# manifest holds 127 data rows (128 lines including the header). There is no 128th paper.
#
# `basis` is how each call was made:
#   title                    - manifest title/journal/year only
#   title+fulltext_term_scan - title plus a scripted term scan of the stored PDF text
#                              (counts of 'xylose', 'isobutanol', ADH3/POS5/shuttle/matrix
#                              NAD(P)H, PPP gene names). No prose was read.
#   abstract_read            - the PDF was opened and its abstract read. 15 papers.
#
# `admission` is this agent's own call against PLAN.md B.1-B.3.6, NOT the database's existing
# tag. `db_admitted_criterion` records what the database currently says, so disagreements stay
# visible; the shortlist report of 2026-09-21 section 2 already found the tagging misroutes
# papers, and this corpus reproduces that finding.

