    - "Both key enzymes, ketoisovalerate decarboxylase and ketoisovalerate ferredoxin oxidoreductase, belong to the group of pyruvate decarboxylases/pyruvate oxidoreductases and are dependent on thiamine pyrophosphate (; ). The active forms are homo- or heterotetramers, respectively."
