# Marked-claim verification for docs/design/MITOCHONDRIAL_PROGRAM.md and docs/design/DUET_TARGET.md.
#
# MITOCHONDRIAL_PROGRAM.md's own header carries the instruction this file executes: "This document
# has a higher [warning] density than the rest of the plan and a lower tolerance for being wrong,
# because it will inform construct design." Twenty-two lines are marked in that file and three in
# DUET_TARGET.md. One record below per marked line.
#
# WHAT A MARK MEANS: the claim was written from an AI's background knowledge, not from a source
# anyone read. This file says, for each one, what 1,309 stored full texts do and do not support.
#
# METHOD. Every quote in `evidence` was sliced out of the cached source text by regex-anchored
# offset, never retyped, and each slice was checked to occur exactly once in its document before
# being written here. Quotes are double-quoted YAML scalars rather than folded ones because several
# come from PDF text layers where the line wraps and the soft hyphens are part of the string and
# folding would silently destroy them. No quote splices two passages; where two passages are needed
# there are two strings. Each evidence entry is preceded by a comment naming its DOI and its cached
# file, so any quote can be re-resolved.
#
# NO `confidence` FIELD IS WRITTEN ANYWHERE IN THIS FILE, and nothing here is marked verified.
# CONVENTIONS.md reserves that for a human curator; this is a draft under docs/drafts/. Nothing
# under data/ and neither design document was touched.
#
# VERDICTS USED
#   confirmed            the corpus supports the claim as stated
#   incomplete           true as far as it goes; something load-bearing is missing
#   overstated           directionally right, quantitatively or categorically too strong
#   wrong                the corpus contradicts it
#   not_in_corpus        the corpus cannot answer, or the line is not a factual claim
#   already_checked_today  a phase-1b curation file already settled it; `covered_by` names which
#
# TALLY
#   already_checked_today  9   (lines 53, 59, 61, 73, 105, 112, 128, 147, 158 of MITOCHONDRIAL_PROGRAM,
#                               across 5 curated files; not re-derived here)
#   confirmed              7   (6 in MITOCHONDRIAL_PROGRAM, 1 in DUET_TARGET)
#   overstated             3
#   incomplete             2
#   wrong                  1
#   not_in_corpus          3   (all three are legend/header lines carrying no claim)
#
# THE THREE THINGS A READER SHOULD TAKE FROM THIS FILE
#
#   1. THE COPY NUMBER IS THE MARK THAT MATTERS MOST, AND IT IS OVERSTATED. "50-200 copies per cell"
#      is the top of a review range that no primary measurement in this corpus reaches. Every direct
#      measurement here lies between 14 and 32 per cell, and the one population-scale survey reports
#      a MEDIAN OF 18 mitochondrial genomes per haploid nuclear genome. The same survey supplies the
#      rescue the document never makes: copy number scales close to linearly with ploidy, so DUET's
#      industrial polyploid carries proportionally more. Defensible number: ~18 per haploid genome,
#      measured range 14-32, tail above 80, ~60-80 in a tetraploid.
#
#   2. DUET's POS5 SINGLE-POINT-OF-FAILURE ARGUMENT DOES NOT HOLD. The corpus names a second route
#      from matrix NADH to matrix NADPH -- the PYC2/MDH2/MAE1 transhydrogenase-like shunt, run "in
#      its native mitochondrial location" -- and a third option that removes the NADPH requirement,
#      an NADH-preferring KARI. The architecture is more robust than claimed; the priority ordering
#      it drives is wrong.
#
#   3. THE ENZYME PROPERTIES THE WHOLE STRATEGY-E RISK RESTS ON ARE BOTH CORRECT. The KDC is
#      TPP-dependent and tetrameric (crystal structure plus gel filtration); ADHs are commonly
#      zinc-dependent and oligomeric (yeast Adh1 among the "tetrameric ADHs"). So the never_attempted
#      gap is correctly placed -- and it is specifically the KDC, because a non-zinc ADH orthologue
#      is an available hedge and there is no equivalent hedge for thiamine.

