- document: MITOCHONDRIAL_PROGRAM
  line: 19
  claim: >-
    The valine branch (Ilv2/Ilv6 -> Ilv5 -> Ilv3) already runs in the mitochondrial matrix, so
    2-ketoisovalerate is produced there; finishing the route in the matrix avoids the
    unidentified 2-KIV export step entirely.
  verdict: incomplete
  publication: "doi:10.1038/s41598-019-40631-5"
  corpus_file: "00223.txt"
  evidence:
    # doi:10.1038/s41598-019-40631-5  [00223.txt]
    - "In S. cerevisiae, cytosolic pyruvate is imported into the mitochondria via mitochondrial pyruvate carrier (MPC) complex, and then pyruvate is converted to 2-KIV by sequential catalytic reactions of Ilv2 (ALS), Ilv5 (KARI), and Ilv3 (DHAD) in the mitochondrial matrix. The mitochondrial 2-KIV is then exported to the cytosol, and finally converted to isobutanol through Ehrlich pathway, involving endogenous KDCs and ADHs."
    # doi:10.1016/j.synbio.2022.02.007  [00141.txt]
    - "The first half of the pathway converts pyruvate to α-ketoisovalerate (KIV) by mitochondria-localized ILV enzymes: acetolactate synthase (ALS, encoded by ILV2), a NADPH-dependent ketol-acid reductoisomerase (KARI, encoded by ILV5), and a 2Fe–2S cluster-requiring dihydroxyacid dehydratase (DHAD, encoded by ILV3). The second part of the pathway, the Ehrlich pathway, converts KIV to isobutanol by promiscuous cytosolic enzymes: α-ketoacid decarboxylase (KDC, encoded by pyruvate decarboxylases, PDC1 PDC5 or PDC6, or phenylpyruvate decarboxylase, ARO10) and a NADH-dependent alcohol dehydrogenase (ADH, encoded by ADH1-5)"
  notes: >-
    The compartment claim is right and well attested. What the sentence leaves out is the OTHER
    membrane crossing. The corpus states the native route as two crossings, not one: pyruvate
    IN through the mitochondrial pyruvate carrier, 2-KIV OUT by an unnamed route. Strategy E
    removes the export leg only; the MPC import leg stays, and it is a carrier whose capacity
    has itself been an engineering target (MPC1/MPC2/MPC3 are overexpressed to raise isobutanol
    in doi:10.1093/femsyr/foae006).
  what_to_change: >-
    Keep the claim, add the second crossing: 'The valine branch already runs in the matrix, so
    2-KIV is produced there - reached by pyruvate imported through the MPC. Finishing the route
    in the matrix removes the unidentified 2-KIV export step, but not the MPC import step,
    which becomes the remaining membrane-transport ceiling for strategy E.'
  consequence_if_wrong: >-
    Moderate. If the route is sold as 'no membrane crossings' the ranker will under-cost
    strategy E and the lab may attribute a flux ceiling to enzyme folding when it is pyruvate
    import. MPC capacity should be a measured covariate in any strategy-C or -E experiment, not
    an assumption.
  searches_run: ["(2-ketoisovalerate|alpha-ketoisovalerate|KIV).{0,120}(mitochondri|matrix|export|transport)"]

- document: MITOCHONDRIAL_PROGRAM
  line: 28
  claim: >-
    mtDNA is present at roughly 50-200 copies per cell in nucleoids, which is a gene dosage a
    single nuclear integration cannot match.
  verdict: overstated
  publication: "doi:10.1186/s12915-020-00786-4"
  corpus_file: "00651.txt"
  evidence:
    # doi:10.1186/s12915-020-00786-4  [00651.txt]
    - "The number of mitochondrial genomes is generally constant across clades (Additional file : Figure S11), with no significant differences between domesticated and wild lineages, with a median of 18 mitochondrial genomes for each haploid nuclear genome. The variation is however particularly high across the population, reaching over 80 copies. As previously reported [], the mtDNA copy number scales up with ploidy in a linear way, with diploid strains having around double number of mitochondrial genomes and triploid having three times the number, compared to haploid cells"
    # doi:10.1093/nar/gkad849  [00391.txt]
    - "This analysis revealed a consistent ∼1.6-fold increase of mtDNA CN in Δcim1 cells compared to WT cells when grown on YPD containing a fermentable carbon source (29 versus 18 mtDNA copies per cell in Δcim1 and WT, respectively) (Figure"
    # doi:10.3390/biom13030501  [01097.txt]
    - "On average, the MALs that maintained the mtDNA had 14 mitochondrial genomes per haploid nuclear genome."
    # doi:10.1038/s44318-024-00183-5  [00256.txt]
    - "The length of this array represents the previously determined average of 32 mtDNA copies per diploid cell"
    # doi:10.3390/jof9030329  [01191.txt]
    - "Usually, S. cerevisiae has between 40 and 60 nucleoids, each containing 1 or 2 copies of mtDNA"
    # doi:10.1007/s00439-015-1578-x  [00047.txt]
    - "This could be explained by the lower copy number of mtDNA molecules per cell in yeast (about 20–30 copies per cell, 50–100 fold less than in typical vertebrate cells)"
    # doi:10.1534/g3.112.003152  [00928.txt]
    - "In S. cerevisiae, the mtDNA genome is present normally at 20−100 copies per cell comprising 10–20% of the total cellular DNA"
    # doi:10.1534/genetics.114.166637  [00939.txt]
    - "Its copy number per cell ranges from 50 to 200 () and contrary to the mammalian mtDNA it is biparentally inherited after mating, allowing for recombination, although this heteroplasmic state is transient for only ∼20 generations."
  notes: >-
    Two claims in one sentence. The NUCLEOID packaging is confirmed (40-60 nucleoids of 1-2
    copies each in doi:10.3390/jof9030329, and the Abf2/Cim1 literature throughout). The NUMBER
    is the problem. The corpus splits cleanly: every direct measurement sits between 14 and 32
    per cell (qPCR of WT on YPD: 18; mutation-accumulation lines: 14; a modelling paper's cited
    average: 32 per DIPLOID; the population survey: median 18 per haploid nuclear genome,
    'reaching over 80 copies' at the tail), while every 50-200-style figure is a review
    sentence citing something else. The population survey also supplies the correction DUET
    actually needs: copy number scales close to linearly with ploidy, so an industrial
    polyploid carries proportionally more - which is the one argument that partially rescues
    the dosage case, and the document does not make it.
  what_to_change: >-
    Replace '50-200 copies per cell' with a measured range and its conditions. Defensible
    wording: 'mtDNA is present in nucleoids at roughly 15-40 copies per haploid genome in
    laboratory strains on glucose (population median 18, individual strains exceeding 80), and
    copy number scales close to linearly with ploidy - so an industrial tetraploid would carry
    on the order of 60-80 copies.' Report the direct qPCR and sequencing measurements (18, 14,
    22, 32-per-diploid) and the review ranges (20-30, 20-100, 50-200) separately; 50-200 is the
    top of a secondary range and no primary measurement in this corpus reaches it.
  consequence_if_wrong: >-
    HIGH - this is the number strategy E is partly sold on. At 50-200 the dosage argument
    carries the case on its own; at a median of 18 per haploid genome it does not, and the
    honest comparison against a nuclear route becomes '~18-80 mtDNA copies vs 1-n nuclear
    integrations', a range a multi-copy nuclear integration or a 2-micron vector can meet. A
    route ranker fed 50-200 will rank E above C on dosage alone. Two second-order points the
    document should carry with the number: copy number is not expression (nothing here measures
    protein per mtDNA copy), and the same papers that measure it also show it moving 1.6-3 fold
    with single nuclear mutations and with carbon source, so it is a regulated variable, not a
    constant of the chassis.
  searches_run: ["(copies|copy number|genomes) (of mtDNA |of mitochondrial DNA )?per (haploid )?(cell|diploid|nuclear genome)", "mitochondrial genomes per haploid|median of \\d+ mitochondrial|mtDNA copy number.{0,80}median", "per diploid cell|copies per diploid|nucleoids?,? (each )?(containing|with|harbou?r)"]

- document: MITOCHONDRIAL_PROGRAM
  line: 36
  claim: >-
    Strategy C has published precedent for this exact pathway, while strategy E has none.
  verdict: confirmed
  publication: "doi:10.1038/nbt.2509"
  corpus_file: "00190.txt"
  evidence:
    # doi:10.1038/nbt.2509  [00190.txt]
    - "Compartmentalization of the \nEhrlich pathway into mitochondria increased isobutanol production by 260%, whereas overexpression of the same pathway in \nthe cytoplasm only improved yields by 10%, compared with a strain overproducing enzymes involved in only the first three steps \nof the biosynthetic pathway."
    # doi:10.1038/nbt.2509  [00190.txt]
    - "We \ndetected all enzymes fused to the CoxIV mitochondrial localization \nsignal in the mitochondrial fractions, whereas we detected enzymes \nlacking the CoxIV signal only in cytoplasmic fractions ( Fig. 5)."
    # doi:10.1016/j.synbio.2022.02.007  [00141.txt]
    - "However, the role that localization plays in isobutanol production is obscured by conflicting reports in the literature as both pathway localizations have achieved similar isobutanol titers and yields"
    # doi:10.1016/j.synbio.2022.02.007  [00141.txt]
    - "On the other hand, it has been proposed that cytosolic localization would be preferable in the context of industrially relevant conditions such as high glucose concentrations or anaerobic growth. This is in part because the mitochondria are known to enter a minimal energy-requirement mode under those conditions"
  notes: >-
    Precedent: confirmed and specific - Avalos 2013 built exactly strategy C (Ehrlich pathway
    targeted to the matrix with the CoxIV presequence) for exactly isobutanol, with subcellular
    fractionation to verify the targeting. What the mark should NOT be dropped without carrying
    is that the BENEFIT is contested in this same corpus: a 2022 functional-genomics paper says
    the role of localization is 'obscured by conflicting reports' with both localizations
    reaching similar titers, and that cytosolic localization has been argued preferable under
    exactly DUET's conditions - high glucose and anaerobic growth.
  what_to_change: >-
    Drop the mark on 'published precedent' (it is real). Add one sentence: 'The precedent
    exists; the benefit does not replicate uniformly - cytosolic and mitochondrial
    localizations have reached similar titers in several studies, and cytosolic localization
    has been argued preferable at high glucose and under anaerobiosis, which are DUET's
    conditions.'
  consequence_if_wrong: >-
    HIGH for programme sequencing, and it cuts toward the document's own recommendation.
    MITOCHONDRIAL_PROGRAM section 5 question 1 is 'is matrix co-localization beneficial at
    all?' - this corpus answers 'sometimes, and disputed under industrial conditions'. If C's
    advantage does not hold anaerobically at high glucose, then E inherits that doubt before
    its own risks are counted, and DUET's architectural claim 3 ('mitochondrial, not
    cytosolic') needs its own evidence row rather than a citation to Avalos.
  searches_run: ["(localization|localized|targeted).{0,200}(mitochondri).{0,200}(confirm|verif|microscop|fluorescen|fraction)"]

