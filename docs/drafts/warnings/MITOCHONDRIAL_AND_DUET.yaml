- document: MITOCHONDRIAL_PROGRAM
  line: 92
  claim: >-
    Translation table 3: UGA = Trp, AUA = Met, CUN = Thr not Leu, CGA/CGC absent.
  verdict: incomplete
  publication: "doi:10.3390/ijms22094524"
  corpus_file: "01149.txt"
  evidence:
    # doi:10.3389/fmicb.2023.1268944  [01060.txt]
    - "Yeast mitochondrial translation tables fall into either the Mold, Protozoan, and Coelenterate Mitochondrial Code and the Mycoplasma/Spiroplasma Code (NCBI table 4, hereafter referred to as the fungal code), which is consistent with other fungi, or the yeast mitochondrial code (NCBI table 3, originally based on S. cerevisiae, hereafter referred to as the Saccharomyces code) based on additional reassignments of AUA and CUN codons, which typically define the order Saccharomycetales."
    # doi:10.1093/gbe/evz165  [00367.txt]
    - "Protein-coding genes in the assembled mitogenomes were annotated using MFannot based on genetic code 4 (the only difference between genetic code 4 and the standard code is UGA being a tryptophan codon, not a stop codon)"
    # doi:10.7717/peerj.8362  [01307.txt]
    - "In addition, six tryptophan codons (TGG) at positions W18, W464, W659, W883, W1074 and W1126 of the 1366 aa Cas9 protein were changed to TGA, which codes for tryptophan in mitochondria but for a translational stop in the cytoplasm to avoid any Cas9 expression outside of mitochondria."
    # doi:10.3390/ijms22094524  [01149.txt]
    - "on the contrary, Msr1 charges both the mt-tRNA(UCU), which in yeast mitochondria binds AGR codons (where R indicates a purine) that in humans mitochondria are stop codons, and the mt-tRNA(ACG), which binds the canonical CGN codons. LARS2, charges both the mt-tRNA(UAG), which binds canonical CUN codons, and the mt-tRNA(UAA), which binds canonical UUR codons. On the contrary, yeast Nam2, charges only the mt-tRNA(UAA), which binds canonical UUR codons, since CUN codons encode for threonine."
    # doi:10.1093/nar/gkq1345  [00401.txt]
    - "The presence of tRNATrp with an UCA anticodon, and the absence of an S. cerevisiae homolog of the abnormal tRNAThr1 with 8-nt in the anticodon loop (decoding CUN as threonine), indicate that UGA and CUN codons are recognized as tryptophan and leucine, respectively. The codon assignment was verified by multiple alignments of protein sequences, which led us to the conclusion that UGA(Trp) is the only deviation from the standard genetic code."
    # doi:10.3390/ijms21145083  [01148.txt]
    - "The absence of the arginine CGA codon is likely due to the fact that it is never used in yeast mitochondria, whereas the two others (CAA and GCA) are used quite frequently"
  notes: >-
    Taken codon by codon against this corpus: (a) UGA = Trp - supported, in two independent
    ways. Table 3 is defined here as table 4 plus reassignments of AUA and CUN, and table 4's
    sole departure from the standard code is stated to be UGA-as-tryptophan; and it is
    demonstrated functionally in S. cerevisiae, where six TGG codons of Cas9 were changed to
    TGA specifically so the protein could only be made inside mitochondria. (b) CUN = Thr -
    supported directly and twice. 'since CUN codons encode for threonine' is said of yeast
    outright, and the comparative-genomics paper identifies the mechanism, an abnormal S.
    cerevisiae tRNAThr1 with an 8-nt anticodon loop that decodes CUN as threonine, whose
    ABSENCE in other yeasts is what makes CUN leucine there. (c) AUA = Met - NOT supported. The
    corpus attests that AUA is reassigned in table 3 but never states what it is reassigned TO.
    This one is table-3 knowledge the corpus does not independently carry. (d) CGA/CGC absent -
    half supported, and the word 'absent' is doing two jobs. CGA is stated to be 'never used in
    yeast mitochondria', which is a usage statement. CGC is not addressed anywhere. And
    absent-from-usage is not the same as untranslatable: the same corpus says yeast
    mitochondria charge an mt-tRNA(ACG) that 'binds the canonical CGN codons'.
    src/fermdb/genetic_code.py already encodes this correctly - ABSENT_IN_YEAST_MITO is a soft
    avoid-list, not an illegal set - so the code is more careful than the prose.
  what_to_change: >-
    Split the sentence by evidence class. Proposed: 'UGA = Trp (inherited from table 4, and
    used deliberately as a mitochondria-only expression device), CUN = Thr not Leu (decoded by
    a yeast-specific tRNAThr1 with an 8-nt anticodon loop), AUA reassigned relative to table 4
    (identity taken from NCBI table 3, not from a source in this corpus), and CGA unused in
    native yeast mtDNA (CGC not attested here). Note that unused is not untranslatable - a
    CGN-reading tRNA-Arg exists - so the recoder should treat CGA/CGC as codons to avoid, not
    as errors.'
  consequence_if_wrong: >-
    Moderate, and mostly documentation because the code is already right. The live risk is the
    opposite of the one the section warns about: a recoder that treats CGA/CGC as ILLEGAL
    rather than rare would reject valid synthetic ORFs and force needless redesign, and a
    vendor quote built on a hard constraint costs money. The CUN = Thr rule is the dangerous
    one and it is solid, so the leucine-rich warning stands.
