    # doi:10.1093/femsyr/foae006  [00336.txt]
    - "Therefore, redox cofactors have been balanced for isobutanol production by overexpressing pyruvate carboxylase (PYC2), malate dehydrogenase (MDH2), and malic enzyme (MAE1) in the cytosol (in a decompartmentalized pathway) or in its native mitochondrial location to produce NADPH"
    # doi:10.1093/femsyr/foae006  [00336.txt]
    - "Regeneration of NADPH in the mitochondria or cytosol in lpd1Δ background, with the mitochondrial and cytosolic BCAA biosynthetic pathway upregulated, results in a strain that produces 221 ± 27 mg/L of isobutanol, a near 5-fold increase in titers in comparison to sole upregulation of BCAA biosynthesis"
    # doi:10.1016/j.synbio.2022.02.007  [00141.txt]
    - "One strategy to resolve this imbalance is to use a heterologous NADH-dependent KARI, such as the E. coli KARI variant, ilvC6E6, that was previously engineered with improved specificity towards NADH [,]. Another strategy is to increase the supply of NADPH by introducing a transhydrogenase-like shunt (NADH + NADP+ → NAD+ + NADPH) into S. cerevisiae []. Both strategies have been successful in improving isobutanol titers, demonstrating the importance of having a redox cofactor-balanced pathway"
  notes: >-
    The parts are right and the exclusivity is not. Confirmed: Pos5 is the mitochondrial NADH
    kinase, it strongly prefers NADH over NAD+, and Ilv5/KARI is NADPH-dependent while the
    Ehrlich ADH step is NADH-dependent - so the imbalance the architecture is built to close is
    real. NOT confirmed: that Pos5 is the ONLY named route. This corpus names a second and
    reports it being run in the mitochondrion - the transhydrogenase-like PYC2/MDH2/MAE1 shunt,
    whose net effect is NADH + NADP+ -> NAD+ + NADPH, overexpressed either in the cytosol or
    'in its native mitochondrial location to produce NADPH', and combined with an upregulated
    mitochondrial BCAA pathway it gave 221 +/- 27 mg/L isobutanol, a near-5-fold increase. The
    corpus also names the alternative DUET section 7 already wants - a heterologous
    NADH-dependent KARI (E. coli ilvC6E6) - and reports that both strategies improved titers.
    So there are at least two named routes to matrix NADPH from NADH, plus one route that
    removes the requirement altogether.
  what_to_change: >-
    Replace 'POS5 is the only named route from matrix NADH to matrix NADPH' with 'POS5 is the
    direct route from matrix NADH to matrix NADPH, and the cyclic PYC2/MDH2/MAE1
    transhydrogenase-like shunt is a second, which has been run in its native mitochondrial
    location with an upregulated mitochondrial BCAA pathway.' Then soften 'single point of
    failure' to 'the primary and simplest route, with two documented alternatives - a
    mitochondrial transhydrogenase-like shunt, and an NADH-preferring KARI that removes the
    NADPH requirement.'
  consequence_if_wrong: >-
    HIGH, and it is the most consequential correction in the DUET file. As written, POS5 is
    named the atlas's highest-priority bottleneck hypothesis and a single point of failure; on
    this evidence it is neither unique nor unavoidable, and a programme that treats it as a
    single point of failure will over-invest in measuring NADH-kinase capacity while
    under-investing in the two alternatives - one of which (the mitochondrial shunt) has a
    published titer attached and is not currently in DUET's gene set at all. The knowledge_gap
    rows DUET section 7 asks to seed should therefore be THREE, not two: POS5 capacity,
    NADH-preferring KARI, and the mitochondrially-localised transhydrogenase-like shunt. The
    direction of the error is favourable - the architecture is more robust than claimed - but
    the priority ordering it drives is wrong.
