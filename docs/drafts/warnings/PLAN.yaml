# Marked-claim verification for PLAN.md -- the master blueprint.
#
# PLAN.md carries 58 warning-marked lines and, unlike ISOBUTANOL_PROGRAM.md,
# MITOCHONDRIAL_PROGRAM.md and DUET_TARGET.md, none of them had ever been audited. Its own legend
# (line 23) defines the glyph as "a number or claim taken from background knowledge rather than
# from a source read". This file says, for each one, what the 1,309 stored full texts -- and,
# where the claim is about the project rather than about biology, what the repository's own
# measured documents -- do and do not support.
#
# METHOD. Every quote in `evidence` and `repo_evidence` was sliced out of its cached source by
# regex-anchored offset and never retyped; each slice was then re-resolved at its own offsets with
# fermdb.llm.validate.verify_span before being written here. 44 corpus quotes and 5 repository
# quotes, 49 of 49 re-resolved EXACT, 0 absent, 0 spliced. No quote joins two non-adjacent
# passages; where two passages are needed there are two strings. Quotes are double-quoted YAML
# scalars, not folded ones, because several carry hard line breaks and en-dashes from PDF text
# layers that folding would destroy. Each entry is preceded by a comment naming its DOI (or repo
# path), its cached file and its character offsets, so any quote can be re-resolved independently.
# The corpus cache was rebuilt from fulltext_asset rows with the repo's own jats_to_text and
# pdf_to_text, and its numbering reproduces the numbering used by the two earlier waves.
#
# NO `confidence` FIELD IS WRITTEN ANYWHERE IN THIS FILE and nothing here is marked verified.
# PLAN.md was not edited; every correction below is a PROPOSAL. Nothing was written under data/
# (PLAN.md L.5 / decision D2). No extraction was run.
#
# VERDICTS USED
#   confirmed        the corpus (or a measured repo document) supports the claim as stated
#   incomplete       true as far as it goes; something load-bearing is missing
#   overstated       directionally right, quantitatively or categorically too strong
#   wrong            the corpus contradicts it
#   not_in_corpus    the corpus cannot answer, or the line is not a factual claim
#   already_covered  a prior wave's draft settled it; `covered_by` names which
#
# TALLY (58 marks, all 58 audited)
#   already_covered  15   (to the two warnings drafts and the benchmark drafts)
#   confirmed        14
#   incomplete       13
#   not_in_corpus     8   (1 legend line, 5 gene-list/identifier-resolution lines, 2 infrastructure)
#   overstated        7
#   wrong             1
#
# Five of the 58 marks are DUPLICATES within PLAN.md: the decarboxylase-promiscuity claim is
# marked three times (165, 733, 1508), the ADH-cofactor claim twice (724, 1506), the E. coli
# titer/yield claim twice (515, 577), the carbon-balance claim twice (214, 2894) and the
# SNP-count claim twice (1167, 2895). A fix applied once leaves the document wrong elsewhere.
#
# THE FIVE THINGS A READER SHOULD TAKE FROM THIS FILE
#
#   1. ETHANOL RED IS A DIPLOID, AND THE PLAN PICKED IT FOR BEING A POLYPLOID. Line 475 justifies
#      the industrial proxy by its "aneuploid/polyploid-typical architecture". Four papers in this
#      corpus call Ethanol Red diploid, MATa/alpha; none calls it aneuploid or polyploid. The
#      repo's own assembly record adds that GCA_029255905.1 cannot resolve aneuploidy at all. This
#      reaches DUET_TARGET 5.3 (the owner's chassis is a polyploid; the proxy does not proxy the
#      property it was chosen for) and it halves the ploidy-scaling rescue the previous audit gave
#      to MITOCHONDRIAL_PROGRAM's gene-dosage case for strategy E.
#
#   2. THE BENCHMARK SET IS TOO WEAK IN A SECOND PLACE, THE SAME WAY IT WAS IN THE FIRST. Line
#      2700 expects "impairs anaerobic growth" from a gpd1 gpd2 double deletion; the corpus says
#      it PREVENTS anaerobic growth, rescuable by acetaldehyde or acetoin. An atlas returning the
#      literature's own wording fails its own measuring stick -- exactly the inversion wave 1
#      found in BM-PATH-007. Two instances is a pattern: the set should be re-read for
#      expected_outcome STRENGTH, not only for factual support.
#
#   3. "TRANSPORT OF ALCOHOLS" IS A GENE GROUP WITH NO MEMBERS AND NO MECHANISM. Line 1191 heads
#      PDR/SNQ/AQR/QDR/FPS1 as alcohol transporters. Isobutanol crosses the plasma membrane by
#      passive diffusion; FPS1 is the glycerol channel and matters here for the glycerol branch,
#      not for alcohol efflux. This is the same category error the previous wave found in
#      ISOBUTANOL_PROGRAM's knowledge gap 2, now baked into the day-one gene list.
#
#   4. THE PLAN GIVES TWO DIFFERENT SIZES FOR ITS OWN CORE CORPUS, AND THE MEASUREMENT THAT
#      SETTLES IT IS ALREADY IN THE REPO. Line 192 says 400-800 isobutanol papers; line 1701 says
#      "low thousands". DATA_VOLUME.md measured 768 (production-scoped) and 1,027 (unrestricted)
#      on 2026-09-19. The same non-propagation left line 1313 sizing transient storage at 3-4 TB
#      for a corpus measured at ~48-51 GB.
#
#   5. S288C IS EXCLUDED FOR THE WRONG REASON, AND THE RIGHT REASON MATTERS MORE. Line 474 bars
#      S288C from physiology and robustness claims. The corpus adds that the S288C/BY4741 lineage
#      carries a HAP1-disrupting transposon and forms petites at elevated frequency -- and BY4741
#      is admitted at line 452 as the deletion-collection tool base on which the entire
#      mitochondrial programme runs. A strategy-E insert-retention experiment in that background
#      could report loss that is really background petite formation.
#
# WHAT WAS DEPRIORITISED. The brief ordered cost and compute arithmetic last. Section V's
# remaining unmarked arithmetic was not re-derived; the two marked lines that size storage and
# planning (1313, 2817) are audited above against the repo's measured figures, and both are
# superseded by docs/reference/DATA_VOLUME.md rather than by the literature.

