- line: 1191
  claim: >-
    E.4: 'Transport of alcohols and stress: the relevant PDR/SNQ/AQR/QDR/FPS1 set.'
  verdict: overstated
  publication: "doi:10.1016/j.jbc.2026.113228"
  corpus_file: "00118.txt"
  also_in:
    - "00043.txt doi:10.1007/s00253-025-13446-w"
    - "00228.txt doi:10.1038/s41598-020-67635-w"
  evidence:
    # doi:10.1016/j.jbc.2026.113228  [00118.txt @23788-23982]  re-resolved exact
    - "Because small aliphatic alcohols like isobutanol easily cross the plasma membrane via passive diffusion, their intracellular concentrations rapidly equilibrate with the extracellular environment"
    # doi:10.1007/s00253-025-13446-w  [00043.txt @4583-4677]  re-resolved exact
    - "The Fps1 glycerol channel in S. cerevisiae was a member of the major intrinsic protein family."
  notes: >-
    The heading asserts that these genes transport alcohols, and for the target alcohol the corpus says there is nothing to transport: small aliphatic alcohols like isobutanol cross the plasma membrane by PASSIVE DIFFUSION and equilibrate with the medium, and the same is said of ethanol elsewhere in the corpus. FPS1 is an aquaglyceroporin - the corpus calls it 'the Fps1 glycerol channel ... a member of the major intrinsic protein family' - and the reason it appears in ethanol papers is that deleting it raises ethanol titer by reducing GLYCEROL efflux, not by transporting ethanol. The PDR/SNQ/QDR multidrug exporters have a real but weaker basis: efflux pumps are up-regulated in isobutanol-tolerant strains, which is an association, not a demonstrated alcohol transport activity. This is the same category error the previous wave found in ISOBUTANOL_PROGRAM's knowledge gap 2, which funds a transporter screen for a carrier that does not exist.
  what_to_change: >-
    Re-title the group to what it is: 'Multidrug efflux and membrane-stress genes (PDR1 PDR3 PDR5 PDR12, SNQ2, AQR1, QDR1-3) and the glycerol channel FPS1 (glycerol efflux, not alcohol efflux).' Add an explicit note: 'Isobutanol and ethanol cross the plasma membrane by passive diffusion; no alcohol exporter is established. The unsolved transport problems in this route are the INTERMEDIATES - acetolactate, DHIV, 2-KIV - not the product.' Enumerate the PDR/SNQ/AQR/QDR members; as written the group has no members and cannot be a day-one test.
  consequence_if_wrong: >-
    HIGH, because it compounds an error already flagged elsewhere. A gene group titled 'transport of alcohols' is what a route designer queries when asking how to reduce intracellular isobutanol, and the atlas would return five gene families for a problem that has no transporter - while the real intermediate leak (2-KIV out of the matrix, the one genuinely unidentified carrier, line 738) stays uncounted. It also mis-files FPS1, whose actual value here is as a GLYCEROL-branch part relevant to lines 1485-1486.
  searches_run: ["FPS1|Fps1p", "isobutanol[^.]{0,150}(passive diffusion|diffuses|efflux pump|exporter)", "(PDR|SNQ|QDR|AQR)[^.]{0,200}(alcohol|ethanol|isobutanol|tolerance)"]

