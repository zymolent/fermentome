- line: 429
  claim: >-
    'Which transporters carry xylose and arabinose, and at what affinity, since glucose-xylose transporter competition is the usual reason a co-fermentation stalls.'
  verdict: incomplete
  publication: "doi:10.1007/s10295-019-02242-x"
  corpus_file: "00053.txt"
  also_in:
    - "00823.txt doi:10.1186/s13568-015-0102-y"
    - "00049.txt doi:10.1007/s00449-026-03399-3"
  evidence:
    # doi:10.1007/s10295-019-02242-x  [00053.txt @56911-57045]  re-resolved exact
    - "Glucose prevents xylose utilization, as it competes with xylose for transport and its use is subject to glucose catabolite repression."
    # doi:10.1186/s13568-015-0102-y  [00823.txt @5185-5362]  re-resolved exact
    - "In S. cerevisiae, this pentose is transported by facilitated transport mediated by hexose permeases which transport xylose with very low affinity compared with uptake of glucose"
  notes: >-
    Transport competition is real and repeatedly named, but the corpus never gives it alone. Every statement pairs it with GLUCOSE CATABOLITE REPRESSION as a second, independent cause, and supplies the mechanism the plan's 'at what affinity' is groping for: xylose has no dedicated transporter in S. cerevisiae and rides the hexose permeases at very low affinity relative to glucose. So the affinity question is not a parameter to look up, it is the mechanism of the competition.
  what_to_change: >-
    '...since xylose is carried by the hexose permeases at very low affinity relative to glucose, so glucose both outcompetes it for transport AND represses its metabolism - the two causes of a stalled co-fermentation are separable and must be recorded separately.' Note that PLAN.md already has a repression row in the next line of the same table; the two rows describe one phenomenon and should cross-reference.
  consequence_if_wrong: >-
    MEDIUM. If the atlas files a stalled co-fermentation under transport alone, a reader proposes a transporter swap for a problem that a MIG1/HXK2 intervention may fix, or vice versa. DUET's C6-to-C5 handover is explicitly a designed switch, so getting the two causes separated is a design requirement, not a nicety.
  searches_run: ["(xylose)[^.]{0,120}(compet[a-z]*)[^.]{0,120}(glucose|hexose transporter|Hxt)", "xylose[^.]{0,150}(affinity|transporter|permease)"]

