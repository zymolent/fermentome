- line: 214
  claim: >-
    'several early yeast isobutanol reports have been questioned on carbon-balance grounds, and a database that ingests them silently launders a disputed number into a fact.'
  verdict: overstated
  publication: "doi:10.1186/1754-6834-4-21"
  corpus_file: "00597.txt"
  evidence:
    # doi:10.1186/1754-6834-4-21  [00597.txt @15659-15855]  re-resolved exact
    - "A carbon balance calculation showed that after accounting for carbon in produced biomass, isobutanol, ethanol, pyruvate, succinate, glycerol, acetate and CO2, there was about 11% of carbon missing"
  notes: >-
    I could not find, anywhere in 1,309 stored full texts, one paper questioning another's isobutanol numbers on carbon-balance grounds. Four search families returned nothing: reproduction failures, disputes, doubts, and yields exceeding theoretical maxima in isobutanol work. What the corpus DOES contain is a yeast isobutanol paper reporting its OWN carbon balance failing to close by about 11%, and then investigating where the carbon went (it looked at 3-methylbutanol and 2-methylbutanol - the same promiscuity line 165 describes). That is self-reported incompleteness by an honest author, not a dispute between groups. Carbon balances elsewhere in the corpus close well (93-103%).
  what_to_change: >-
    Replace the sociological claim with the methodological one it is trying to justify: 'carbon balances in this literature do not always close - one yeast isobutanol study reports ~11% of carbon unaccounted for, and by-products of the same promiscuous decarboxylases are a known sink - so every ingested yield is bound-checked against the theoretical maximum and the unclosed fraction recorded where reported.' Drop 'have been questioned' unless a citation can be produced.
  consequence_if_wrong: >-
    LOW for the mechanism, MEDIUM for the document's credibility. The S.3 bound check is justified either way and should stay. But this same sentence is re-asserted as risk 6 at line 2894 as the RATIONALE for a whole quality mechanism, and an unsourced claim that named-but-unnamed authors are disputed is the kind of thing that should not be in a design document without a citation.
  searches_run: ["carbon balance[^.]{0,250}(isobutanol|question|doubt|dispute|exceed)", "(could not be reproduced|failed to reproduce|not reproducible|irreproducib)[^.]{0,200}(isobutanol|higher alcohol)", "isobutanol[^.]{0,150}(questioned|disputed|doubtful|inconsistent with)", "(exceed|above|higher than)[^.]{0,80}theoretical (maximum|yield)", "(carbon (recovery|balance|missing)|missing carbon)"]

- line: 256
  claim: >-
    Admitted under criterion E1: 'the glucose-tolerance evolution that makes Pdc-minus strains usable'.
  verdict: incomplete
  publication: "doi:10.1016/j.meteno.2016.01.002"
  corpus_file: "00126.txt"
  also_in:
    - "00341.txt doi:10.1093/femsyr/foaf014"
  evidence:
    # doi:10.1016/j.meteno.2016.01.002  [00126.txt @31074-31277]  re-resolved exact
    - "inactivation of the native alcoholic fermentation pathway by deletion of the pyruvate-decarboxylase genes PDC1, PDC5 and PDC6 and introduction of an internal deletion in MTH1 to restore growth on glucose"
    # doi:10.1093/femsyr/foaf014  [00341.txt @19173-19325]  re-resolved exact
    - "ALE of PDC-negative strains has identified a number of effective mutations encoding MTH1, a negative regulator of the glucose sensing signaling pathway."
    # doi:10.1093/femsyr/foaf014  [00341.txt @12968-13098]  re-resolved exact
    - "It is suspected that the deficiency of intracellular C2 compounds and cofactor imbalance are the possible causes of growth defect."
  notes: >-
    Confirmed, and the corpus is far more specific than the plan. The fix is not a vague 'evolution': it is a NAMED ALLELE - an internal deletion in MTH1 (MTH1dT), a negative regulator of glucose sensing, recovered by adaptive laboratory evolution of PDC-negative strains and thereafter carried as a defined genotype. 00126 builds exactly the strain this programme cares about: pdc1 pdc5 pdc6 MTH1dT carrying a full cytosolic isobutanol pathway with an NADH-preferring E. coli KARI (coilvC6E6) and C. glutamicum IlvB/IlvNM13. The corpus also splits the growth defect into TWO causes, not one: C2-compound deficiency AND cofactor imbalance.
  what_to_change: >-
    Name the allele: 'the MTH1 internal deletion (MTH1dT) recovered by ALE of PDC-negative strains, which lowers glucose uptake rate and restores growth on glucose'. File it as a `modification` with its own part record rather than as a literature topic, and split the stated cause into C2-compound deficiency and cofactor imbalance. Add doi:10.1016/j.meteno.2016.01.002 as a seed paper: it is a pdc-minus MTH1dT yeast strain carrying an NADH-preferring KARI, which is simultaneously E1 evidence and direct evidence on ISOBUTANOL_PROGRAM's knowledge gap 5.
  consequence_if_wrong: >-
    MEDIUM-HIGH, and it is a build item. A Pdc-minus DUET derivative needs MTH1dT or an equivalent; admitting 'the glucose-tolerance evolution' as a topic gets the atlas papers, whereas naming MTH1dT gets a constructible genotype. The same paper is the closest thing in the corpus to an answer on NADH-KARI in yeast, and it is reachable only if this line points at it.
  searches_run: ["(Pdc[- ]?(negative|minus)|pdc1.{0,30}pdc5.{0,30}pdc6)[^.]{0,250}(glucose|evolution|C2|growth)", "MTH1[^.]{0,200}(deletion|glucose|ALE|evolution)"]

- line: 309
  claim: >-
    'isobutanol is considerably more toxic than ethanol on a molar basis and acts partly through different membrane effects, so ethanol tolerance mechanisms transfer unevenly.'
  verdict: incomplete
  publication: "doi:10.1534/g3.118.200677"
  corpus_file: "00936.txt"
  also_in:
    - "00118.txt doi:10.1016/j.jbc.2026.113228"
    - "00080.txt doi:10.1016/j.btre.2026.e00959"
  evidence:
    # doi:10.1534/g3.118.200677  [00936.txt @18626-18920]  re-resolved exact
    - "we next compared the transcriptome responses to 0.8% 1-butanol, 1% isobutanol, and 4% ethanol in strains growing under aerobic conditions. These doses are higher than titers produced by engineered strains, but were chosen to provoke a robust stress response but allow all three strains to grow."
    # doi:10.1016/j.btre.2026.e00959  [00080.txt @6028-6221]  re-resolved exact
    - "Isobutanol exhibits more toxicity to yeast cells than ethanol, attributable to the disruption of plasma membrane lipids, membrane transport mechanisms, and the initiation of protein translation"
    # doi:10.1016/j.jbc.2026.113228  [00118.txt @4937-5137]  re-resolved exact
    - "In particular, the concentration of isobutanol that inhibits growth (>1.4% w/v, approximately 190 mM) is much higher than the typical concentrations at which specific protein-ligand interactions occur"
    # doi:10.1534/g3.118.200677  [00936.txt @23028-23261]  re-resolved exact
    - "Butanols triggered reduced expression of respiration genes during aerobic growth but induced expression anaerobically – this was in contrast to ethanol that led to the induction of respiration genes both aerobically and anaerobically"
    # doi:10.1534/g3.118.200677  [00936.txt @20787-20923]  re-resolved exact
    - "Most industrial fermentations are anaerobic, however the majority of studies analyzing alcohol toxicity are based on aerobic conditions."
  notes: >-
    The DIRECTION is well supported and the 'different mechanism' half is supported better than the plan claims - but no single study in this corpus measures both alcohols at a matched endpoint and states the molar ratio, which is what 'considerably more toxic on a molar basis' asserts. The closest is a three-strain transcriptome study that dosed 0.8% 1-butanol, 1% isobutanol and 4% ethanol together; the doses were chosen by judgement ('provoke a robust stress response but allow all three strains to grow'), not by a measured equal-effect titration, so the ~4-6x molar spread they imply is suggestive, not a measurement. The mechanism half gets a concrete, citable difference from the same paper: butanols REPRESS respiration genes aerobically and INDUCE them anaerobically, while ethanol induces them under both. That is a transcriptional difference, not the membrane difference the sentence asserts. BM-TOL-001's draft (docs/drafts/benchmarks/tolerance.yaml) reached the same conclusion independently and had to assemble the ratio from two different papers, strains and media.
  what_to_change: >-
    Split the claim in two and source each. (a) 'Isobutanol is more growth-inhibitory than ethanol; the closest matched exposure in this corpus is 1% isobutanol against 4% ethanol chosen for comparable stress, and no study here reports a matched-endpoint molar ratio.' Open a `knowledge_gap` for the matched IC50 measurement - it is one cheap experiment. (b) Replace 'different membrane effects' with the difference actually measured: 'the transcriptional responses differ in direction, not only magnitude - butanols repress respiration genes aerobically and induce them anaerobically, ethanol induces them under both.' Add the rider that most alcohol-toxicity literature is AEROBIC while DUET is anaerobic.
  consequence_if_wrong: >-
    HIGH for E4 admissions. `transfer_rationale` is the field that decides whether an ethanol tolerance mechanism enters at all, and it is being written against an unmeasured ratio and an unsourced mechanism. The respiration-gene reversal is the strongest transfer argument available and the plan does not use it. The aerobic/anaerobic mismatch is the bigger problem: an ethanol tolerance mechanism established aerobically has two transfer gaps to cross, not one, and B.3.4 counts only one.
  searches_run: ["isobutanol[^.]{0,200}(more toxic|more inhibitory|greater toxicity)", "(IC50|MIC|half.maximal)[^.]{0,200}(isobutanol|butanol)", "(genes?|transcript[a-z]*)[^.]{0,120}(induced|upregulated)[^.]{0,120}anaerobic"]

