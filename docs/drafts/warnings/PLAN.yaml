- line: 1485
  claim: >-
    'The glycerol branch is annotated as the principal anaerobic redox sink for surplus cytosolic NADH.'
  verdict: confirmed
  publication: "doi:10.1093/femsyr/fox044"
  corpus_file: "00351.txt"
  also_in:
    - "00140.txt doi:10.1016/j.synbio.2021.12.010"
  evidence:
    # doi:10.1093/femsyr/fox044  [00351.txt @37010-37283]  re-resolved exact
    - "Glycerol formation, catalyzed by the two isoforms of glycerol-3-phosphate dehydrogenase (Gpd1 and Gpd2) and of glycerol-3-phosphate phosphatase (Gpp1 and Gpp2), is required during anaerobic growth of S. cerevisiae for reoxidation of NADH generated in biosynthetic reactions"
  notes: >-
    Confirmed, and the corpus is more precise about WHERE the surplus NADH comes from: glycerol formation via Gpd1/Gpd2 and Gpp1/Gpp2 'is required during anaerobic growth of S. cerevisiae for reoxidation of NADH generated in BIOSYNTHETIC REACTIONS'. That matters because glycolysis-to-ethanol is already redox-neutral: the surplus is anabolic, so the size of the glycerol sink scales with BIOMASS FORMATION, not with sugar flux. The plan's word 'surplus' is correct but hides that dependency.
  what_to_change: >-
    Drop the mark and add the source of the surplus: 'the principal anaerobic redox sink for the cytosolic NADH generated in biosynthetic reactions - so its size scales with biomass formation rather than with glycolytic flux.'
  consequence_if_wrong: >-
    MEDIUM for route arithmetic. A redox balance that treats the glycerol sink as proportional to sugar uptake will mis-size it at low growth rate - which is exactly the regime a production phase runs in - and any intervention that redirects the sink (the isobutanol route is one) has a growth-rate-dependent effect the atlas should be able to express.
  searches_run: ["gpd1[^.]{0,60}gpd2[^.]{0,250}(anaerobic|growth)", "glycerol[^.]{0,200}(redox|NADH)[^.]{0,120}(sink|reoxidation|balanc)"]

- line: 1486
  claim: >-
    'deleting it without providing an alternative NADH sink impairs anaerobic growth.'
  verdict: incomplete
  publication: "doi:10.1016/j.synbio.2021.12.010"
  corpus_file: "00140.txt"
  also_in:
    - "00051.txt doi:10.1007/s10295-013-1311-5"
    - "00435.txt doi:10.1111/1751-7915.12080"
  evidence:
    # doi:10.1016/j.synbio.2021.12.010  [00140.txt @19922-19980]  re-resolved exact
    - "double deletion of GPD1 and GPD2 prevents anaerobic growth"
    # doi:10.1016/j.synbio.2021.12.010  [00140.txt @19986-20173]  re-resolved exact
    - "Anaerobic growth of gpd1Δ gpd2Δ strains can be rescued by supplementation of compounds such as acetaldehyde or acetoin, which can be reduced by intracellular NADH-dependent dehydrogenases"
    # doi:10.1016/j.synbio.2021.12.010  [00140.txt @20179-20309]  re-resolved exact
    - "Glycerol-negative mutants are highly sensitive to osmotic stress due to the key role of glycerol in osmotolerance of S. cerevisiae"
  notes: >-
    UNDERSTATED, and the understatement is the kind that breaks a benchmark. The corpus says double deletion of GPD1 and GPD2 PREVENTS anaerobic growth - not impairs it - and the rescue is specific and named: supplementation with acetaldehyde or acetoin, or an engineered NADH sink such as a heterologous acetylating acetaldehyde dehydrogenase with acetate. The corpus also carries a SECOND consequence the line omits entirely: glycerol-negative mutants are highly sensitive to OSMOTIC STRESS, because glycerol is also the osmolyte. For a high-gravity industrial process that is not a footnote. Measured numbers exist for the engineered rescue: an evolved gpd1 gpd2 mhpF strain reached 0.21/h against 0.13/h for its ancestor and 0.32/h for the Gpd+ reference - so even a good rescue does not restore wild-type growth.
  what_to_change: >-
    'Deleting both without providing an alternative NADH sink PREVENTS anaerobic growth; it can be rescued by acetaldehyde or acetoin supplementation or by an engineered NADH-consuming route (e.g. acetylating acetaldehyde dehydrogenase plus acetate), which restores growth only partially. A second, independent cost is loss of osmotolerance, since glycerol is also the osmolyte.' Store the two consequences as separate linked assertions - this line is explicitly the template for how the atlas represents engineering trade-offs, and a template that carries one consequence teaches the atlas to carry one.
  consequence_if_wrong: >-
    HIGH, on two counts. (1) BENCHMARK: PLAN.md line 2700 restates this as a known-positive the atlas must recover, with 'impairs anaerobic growth' as the expected outcome. An atlas that correctly returns 'prevents anaerobic growth, rescuable by acetaldehyde' scores as a MISMATCH against its own measuring stick - the same failure mode wave 1 found in BM-PATH-007. (2) PROCESS: osmotolerance loss is a disqualifying property for a high-gravity fermentation and it is nowhere in the plan.
  searches_run: ["gpd1[^.]{0,60}gpd2[^.]{0,250}(anaerobic|growth)", "glycerol.negative[^.]{0,200}(osmo|stress)", "(acetaldehyde|acetoin|acetylating acetaldehyde dehydrogenase)[^.]{0,200}(rescue|anaerobic)"]

