- line: 165
  claim: >-
    'Ehrlich-pathway decarboxylases act on several 2-ketoacids, so an isobutanol strain almost always makes isoamyl alcohol and 2-methyl-1-butanol too.' The adjacent product tier is 2-methyl-1-butanol, 3-methyl-1-butanol (isoamyl alcohol), n-butanol and 1-propanol, captured only when measured in the same experiment as isobutanol.
  verdict: incomplete
  publication: "doi:10.1007/s00253-010-2522-6"
  corpus_file: "00029.txt"
  also_in:
    - "00687.txt doi:10.1186/s12934-022-01738-z"
    - "00141.txt doi:10.1016/j.synbio.2022.02.007"
  evidence:
    # doi:10.1007/s00253-010-2522-6  [00029.txt @777-922]  re-resolved exact
    - "In addition, other higher chain alcohols such as 1-propanol, 2-methyl-1-butanol, 1-butanol, and 2-phenylethanol were also detected as byproducts."
    # doi:10.1186/s12934-022-01738-z  [00687.txt @6277-6450]  re-resolved exact
    - "an engineered KivdS286T with a single amino acid replacement resulted in higher isobutanol production as well as higher isobutanol-to-3M1B molar ratio than the original Kivd"
    # doi:10.1016/j.synbio.2022.02.007  [00141.txt @3225-3532]  re-resolved exact
    - "The second part of the pathway, the Ehrlich pathway, converts KIV to isobutanol by promiscuous cytosolic enzymes: α-ketoacid decarboxylase (KDC, encoded by pyruvate decarboxylases, PDC1 PDC5 or PDC6, or phenylpyruvate decarboxylase, ARO10) and a NADH-dependent alcohol dehydrogenase (ADH, encoded by ADH1-5)"
  notes: >-
    The promiscuity and the co-production are confirmed and are an own-result observation, not a review sentence: a C. glutamicum isobutanol strain reports 1-propanol, 2-methyl-1-butanol, 1-butanol AND 2-phenylethanol as by-products of the same overexpressed KDC. Two things the line misses. (1) 2-PHENYLETHANOL is co-produced by the same enzyme and is NOT in the adjacent tier, so its ratio - one of the four diagnostic ratios the paragraph says it wants - is thrown away at admission. (2) The ratio is ENGINEERABLE and the corpus names the part: KivD S286T, a single substitution, raised both isobutanol and the isobutanol-to-3-methyl-1-butanol molar ratio. That makes decarboxylase specificity a part property with a named variant, not only a diagnostic readout.
  what_to_change: >-
    Add 2-phenylethanol to the adjacent tier (same promiscuous KDC, same experiment rule). Reword 'almost always' to 'routinely, and reported as by-products in own-result isobutanol papers' - no paper in this corpus quantifies how often. Add a sentence: 'The ratio is also a tunable design variable: KivD S286T raises the isobutanol-to-3-methyl-1-butanol ratio, so decarboxylase specificity belongs in the parts catalog (G.6) as a variant property.'
  consequence_if_wrong: >-
    MEDIUM. Dropping 2-phenylethanol loses the aromatic-ketoacid leg of the leak diagnosis while keeping the branched-chain legs, so a strain leaking through Aro10 onto phenylpyruvate reads as clean. And a KDC-specificity variant that exists in the corpus never reaches G.6, so route ranking cannot propose it.
  searches_run: ["isoamyl alcohol[^.]{0,200}(2-methyl-1-butanol|isobutanol)", "(broad substrate (range|specificity)|promiscuous)[^.]{0,150}(decarboxylase|2-keto ?acid)", "(2-methyl-1-butanol|3-methyl-1-butanol)[^.]{0,200}(by-?product|co-?produc|alongside)", "KivD[^.]{0,200}(2-ketoisovalerate|2-ketoisocaproate|substrate)"]

