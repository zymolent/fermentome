        CoA biosynthesis starts from pantothenate. In yeast, pantothenate can be produced via an endogenous pathway starting from 2-ketoisovalerate, derived from the valine metabolic pathway, and spermine, derived from l-ornithine and methionine []. Besides, it can be taken up from the medium by the transporter Fen2 [].
  what_to_change: >-
    Change the line to `Deletions  BAT1/BAT2, LEU4/LEU9, ECM31` and delete the attenuation caveat, together with the section-1 amendment sentence that "the pathway is plausibly essential (unverified), so an ecm31-delta proposal must carry an essentiality check and fall back to attenuation if it fails." ecm31-delta is viable and is an ordinary, repeatedly published deletion in isobutanol strains: at least two independent groups in this corpus carry it, one in a strain reaching 2.09 g/L isobutanol (CEN.PK113-7D dilv2 dbdh1 dbdh2 dleu4 dleu9 decm31 dilv1 dadh1 dgpd1 dgpd2 dald6), and a review lists Ecm31 among competing enzymes whose elimination raised yields. The mechanism is that yeast does not depend on de novo pantothenate - it can also take pantothenate up from the medium via Fen2. Separately, fix the paralogs on the same line: the corpus deletes LEU4 and LEU9 together, and BAT2 is the cytosolic paralog of BAT1; a deletion set naming only LEU4 and only BAT1 leaves the paralog carrying the flux.
  consequence_if_wrong: >-
    The most serious item in this audit. As written, the atlas gates every ecm31-delta proposal behind an essentiality check and defaults to attenuation - so a team is told to build a promoter-swap or degron construct for a gene that published strains simply delete. That is an unnecessary construct, an unnecessary control, and a strain that leaks 2-KIV to pantothenate for a whole build cycle, all to guard against a hazard the literature has already shown does not exist. The paralog error compounds it: a leu4-delta single deletion leaves Leu9 draining 2-KIV to leucine, so the deletion set as written would under-perform and the failure would be blamed on the route rather than on the missing paralog.
