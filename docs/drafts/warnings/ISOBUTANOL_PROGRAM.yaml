        Then, we successively deleted essential genes of competing pathways for synthesis of 2,3-butanediol (BDH1 and BDH2), leucine (LEU4 and LEU9), pantothenate (ECM31) and isoleucine (ILV1) resulting in an optimized metabolic flux toward isobutanol and titers of up to 0.56 g/L (13.54 mg/g glucose).
    - |-
        A primary intermediate in isobutanol biosynthesis, 2-ketoisovalerate, also functions as an initial substrate in pantothenic acid biosynthesis []. 3-Methyl-2-oxobutanoate hydroxymethyltransferase, encoded by ECM31, catalyzes the first step in pantothenic acid biosynthesis. Consequently, deletion of ECM31 could prevent the diversion of 2-ketoisovalerate into the pantothenate pathway (Figure ).
