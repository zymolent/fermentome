- line: 108
  claim: >-
    AlsS is catabolic and not feedback-inhibited by valine, which is why it is preferred in heterologous builds.
  verdict: incomplete
  publication: "doi:10.1002/elsc.201900151"
  also_in:
    - "00474.txt doi:10.1128/aem.00976-22"
    - "00029.txt doi:10.1007/s00253-010-2522-6"
  evidence:
    - |-
        The first step in this route is the conversion of two pyruvate molecules to 2‐acetolactate catalyzed by the acetolactate synthase (AlsS), which is usually feedback inhibited by the branched‐chain amino acids l‐valine, l‐leucine, and l‐isoleucine. However, AlsS from Bacillus subtilis has been shown to be feedback‐resistant and therefore has been applied for isobutanol production in several studies , .
    - |-
        Alternatively, AlsS from B. subtilis generates 2-acetolactate but not 2-aceto-2-hydroxybutyrate (), which could reduce the accumulation of l-isoleucine as a by-product (). AlsS could not be affected by the feedback inhibition of branched-chain amino acids (). Although AlsS has 2-ketoisovalerate decarboxylase activity, we minimized this activity and maintained the overall acetolactate synthase activity through molecular modification and RBS optimization, respectively.
  what_to_change: >-
    The feedback half is confirmed, with one correction of scope: the corpus says AlsS is resistant to feedback inhibition by the branched-chain amino acids generally (valine, leucine and isoleucine), not by valine alone. The word "catabolic" is not supported anywhere in this corpus - either cite it from a B. subtilis acetoin-pathway source or drop it. Add two properties the corpus does report and the design-variable column omits: AlsS makes 2-acetolactate but not 2-aceto-2-hydroxybutyrate, so it leaks less to isoleucine than the native AHAS; and AlsS itself carries a 2-ketoisovalerate decarboxylase side activity.
  consequence_if_wrong: >-
