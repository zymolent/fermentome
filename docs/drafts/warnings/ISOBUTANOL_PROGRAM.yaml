    Keep the row but relabel it. Across 366 readable isobutanol papers there is no peroxisomal (or vacuolar, or synthetic-compartment) isobutanol or branched-chain-alcohol build in this corpus. Peroxisomal targeting of other pathways in yeast is well attested, so the technique is real; the application is not. Change "Peroxisomal or other-organelle assembly" to "Peroxisomal or other-organelle assembly - technique demonstrated for other pathways, no isobutanol precedent found" and set the row's evidence level to Zone I (untested) rather than leaving it to read as a fourth published family alongside A, B and C.
