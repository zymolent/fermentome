        For example, overexpression of the native S. cerevisiae valine biosynthesis and degradation pathways led to isobutanol yields of only 0.0059 mol/mol glucose (), while additional elimination of competing enzymes such as Bat1, Leu2, Ald6, Ecm31, Pdc1 and Lpd1 resulted in significant but moderate increases of isobutanol yields (, , , ).
