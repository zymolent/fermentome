  evidence:
    - |-
        KIV, the key intermediate, follows the isobutanol production route by being transported into the cytosol using the unidentified mitochondrial KIV carrier (KIVC), where it is further converted to isobutanol by KDCs and ADHs, respectively. This isobutanol production route, which requires the transport of KIV via KIVC, was designated the KIVC-dependent pathway.
    - |-
        This is consistent with the high activity of the mitochondrial α-KIV carrier, which transports α-KIV produced in mitochondria to the cytosol, where it can be decarboxylated by endogenous cytosolic ketoacid decarboxylases to isobutyraldehyde [].
  what_to_change: >-
    Drop the mark on the carrier: a 2026 paper in this corpus names it in so many words as "the unidentified mitochondrial KIV carrier (KIVC)". But record two facts the diagram hides. (1) The gap is identity, not existence - transport is demonstrated and at least one study describes the carrier as high-activity, so a strategy-A route must not be costed as if 2-KIV cannot leave. (2) The competing set at this node is incomplete: the corpus documents extracellular accumulation of KIV (and of acetolactate and DHIV) through unidentified plasma-membrane export, a fourth drain at or near this node, plus Ald6 oxidation of isobutyraldehyde to isobutyrate downstream. Add `kiv_extracellular_export` to the competing set or to section 5 as its own gap.
