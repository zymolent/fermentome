- line: 45
  claim: >-
    Ilv5 takes NADPH; the alcohol dehydrogenase step typically takes NADH.
  verdict: overstated
  publication: "doi:10.1186/1475-2859-12-119"
  also_in:
    - "00341.txt doi:10.1093/femsyr/foaf014"
    - "00028.txt doi:10.1007/s00253-009-2085-6"
  evidence:
    - |-
        The metabolic pathway shown in Figure also indicates that isobutanol biosynthesis requires NADPH as a cofactor for the reaction catalyzed by Ilv5p and Adh6p. For synthesis of one molecule of isobutanol from two molecules of pyruvate, reducing power has to be supplied by two molecules of NADPH. Because ethanol synthesis from pyruvate essentially uses NADH as a cofactor, the activation of isobutanol biosynthesis should cause NADPH shortage and NADH abundance.
    - |-
        Among them, the Kari is NADPH-dependent and the Adh is NADH-dependent.
    - |-
        As predicted by sequence analysis, AdhA from L. lactis did not show any detectable enzymatic activity when tested with NADPH as a cofactor (Table ). AdhA showed relatively small substrate preference towards acetaldehyde, but it exhibited the highest activity for isobutyraldehyde among the three enzymes tested. The glycolysis pathway produces two NADH per glucose but does not produce NADPH. Therefore, NADH-dependent enzymes should be preferred for isobutanol production. These results suggest that AdhA is most suitable for isobutanol production in an engineered pathway
  what_to_change: >-
    Replace "the alcohol dehydrogenase step typically takes NADH" with: "the alcohol dehydrogenase step takes NADH or NADPH depending on which ADH is used - Adh1/Adh2 and L. lactis AdhA are NADH-dependent, Adh6, Adh7 and E. coli YqhD are NADPH-dependent - so the cofactor mismatch at this step is a part choice, not a property of the route." Note that the highest-titer yeast builds in this corpus pair kivd with ADH6, i.e. the published yeast route is NADPH at both steps and consumes two NADPH per isobutanol, not one NADPH and one NADH.
  consequence_if_wrong: >-
    A redox-balance error of two reducing equivalents in the configuration most published yeast strains actually use. The `Balance / redox per compartment` line of a route card computed on 'NADPH in, NADH out' will stamp a route balanced that is not, and will propose a transhydrogenase-like shunt (Pyc2/Mdh2/Mae1) for a route that does not need one, or omit it for one that does. At the bench it drives the wrong ADH part choice: swapping Adh6 for AdhA to 'fix' the mismatch would break a strain whose engineered asset is NADPH supply.
  searches_run:
    - "(Adh6|Adh7|ADH6|ADH7|YqhD|yqhD)[^.]{0,140}NADPH|NADPH.{0,120}(Adh6|Adh7|YqhD)"
    - "adhA --require 'NADH|NADPH'"

