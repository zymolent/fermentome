  evidence:
    - |-
        To prevent the import of the three enzymes into yeast mitochondria, N-terminally shortened Ilv2, Ilv5 and Ilv3 versions were constructed lacking their mitochondrial targeting sequences. SDS-PAGE and immunofluorescence analyses confirmed expression and re-localization of the truncated enzymes.
    - |-
        To overcome this compartmentalization problem, we relocated llv2, Ilv5, and Ilv3 to the cytosol by deleting the N-terminal mitochondrial targeting sequence as reported previously. ILV2ΔN54, ILV5ΔN48, and ILV3ΔN19 were expressed under the control of a strong constitutive promoter, PTDH3, on CEN-based plasmids
    - |-
        In S. cerevisiae, iron–sulphur cluster biogenesis and assembly into mature proteins occurs predominantly in the mitochondrial matrix (), the location of the native yeast dihydroxyacid dehydratase Ilv3. Iron–sulphur cluster assembly can also occur in the yeast cytosol (, , ), but has a much lower capacity than the mitochondrial system (, ).
  what_to_change: >-
    Drop both marks and add the specifics a builder needs. The demonstrated truncations are Ilv2dN54, Ilv5dN48 and Ilv3dN19, used by at least three independent groups in this corpus; file them as parts with `verification_method` = microscopy / subcellular fractionation (SDS-PAGE plus immunofluorescence in doi:10.1186/1754-6834-5-65). For the Fe-S half, state the mechanism rather than the adjective: cytosolic Fe-S assembly (CIA) exists but has a much lower capacity than the mitochondrial ISC system, and the demonstrated mitigations in this corpus are iron supplementation, AFT1 overexpression and NFS1 overexpression. Record the negative result too: the same paper reports that Ilv3 versions truncated more deeply than dN19 failed to complement and had probably lost activity.
  consequence_if_wrong: >-
