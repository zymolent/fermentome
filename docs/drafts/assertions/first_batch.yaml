refused:
  - key: R1
    name: bat1 deletion in IbOH-1bat1-delta
    modification_id: YAA:MOD:8003a204b05640ff
    strain_id: YAA:STRAIN:iboh-1bat1
    publication_id: doi:10.1016/j.btre.2026.e00959
    would_be_group: group:koonthongkaew-chulalongkorn
    reason: no isogenic control exists
    detail: >-
      the only other titer in that paper is YAA:STRAIN:wild-type-s-cerevisiae at 6.4 mg/L, whose
      span is a background statement in the discussion, not a control run beside the test strain.
      IbOH-1bat1-delta is IbOH-1 -- a mutagenised, isobutanol-tolerant industrial isolate -- plus
      bat1-delta, so comparing it with a generic wild type attributes to BAT1 an effect that
      includes the whole mutagenesis. That is inventing a direction.
    direct_biochemical_considered: true
    direct_biochemical_result: >-
      plan_assertion returns ready=false, "needs evidence[0].assay_method: which assay produced
      the number -- enzyme assay, isotope tracing, flux". Every measurement.assay_method in the
      atlas is NULL, and a whole-strain titer is not a biochemical assay of Bat1 in any case.
      Forcing a type that needs no control onto a claim that needs one is how an L1 badge lands on
      an uncontrolled number.
    unblocked_by: >-
      curating a titer for YAA:STRAIN:iboh-1, which is already a row in the atlas with no
      measurement. Highest-value curation task this exercise found.

  - key: R2
    name: lpd1 deletion on BSW191
    modification_id: YAA:MOD:a7c8f9da22ee16e0
    strain_id: YAA:STRAIN:bsw191
    publication_id: doi:10.1186/1475-2859-12-119
    would_be_group: group:kondo-kobe-riken
    reason: the modification is recorded on a strain whose curated genotype does not carry it
    detail: >-
      the genotype spans from the same paper give BSW191 as
      "BY4741/pATP426-kivd-ADH6-ILV2/pILV532cytM/pATP423-PMsM" with no lpd1-delta; BSW205 and
      BSW206 are the lpd1-delta strains. The modification was promoted from an abstract sentence
      that names no strain. Asserting on it would produce a cleanly-resolving L1 statement about
      the wrong strain, which traceability.py calls worse than one that fails to resolve.
    rows_for_the_owner:
      - "YAA:MOD:a7c8f9da22ee16e0.strain_id -- likely YAA:STRAIN:bsw206 (PMsM) rather than bsw191"
      - >-
        YAA:MEAS:f7a49e8797f74431 -- BSW191, 1.62 g/L, promoted from the abstract sentence
        immediately after the lpd1-delta one, which reports the two *integrated* (lpd1-delta +
        shunt) strains. BSW191's in-text titer is 83 mg/L. Looks like the same mis-attribution.

  - key: R3
    name: kivd insertion on BSW191
    modification_id: YAA:MOD:dd058febc2a55035
    strain_id: YAA:STRAIN:bsw191
    publication_id: doi:10.1186/1475-2859-12-119
    would_be_group: group:kondo-kobe-riken
    reason: the only available control carries the modification too
    detail: >-
      the comparator BSW100 (22 mg/L) is the strain into which "ILV2, kivd, and ADH6 were
      introduced". Both arms carry kivd. The difference between BSW191 (83 mg/L) and BSW100 is the
      transhydrogenase-like shunt plasmid pATP423-PMsM, which has no `modification` row. Drafting
      it would attribute the shunt's effect to kivd.
    unblocked_by: promoting a modification row for the transhydrogenase-like shunt.

planner_limitation_found:
  finding: >-
    all three refusals return ready=true from plan_assertion.
  why: >-
    the planner checks that every cited row exists, that the per-type fields are present and that
    a J.5 arm closes. It cannot check whether the control isolates the modification, because
    nothing in the schema says what a strain's genotype is -- `strain_lineage` holds 0 rows and
    genotypes live in span prose. That judgement is the curation, and it is not automatable today.
  not_proposed_as_a_fix: >-
    teaching the planner to guess lineage from strain names or span text would be the same guess
    CONVENTIONS.md forbids elsewhere. Populating `strain_lineage` would make it checkable.

near_misses:
  - name: GLN3 tolerance and titer
    publication_id: doi:10.1016/j.cels.2019.10.006
    have: >-
      gln3D/gln3D homozygous diploid BY4743 at 306 mg/L, BY4743 at 63 mg/L, a fold_change of 4.9,
      and tolerance numbers for gln3D vs BY4741 -- a perturbation with its own control.
    missing: "no `modification` row for gln3-delta, so assertion.subject_id has nothing to point at"
    would_yield: "two L1 assertions (affects_production_of and affects_tolerance_to)"
  - name: BAT1 / BAT2 across two backgrounds
    publication_id: doi:10.1016/j.ymben.2017.10.001
    group: group:avalos-princeton
    have: "24 promoted measurements including a 14.2-fold increase from bat1-delta"
    missing: "no `modification` rows in this publication"
    would_yield: >-
      the atlas's first L2. A bat1-delta claim supported by group:avalos-princeton and
      group:koonthongkaew-chulalongkorn would be two independent groups concordant in direction --
      which also needs R1's IbOH-1 control titer.

rehearsal:
  method: >-
    each request planned against the live atlas (mode=ro), then built with build_assertion as a
    human curator in a throwaway in-memory database loaded with copies of the organism, product,
    publication, extraction, span, strain, measurement and modification rows it cites. The level
    was read back out of the assertion_level view, never chosen.
  levels_reported_by_the_view:
    YAA:ASSERT:80b93f76dadaa25c: "L1 / direct_evidence"
    YAA:ASSERT:9fb20030a088b251: "L1 / direct_evidence"
    YAA:ASSERT:de97fba6db568868: "L1 / direct_evidence"
    YAA:ASSERT:f75570bed59e4456: "L1 / direct_evidence"
    YAA:ASSERT:15a8bd300d887a9d: "L1 / direct_evidence"
    YAA:ASSERT:65a970e162e06e63: "L1 / direct_evidence"
  traceability_walk:
    n_walked: 6
    n_closed: 6
    n_broken: 0
    breaks: {}
    gaps: {}
    exit_code: 0
    note: >-
      the literature arm closes through span -> publication for all six; the analysis arm is not
      involved, so the known dataset_unreachable gap never arises. exit_code 0 rather than
      EXIT_VACUOUS 3 -- the first time that gate has had anything to walk.
  live_atlas_recounted_afterwards:
    assertion: 0
    evidence_item: 0

owner_decisions:
  - "the independent_group slug (`group:boles-goethe-frankfurt` is a proposal)"
  - "A5: approve with the stated control caveat, or hold until JWY16's titer is curated"
  - "the two suspect rows named under R2 -- they belong to whoever owns data/ and promotion"
