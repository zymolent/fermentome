# The atlas's first assertion batch, as proposals. NOTHING HERE HAS BEEN WRITTEN.
#
# The argument for every entry is in docs/drafts/assertions/FIRST_BATCH.md; this file is the
# machine-readable half and is deliberately not self-justifying.
#
# Two fields you will not find, on purpose:
#   * `level` -- there is no such column. `assertion_level` derives it. `expected_level` below is
#     a prediction plus the rule it follows, checked by an in-memory rehearsal, never a value to
#     be written.
#   * `effect_size` -- every cited measurement is a titer. A titer is not an effect, and the
#     difference from the control is a number this atlas would have computed rather than one the
#     paper reported. Left NULL on all six; recoverable later from measurement + control_measurement.

batch: first_batch
status: proposal
approved_set: direct_perturbation
drafted_by: agent
drafted_on: 2026-09-22
source_database: "~/fermdb-data/fermdb.sqlite3 (opened mode=ro)"
writes_performed: none
live_counts_after_drafting:
  assertion: 0
  evidence_item: 0

search:
  query: "join strain x modification x measurement on strain_id; require a comparator strain with a measurement of the same quantity_kind and product_id"
  triples_strain_modification_measurement: 17
  candidate_strain_modification_pairs: 9
  candidate_strains: 8
  pairs_with_a_comparator_that_isolates_the_modification: 6
  pairs_drafted: 6
  pairs_refused: 3
  note: >-
    14 of the 17 triples have some other strain measured the same way in the same paper. That is
    not a comparator. A perturbation claim needs a control differing by the recorded modification
    and nothing else, and `strain_lineage` holds 0 rows, so every comparator below was read from
    span text and stored full text rather than joined.

independent_groups:
  - id: group:boles-goethe-frankfurt
    used_by: [A1, A2, A3, A4, A5, A6]
    decided_from: >-
      PubMed author affiliations for PMID 31303893: Wess J, Brinek M and Boles E are all Institute
      of Molecular Biosciences, Goethe University Frankfurt. One institute, one senior author.
    not_decided_from: >-
      the publication id. PLAN.md J.3 counts independence by group precisely so that one lab's
      three papers do not read as three groups, and `assertions.py` refuses to default it.
    owner_decision_required: true
    owner_decision: >-
      the slug itself. It becomes a permanent key in COUNT(DISTINCT independent_group).

defaults_shared_by_all_proposals:
  subject_type: modification
  predicate: affects_production_of
  predicate_checked_against: "`predicate` table, 17 active terms (PLAN.md J.2)"
  predicate_rejected_alternatives:
    affects_yield_of: "every cited measurement is a titer (g/L), not a yield; the two are different numbers"
    improves_when_modified_by: "structurally impossible -- assertion.object_type has no 'modification' value"
  object_type: product
  object_id: YAA:PRODUCT:isobutanol
  product_id: YAA:PRODUCT:isobutanol
  evidence_type: direct_perturbation
  evidence_type_reason: >-
    a gene was deleted, the product was measured, and a control differing by that deletion was
    measured the same way in the same experiment -- PLAN.md J.3's definition verbatim.
  zone: R
  confidence: medium
  effect_size: null
  effect_unit: null
  effect_ci_low: null
  effect_ci_high: null
  effect_n: null
  built_by: fermdb.curate.assertions.from_modification
  publication_source: >-
    read off modification.publication_id (schema v12 FK), not supplied by the drafter.

