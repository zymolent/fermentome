independent_group_convention:
  form: "group:<pi-surname>-<institution>, settled by the owner 2026-09-22"
  not_decided_from: >-
    the publication id, and not from anything the atlas stores. `publication` has no author or
    affiliation column, so this is a curator judgement each time.

independence_claim:
  shared_authors: none
  author_sets:
    avalos_princeton: [Hammer SK, Avalos JL]
    koonthongkaew_chulalongkorn: [Thammapanyaphong N, Boonyanuwat M, Luengnaruemitchai A, Koonthongkaew J]
  intersection: []
  shared_institution: none
  detail: >-
    Princeton, New Jersey against Chulalongkorn University, Bangkok. No shared department, centre
    or corresponding address, and nine years apart. This is the claim that makes the L2 real: if
    the two labs were not independent, COUNT(DISTINCT independent_group) would be laundering a
    repeat into a replication.
  citation_is_not_collaboration: >-
    the Chulalongkorn paper cites the Princeton one as prior literature -- "Hammer and Avalos
    (2017) demonstrated that deletion of the BAT1 gene is the most effective approach to improve
    isobutanol productivity" [21327, 21465). That is the second group deliberately testing the
    first group's finding in a background the first group never touched, which is the strongest
    form J.3's axis-2 count can take, not evidence against independence.
  near_miss_that_would_have_broken_it:
    publication_id: doi:10.1186/s13068-019-1560-2
    pmid: "31548865"
    title: "Xylose utilization stimulates mitochondrial production of isobutanol and 2-methyl-1-butanol in S. cerevisiae"
    authors: [Zhang Y, Lane S, Chen JM, Hammer SK, Luttinger J, Yang L, Jin YS, Avalos JL]
    group: group:avalos-princeton
    warning: >-
      a third paper in the corpus carries BAT1 spans and looks, from the DOI alone, like a third
      group. Senior author Avalos; Hammer is on both papers. Counting it as a third group would
      promote this assertion on a repeat rather than a replication -- the precise failure J.3
      exists to prevent. Recorded so the next person does not have to rediscover it.

