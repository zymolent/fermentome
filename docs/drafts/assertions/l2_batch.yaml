# The atlas's first L2 assertion, as a proposal. NOTHING HERE HAS BEEN WRITTEN.
#
# The argument for every entry is in docs/drafts/assertions/L2_BATCH.md; this file is the
# machine-readable half and is deliberately not self-justifying.
#
# Fields you will not find, on purpose, and the same two as first_batch.yaml:
#   * `level` -- there is no such column. `assertion_level` derives it. `expected_level` below is
#     a prediction plus the rule it follows, checked by an in-memory rehearsal, never a value to
#     be written.
#   * `effect_size` -- E1 cites a fold-change and E2 a titer against a non-detect; neither is an
#     effect this atlas may put a number on. Left NULL, with effect_unit / effect_ci_* / effect_n.
#
# One field that is here and is NOT a column: `control_measurement_id`, carried for the reader
# exactly as first_batch.yaml carried it. `evidence_item` has no such column. PLAN.md J.3 requires
# a stated control (`control_strain_id` or `control_condition_id`), not a second number.

