      reports as not-detected. A fold-change over a non-detect has no finite value, and mixing the
      two into one effect_size would be a number this atlas computed rather than one either paper
      reported.
    zone: R
    confidence: medium
    expected_level: L2
    expected_basis: direct_evidence_replicated
    expected_level_reason: >-
      two active direct_perturbation items, two distinct non-NULL independent_group values, one
      distinct direction among them, no open `conflict` row of kind 'direction'. That is
      assertion_level's L2 branch verbatim: n_direct > 0 AND n_direct_groups >= 2 AND
