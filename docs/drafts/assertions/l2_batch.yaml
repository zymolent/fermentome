    plan:
      ready: true
      note: "ready to write assertion YAA:ASSERT:017a897a1a9054c2 with 2 evidence item(s)"
      missing: []
      blockers: []
      warnings: []
    evidence:
      - key: E1
        evidence_id: YAA:EV:a3092a401c302d0c
        evidence_type: direct_perturbation
        independent_group: group:avalos-princeton
        strain_id: YAA:STRAIN:shy24
        strain_label: "SHy24, bat1-delta in CEN.PK2-1C"
        control_strain_id: YAA:STRAIN:shy23
        control_strain_label: "SHy23, the wild-type control of the same series"
        control_condition_id: null
        measurement_id: YAA:MEAS:1e8f45029502a6d4
        measurement_label: "14.2, quantity_kind fold_increase_in_isobutanol_production"
        span_id: YAA:SPAN:9a52a8dc28ef4afc9dfd74dd94f410a6
        span_offsets: "[31365, 31429)"
        publication_id: doi:10.1016/j.ymben.2017.10.001
        direction: increases
        zone: R
        confidence: medium
        control_measurement_id: YAA:MEAS:dc0d5fef6b42e641   # NOT a column; 42 +/- 11 mg/L, SHy23
        comparator_justification: >-
          the control is named in the preceding sentence of the same figure panel: "When BAT2 is
          deleted in CEN.PK2-1C (SHy25) isobutanol production (35 +/- 12 mg/L) remains
          approximately the same as in the wild type control (42 +/- 11 mg/L), (SHy23), (Fig. 3b).
          However, deletion of BAT1 (SHy24) results in a 14.2-fold increase in isobutanol
          production". Same 48-h high-cell-density fermentation, same panel, differing by bat1Δ.
        measurement_choice_justification: >-
          SHy24 has exactly one promoted titer, 122 mg/L (YAA:MEAS:e52fb6b66fa8d889), and it is the
          VALINE-FED condition -- "In the presence of valine, isobutanol titers of bat1Δ strains
          are substantially decreased by as much as 80% to 269 +/- 16 mg/L and 122 +/- 8 mg/L with
          (SHy16) and without (SHy24)" [33624, 33798). Citing it would attach a +valine number to a
          claim the authors state for valine-free medium: "with valine removed from the media, we
          observe an unprecedented 14.2-fold increase" [47942, 48087). The 14.2-fold row is the
          valine-free comparison and is what the abstract leads with.

      - key: E2
        evidence_id: YAA:EV:405403e8e4094f4a
        evidence_type: direct_perturbation
        independent_group: group:koonthongkaew-chulalongkorn
        strain_id: YAA:STRAIN:iboh-1bat1
        strain_label: "IbOH-1bat1delta, CRISPR/Cas9 BAT1 knockout"
        control_strain_id: YAA:STRAIN:iboh-1
        control_strain_label: "IbOH-1, the isogenic BAT1-intact parent"
        control_condition_id: null
        measurement_id: YAA:MEAS:e02f80aee1c3706c
        measurement_label: "0.866 g/L titer, YNB + 100 g/L glucose, 72 h"
        span_id: YAA:SPAN:3d8e0f0e20774354aea1f0562f2741a8
        span_offsets: "[27209, 27324)"
        publication_id: doi:10.1016/j.btre.2026.e00959
        direction: increases
        zone: R
        confidence: medium
        control_measurement_id: null   # NOT a column; and see control_is_uncurated below
        comparator_justification: >-
          FIRST_BATCH.md R1 refused this claim for "no isogenic control exists". That is true of
          the promoted `measurement` rows and false of the paper. Full text [22145, 22531): "To
          investigate whether the mutation in the BAT1 gene of IbOH-1 affected Bat1 enzyme
          function, isobutanol content was compared between G2-3-2 and the IbOH-1. The results
          indicated that the isobutanol concentration in both strains was below the quantification
          limit." Fig. 4 caption [22627, 22745): "Isobutanol concentration (g/L) from G2-3-2,
          IbOH-1, and IbOH-1bat1delta (N.D. indicates not-detected amount of isobutanol)." And
          [25664, 25825): "IbOH-1bat1delta demonstrated a significantly greater elevation in
          isobutanol levels compared to the sub-quantified isobutanol content observed in IbOH-1."
          IbOH-1 is the test strain minus the CRISPR deletion and nothing else, measured in the
          same figure. R1's objection was right about the wrong control (the generic
          YAA:STRAIN:wild-type-s-cerevisiae at 6.4 mg/L) and is answered by using the right one.
        control_is_uncurated: >-
          the control's VALUE is "not detected" and nobody curated a measurement row for a
          non-detect. `measurement` has is_below_lod, detection_limit and is_upper_bound for
          exactly this, so it is a curation gap, not a schema gap. It does not block this evidence
          item: `evidence_item` has no control_measurement_id column at all, and J.3 requires a
          stated control, not a second number. YAA:STRAIN:iboh-1 is a row in the atlas today.
        measurement_choice_justification: >-
          four titers are promoted for IbOH-1bat1delta -- 0.215 g/L (YPD, 100 g/L glucose), 0.866
          g/L (YNB, 100 g/L glucose), 1.001 g/L (YNB, 150 g/L glucose) and 2.016 g/L (best shake
          flask). YNB is "minimal YNB medium devoid of valine" [26887, 27004), making 0.866 g/L the
          item whose condition is closest to E1's valine-free condition. A bonus, not a
          requirement: the claim is a direction, and all four exceed a non-detect.
        caveat_that_does_not_change_the_direction: >-
          IbOH-1 is a UV mutagenesis product and its own BAT1 carries a C320T / I107T substitution.
          The authors test whether that allele alone suffices and report it does not (isobutanol
          below quantification in both G2-3-2 and IbOH-1), which is why they then deleted the gene.
          So E2 contrasts bat1-delta against a hypomorph-or-neutral BAT1 allele rather than a
          textbook wild type. That makes E2's effect size unquantifiable and leaves `increases`
          untouched.

    optional_third_evidence_item:
