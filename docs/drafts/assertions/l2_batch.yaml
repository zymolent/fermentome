why_the_subject_is_a_gene_group:
  finding: >-
    subject_type='modification' cannot reach L2 for this claim, under any curation.
  why: >-
    assertion_id_for hashes AssertionRequest.identity(), which includes subject_id. A
    `modification` row belongs to one strain in one paper, so Princeton's bat1-delta (SHy24) and
    Chulalongkorn's bat1-delta (IbOH-1) are two rows, two subject_ids and two assertion ids. Two
    assertions with one evidence item each are two L1s forever.
  rehearsed: >-
    from_modification(YAA:MOD:8003a204b05640ff, ...) -> YAA:ASSERT:05f3751605dfdcbd, which is a
    different id from the drafted YAA:ASSERT:017a897a1a9054c2.
  rejected_workaround: >-
    attaching Princeton's evidence to the Chulalongkorn modification's assertion. The assertion's
    subject would then be one CRISPR deletion in one Thai industrial isolate, cited in support by
    a Princeton experiment on CEN.PK2-1C. That is J.3's conflation moved from the group column to
    the subject column.
  chosen: "gene_group YAA:GG:yhr208w (BAT1 / YHR208W, scope 'species', zone H, confidence high)"
  gene_rejected: >-
    YAA:GENE:gcf-000146045-2-yhr208w is zone R, which would have matched the assertion's zone more
    tidily, but it is bound to assembly GCF_000146045.2 (S288C). Neither experiment is in S288C:
    one is CEN.PK2-1C, the other a UV-mutagenised derivative of industrial isolate G2-3-2 whose own
    BAT1 carries a C320T / I107T substitution. schema.sql says on that column why it matters --
    "a gene id is meaningless without its assembly". A species-scope gene group is the only anchor
    that honestly spans both.
  zone_note: >-
    first assertion in the atlas whose subject is not zone R. CONVENTIONS.md's zone table allows
    it ("H -- may support a conclusion: yes") and assertion_level does not read zone at all, but
    it is a precedent and the owner should set it knowingly.

