    subject_label: "BAT1 / YHR208W, mitochondrial branched-chain amino acid transaminase, species scope"
    predicate: affects_production_of
    predicate_checked_against: "`predicate` table, 17 active terms (PLAN.md J.2)"
    predicate_rejected_alternatives:
      affects_yield_of: "both cited numbers are titers or fold-changes in titer, not yields"
      improves_when_modified_by: "structurally impossible -- assertion.object_type has no 'modification' value"
      is_bottleneck_for: >-
        tempting: the Chulalongkorn paper calls Bat1 "the rate-limiting and bottleneck enzyme that
        limits isobutanol productivity" in as many words, and it would sidestep the sign problem
        by leaving assertion.direction NULL. Not used because the evidence offered is two titer
        comparisons -- they measure how much isobutanol, not where flux is limited. That claim
        belongs to the `bottleneck` table with its own evidence.
      competes_with: >-
        the most mechanistically accurate description of Bat1 (it drains KIV to valine) and not
        supported by these two measurements either.
