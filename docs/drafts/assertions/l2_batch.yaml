      what_it_adds: >-
        a third genetic background (BY4741 alongside CEN.PK2-1C and the industrial isolate), which
        strengthens J.3 axis 2's n_organisms / n_condition_classes. It adds NO group, and the
        rehearsal confirms the level is L2 with or without it.

rehearsal:
  method: >-
    the live atlas was copied into a :memory: database with sqlite3.Connection.backup, so the walk
    covers the five existing L1s as well as the new row. build_assertion ran there as curator
    kangkon, kind human. The level was read out of the assertion_level view, never chosen.
  variants:
    - id: A
      built: "E1 + E2 -- the proposal"
      n_evidence: 2
      n_direct: 2
      n_direct_groups: 2
      level: L2
      derived_reason: direct_evidence_replicated
      plan: {ready: true, missing: [], blockers: [], warnings: []}
    - id: B1
      built: "E1 alone (Princeton only)"
      n_evidence: 1
      n_direct: 1
      n_direct_groups: 1
      level: L1
      derived_reason: direct_evidence
    - id: B2
      built: "E2 alone (Chulalongkorn only)"
      n_evidence: 1
      n_direct: 1
      n_direct_groups: 1
      level: L1
      derived_reason: direct_evidence
    - id: B3
      built: "E1 via build_assertion, then E2 via attach_evidence -- the path this will take"
      before: "level='L1' basis='direct_evidence'"
      after: "level='L2' basis='direct_evidence_replicated'"
      assertion_row_after: {direction: increases, created_by: kangkon, zone: R}
      note: >-
        the assertion row is identical before and after. Nothing recomputed a level, because there
        is nowhere a level is kept. PLAN.md J.1 ("an assertion is never edited") and J.3 ("the
        level is a view, not a column") are the same sentence seen from two ends, and this is the
        first time the atlas has demonstrated it.
    - id: B4
      built: "E1 + E2, both mislabelled group:avalos-princeton"
      n_evidence: 2
      n_direct: 2
      n_direct_groups: 1
      level: L1
      derived_reason: direct_evidence
      note: >-
        THE row that matters. The same two experiments, the same two papers, the same two numbers,
        and it grades L1 -- the only thing that changed is the string in independent_group. That is
        J.3's second axis doing the entire job, on real data, for the first time.
    - id: B5
      built: "E2 with independent_group = None"
      plan_ready: false
      refused_with: >-
        evidence[1].independent_group: PLAN.md J.3 counts independence by group, not by
        publication, because one lab publishing three times is not three independent observations.
    - id: B6
      built: "E1 + E3 + E2"
      n_evidence: 3
      n_direct: 3
      n_direct_groups: 2
      level: L2
      derived_reason: direct_evidence_replicated
    - id: B7
      built: "E1 + E2 with E2's direction flipped to 'decreases'"
      n_evidence: 2
      n_direct: 2
      n_direct_groups: 2
      level: L1
      derived_reason: direct_evidence
      note: >-
        discordance alone does NOT withhold the level -- it falls through the L2 branch
        (n_direct_directions = 2) to the L1 branch. The NULL / 'direct_evidence_discordant' state
        needs an OPEN `conflict` row of kind 'direction', which is a curator act under PLAN.md J.4
        and which no module writes automatically.
  traceability_walk:
    whole_rehearsal_atlas:
      n_walked: 6
      n_closed: 6
      n_broken: 0
      breaks: {}
      exit_code: 0
    narrowed_to_the_new_assertion:
      n_walked: 1
      n_closed: 1
      n_broken: 0
      breaks: {}
      exit_code: 0
    note: >-
      both evidence items close the literature arm through span -> publication; the analysis arm is
      not involved, so the known dataset_unreachable gap does not arise.
  live_atlas_recounted_afterwards:
    assertion: 5
    evidence_item: 5

owner_decisions:
  - id: D1
    decision: "the sign convention on assertion.direction"
    detail: >-
      the five existing assertions have subject_type='modification', so direction='increases' reads
      as "the deletion increased the titer". L2-1's subject is the GENE, and the same value now
      reads "BAT1 increases isobutanol production", which is the opposite of what both papers
      found. (a) "the direction the perturbation moved the product" = increases, consistent with
      the five existing rows and with evidence_item.direction's documented meaning in
      assertions.py ("the comparison against the control"); drafted above. (b) "the direction of
      the subject's own effect" = decreases, the standard reading for a gene subject of an
      affects_* predicate; reads correctly in a UI, costs a re-reading of the five existing rows,
      and changes the assertion id to YAA:ASSERT:893939228cea1ef4 because direction is in
      identity().
    level_impact: none
    level_impact_detail: >-
      both were rehearsed and both return L2. assertion_level never reads assertion.direction; it
      counts COUNT(DISTINCT e.direction) over the evidence rows only. This is a display and
      semantics decision, not a level decision.
  - id: D2
    decision: "the two group slugs become permanent keys in COUNT(DISTINCT independent_group)"
    detail: >-
      group:avalos-princeton must also be the slug on doi:10.1186/s13068-019-1560-2 when that paper
      is asserted on.
  - id: D3
    decision: "whether E3 is included"
    detail: "safe either way; see rehearsal B6"
  - id: D4
    decision: "subject_type gene_group vs gene"
    detail: >-
      see why_the_subject_is_a_gene_group. gene_group is recommended on assembly grounds; it makes
      this the first assertion in the atlas whose subject is not zone R.

finding_for_whoever_owns_src:
  where: "src/fermdb/curate/assertions.py, _check_evidence, the direction-mismatch warning"
  finding: >-
    under owner decision D1 option (b) the planner emits, on BOTH evidence items, "The derived
    level will not reach L2 while both stand" -- and the view then returns L2. The warning is
    accurate when the evidence items disagree with EACH OTHER; it is misleading when they all
    agree with each other and merely differ from the assertion's own sign, because
    assertion_level does not read assertion.direction at all.
  reported_not_fixed: "src/ was out of scope this session"

curation_tasks_this_turned_up:
  - priority: 1
