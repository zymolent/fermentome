cels_2019_is_not_an_independent_group:
  publication_id: doi:10.1016/j.cels.2019.10.006
  pmid: "31734159"
  authors:
    - {name: "Kuroda K", affiliation: "Kyoto University", role: corresponding}
    - {name: "Hammer SK", affiliation: "Princeton University"}
    - {name: "Watanabe Y", affiliation: "Kyoto University"}
    - {name: "Montano Lopez J", affiliation: "Princeton University"}
    - {name: "Fink GR", affiliation: "Whitehead Institute"}
    - {name: "Stephanopoulos G", affiliation: "MIT"}
    - {name: "Ueda M", affiliation: "Kyoto University"}
    - {name: "Avalos JL", affiliation: "Princeton University", role: corresponding}
  finding: >-
    a joint Kyoto-Princeton paper with Avalos co-corresponding and Hammer an author -- the same two
    people who ARE group:avalos-princeton. A slug like group:kuroda-kyoto would read correctly for
    the first author and would let a future Princeton paper and this one count as two independent
    groups on one claim.
  assigned: group:avalos-princeton
  why_conservative: >-
    under-counting independence costs a level that later evidence can restore; over-counting mints
    an L2 out of one lab. This is owner decision D2.
  corpus_consequence: >-
    four of the eight papers in the promoted corpus are Avalos-connected. Worth knowing before
    anyone reads n_direct_groups as a measure of how well-replicated this field is.

