owner_decisions:
  - id: D1
    decision: "the sign convention -- settled, and applied here for the first time to new rows"
    detail: >-
      gene and gene_group subjects take the gene's own sign (P2, P4 decreases; P5/P6 inherit
      decreases); modification subjects take the modification's (P7, P8 increases); strain subjects
      match their evidence. no_effect (P1, P3) and NULL (P14, P15) have no sign to get wrong.
      Recorded because it is why P2 reads "ALD6 decreases isobutanol" while the already-written
      YAA:ASSERT:65a970e162e06e63 reads "ald6-delta increases isobutanol" -- two correct statements
      about two different subjects.
  - id: D2
    decision: "the group slug for doi:10.1016/j.cels.2019.10.006"
    detail: >-
      group:avalos-princeton is proposed on conservative grounds; group:kuroda-kyoto reads better
      for the first author and would allow a future double-count. See
      cels_2019_is_not_an_independent_group. Whichever is chosen becomes a permanent key in
      COUNT(DISTINCT independent_group).
  - id: D3
    decision: "what to do about Boles and BAT1"
    options:
      - "record nothing; leave the disagreement in SECOND_BATCH.md (status quo)"
      - >-
        curate the span and write P16 as a separate L5 assertion with NO conflict row. The atlas
        holds both statements, both correctly levelled, side by side.
      - >-
        curate the span, write P16 AND open a conflict of kind 'direction', which makes
        assertion_level return NULL for both and withdraws the L2 badge until someone resolves it.
    drafters_view: >-
      the middle option. The disagreement is real but its cause is visible -- Boles' background is
      Delta-ilv2 Delta-ilv1, so bat1-delta removes the last valine route and the cells cannot grow
      without valine, which is a context difference rather than a contradiction. But withdrawing an
      L2 badge is a curator act with a name attached.
  - id: D4
    decision: "whether is_bottleneck_for at L5 is worth having"
    detail: >-
      P14 and P15 are the atlas's first L5s and its first literature_assertion items. They will
      never rise above L5 on this evidence, and bottleneck.assertion_id is filled in on write, which
      is not reversible without superseding. The alternative is to leave the four bottleneck rows
      unlinked, as they are today.
  - id: D5
    decision: "P15's subject -- metabolite YAA:MET:pyruvate for the node 'pyruvate node'"
    detail: >-
      the first time a free-text bottleneck.node has been mapped to a typed row in this atlas, and
      the precedent for the other three.
  - id: D6
    decision: "whether strain-subject assertions belong in the atlas at all"
    detail: >-
      P9-P13 are five of the fifteen. from_measurement defaults to this shape, so the module
      endorses it, but a strain subject has the same ceiling as a modification subject: it is
      paper-specific and can never reach L2. They are proposed because they are the only honest
      shape for GLN3 and LPD1 today; curation_tasks item 6 is the route out.

