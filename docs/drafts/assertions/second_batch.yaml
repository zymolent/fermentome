if_the_owner_approves:
  who: >-
    build_assertion refuses an agent by design, and assertion_level does not look at zone -- so an
    agent-written zone I assertion carrying direct evidence would be graded L1 by the view. The
    write is the owner's.
  what: "13 build_assertion calls and 2 attach_evidence calls"
  suggested_order:
    - "P5, then P6 -- attach onto YAA:ASSERT:893939228cea1ef4. Level stays L2; backgrounds go 2 -> 4."
    - "P1, P2, P3, P4, P7, P8 -- the six gene_group and modification L1s"
    - "P9, P10, P12, P13 -- the strain-subject L1s. P11 only after its span is widened."
    - "P14, P15 -- last, because they write bottleneck.assertion_id as a side effect"
  do_not_write:
    - "P11 -- until its span is widened (curation_tasks priority 2)"
    - "P16 -- blocked on a missing span (curation_tasks priority 1)"
    - "P17 -- listed to be refused; ready=True is the finding, not an approval"
