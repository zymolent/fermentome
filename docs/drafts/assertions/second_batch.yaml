        independent_group: group:boles-goethe-frankfurt
        strain_id: YAA:STRAIN:jwy23
        control_strain_id: YAA:STRAIN:jwy19
        measurement_id: YAA:MEAS:a4cb6381273139ff
        measurement_label: "2.09 g/L titer"
        control_measurement_id: YAA:MEAS:f661cca85c3e05e3   # NOT a column; 1.32 g/L, JWY19
        span_id: YAA:SPAN:2e43a10d665b48fe8f4caa3b50cd2699
        span_offsets: "[29295, 29503)"
        publication_id: doi:10.1186/s13068-019-1486-8
        direction: increases
    comparator_justification: >-
      "The ald6 deletion accelerated glucose consumption and isobutanol formation and further
      increased isobutanol production up to a titer of 2.09 g/L after 96 h (Fig. b) with a yield of
      59.55 mg/g glucose in JWY23", and Fig. 7's caption lists JWY23 as JWY19's genotype plus
      Delta-ald6. The cleanest single-gene pair in the Boles series.
    caveat: >-
      carried from FIRST_BATCH.md A6: the authors note JWY19 "had obviously not reached maximal
      isobutanol titers even after 120 h" while JWY23 peaked at 96 h. Part of the gap may be timing
      rather than flux. That weakens a future effect_size and not the direction.

