    object_id: YAA:PRODUCT:isobutanol
    product_id: YAA:PRODUCT:isobutanol
    direction: decreases
    direction_note: "the gene's own role: deleting ALD6 raised the titer, so ALD6 lowers it"
    expected_level: L1
    expected_basis: direct_evidence
    evidence:
