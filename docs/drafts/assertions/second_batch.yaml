    direction: no_effect
    expected_level: L1
    expected_basis: direct_evidence
    expected_level_reason: "n_direct=1, n_direct_groups=1 -> assertion_level's L1 branch"
    evidence:
      - evidence_id: YAA:EV:961bd38a83fb6b0b
        evidence_type: direct_perturbation
        independent_group: group:boles-goethe-frankfurt
        strain_id: YAA:STRAIN:jwy03
        control_strain_id: YAA:STRAIN:jwy02
        control_condition_id: null
        measurement_id: YAA:MEAS:6f685ea5b4b553f7
        measurement_label: "0.52 g/L titer"
        control_measurement_id: YAA:MEAS:84f9fa99523b400b   # NOT a column; 0.50 g/L, JWY02
        span_id: YAA:SPAN:d221c3ccc6834044a8d37a644a05fd42
        span_offsets: "[17099, 17227)"
        publication_id: doi:10.1186/s13068-019-1486-8
        direction: no_effect
    direction_justification: >-
      "deletion of ECM31 (strain JWY03) had no statistically significant effect on isobutanol
      production (0.52 g/L, 12.69 mg/g glucose)". 0.52 > 0.50, so reading a direction off the two
      numbers would have produced `increases`. The direction is the authors' stated statistic.
    relation_to_existing: >-
      the gene-level sibling of YAA:ASSERT:f75570bed59e4456 (subject modification). Same experiment,
      same span, different subject. Worth having separately because no_effect carries no sign, so
      the gene-level reading adds a statement without adding an interpretation.
    caveat: >-
      JWY02 already carries Delta-ilv2 Delta-bdh1 Delta-bdh2 Delta-leu4 Delta-leu9, so this is "no
      effect in that background". With direction=no_effect the caveat weakens the claim rather than
      inverting it, which is why P1 is proposed and its double-deletion siblings are not.

  - key: P2
    name: "ALD6 decreases isobutanol production"
    assertion_id: YAA:ASSERT:6ab398a9829f860a
    action: build_assertion
    subject_type: gene_group
    subject_id: YAA:GG:ypl061w
    subject_label: "ALD6 / YPL061W, cytosolic aldehyde dehydrogenase, species scope, zone H"
    predicate: affects_production_of
