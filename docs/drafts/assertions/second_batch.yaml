shared_by_P12_and_P13:
  comparator_justification: >-
    "The additional disruption of the LPD1 gene in the BSW192 and BSW191 strains further activated
    isobutanol biosynthesis. The isobutanol titer of the BSW205 and BSW206 strains reached
    230 +/- 13 and 221 +/- 27 mg/L, respectively (Figure )." All four titers are from the same 48 h
    fermentation. The curated genotype spans make the pairing exact:
      BSW192  BY4741        /pATP426-kivd-ADH6-ILV2/pILV532cytM/pATP423-MAE1     94 mg/L
      BSW205  BY4741 lpd1d  /pATP426-kivd-ADH6-ILV2/pILV532cytM/pATP423-MAE1    230 mg/L
      BSW191  BY4741        /pATP426-kivd-ADH6-ILV2/pILV532cytM/pATP423-PMsM     83 mg/L
      BSW206  BY4741 lpd1d  /pATP426-kivd-ADH6-ILV2/pILV532cytM/pATP423-PMsM    221 mg/L
    Two isogenic pairs differing by lpd1-delta and nothing else.
  corrects: >-
    FIRST_BATCH.md R2 missed this: it was looking at the (since-removed) lpd1-delta modification
    row rather than at the genotype table. The suspect modification row and the mis-attributed
    1.62 g/L measurement R2 flagged have both been fixed in the atlas since.
  why_two_assertions_and_not_one: >-
    the subject is a strain and the two strains are two rows, so they hash to two assertion ids.
    That is the cost of a strain subject, stated plainly. ONE gene_group row for LPD1 (YFL018C)
    would collapse them into a single assertion with two evidence items -- still L1, one group,
    but L2-capable, which P12 and P13 never can be.



shared_by_P14_and_P15:
  why_literature_assertion_and_not_direct_perturbation: >-
    L2_BATCH.md section 4 declined is_bottleneck_for for the production assertion with the
    sentence that is also the reason it is used here: "the evidence offered is two titer
    comparisons, which measure how much isobutanol, not where the flux is limited;
    is_bottleneck_for is a claim the atlas's `bottleneck` table should carry with its own
    evidence." Both bottleneck rows have observation_type='inferred' and
    "support as reported: stated_by_authors" -- they record what the authors concluded, not a flux
    measurement.
  cost_stated_openly: >-
    these grade L5 and would still grade L5 with ten such items. Re-typing them
    direct_perturbation and re-citing the BAT1 titers would badge them L1 and then L2, which is
    the laundering route assertions.py's module docstring is written against, and is refused.
  first_of_their_kind: "the atlas's first L5s and its first use of literature_assertion"


refusal_probes:
  purpose: >-
    each was planned against the live atlas to capture the planner's own words rather than
    paraphrase them. None was built. P18..P23 are not proposals.
  probes:
  - key: P18
    what: "a Boles direct_perturbation on the BAT1 L2 (JWY05 vs JWY04)"
    plan_ready: false
    missing: ["evidence[0].measurement_id: a direct claim must cite the number it rests on"]
    note: "JWY05 has no promoted titer, and the paper reports no number. See correction_to_the_stated_route."
  - key: P19
    what: "any direct_biochemical claim"
    plan_ready: false
    missing: ["evidence[0].assay_method: which assay produced the number -- enzyme assay, isotope tracing, flux"]
  - key: P20
    what: "any correlative_omics claim"
    plan_ready: false
    missing:
      - "evidence[0].effect_size: an association with no effect size states nothing quantitative"
      - "evidence[0].p_adjusted: multiple-testing corrected, in [0, 1]"
  - key: P21
    what: "a condition perturbation (valine feeding decreases isobutanol)"
    plan_ready: false
    missing:
      - >-
        evidence[0].control_strain_id|control_condition_id: L1 requires a stated control. An
        isogenic control strain or the control condition -- either satisfies the schema, and neither
        can be inferred from the measurement
  - key: P22
    what: "a pathway_configuration claim (is_localized_to)"
    plan_ready: false
    missing:
      - >-
        subject_type: 'pathway_configuration' is not one of ['compartment', 'gene', 'gene_group',
        'metabolite', 'modification', 'part', 'pathway', 'pathway_route', 'product', 'reaction',
        'strain']
  - key: P23
    what: "the 'mitochondrial protein import' bottleneck"
    plan_ready: false
    missing: ["subject_id: the statement names no subject, so it is about nothing"]

refusals:

  boles_bat1: {see: correction_to_the_stated_route, probe: P18}

  direct_biochemical:
    scope: "the whole class, corpus-wide"
    reason: "97 of 97 measurement rows have assay_method NULL; from_measurement copies it off the row"
    probe: P19
    also: "a whole-strain titer is not a biochemical assay of an enzyme in any case (FIRST_BATCH.md R1)"
    unblock: >-
      curate assay_method (GC-FID, GC-MS, HPLC) on the measurement rows -- which unlocks nothing on
      its own, a titer stays a titer -- and then curate an ENZYME ACTIVITY measurement. The only
      paper in the corpus that measured one is doi:10.1016/j.meteno.2016.03.004 (specific activity
      of BCKAD and ACD, cytosolic vs matrix), and it has ZERO promoted measurements.

  correlative_omics:
    scope: "the whole class, and with it every route to L3"
    reason: >-
      all 8 analysis_result rows are Salmon output -- raw TPM and count matrices plus a manifest and
      a QC table, zone H. There is no `contrast` table in this schema and no differential-expression
      result anywhere, so there is no effect size and no adjusted p-value to cite. L3 additionally
      needs n_assoc_pubs >= 3; the corpus has zero.
    probe: P20
    unblock: >-
      a differential-expression run producing per-gene effect sizes and adjusted p-values, written
      as analysis_result rows. That is a processing_run, not a curation task.

  part_claims:
    scope: "all 18 part rows"
    reason: >-
      all are zone I, sixteen at confidence 'unverified', and none carries a span_id or a
      publication_id -- so literature_assertion, the only type a part claim could take, has nothing
      to cite and cannot close a J.5 arm. ai_inference would fit the zone and is refused separately:
      an agent writing an AI-inference assertion about rows an agent wrote is a closed loop with a
      badge on it.
    unblock: >-
      the part rows' `evidence` prose already quotes real papers at length (YAA:PART:adh3-native
      quotes four). Turning those quotes into `span` rows with offsets would make catalyzes,
      is_localized_to and the cofactor claims writable at L5 immediately.

  pathway_configurations:
    scope: "all 4 rows, and 2 of the 4 bottlenecks"
    reason_1: "pathway_configuration is not a subject_type (probe P22) -- recoverable on its own"
    reason_2_and_it_is_the_one_that_matters: >-
      NO TERM IN THE 17 SAYS WHAT THESE ROWS ARE FOR. The claim each supports is
      "compartmentalising the Ehrlich pathway in mitochondria outproduces the same enzymes in their
      native compartments". is_localized_to states where something sits; used here it would assert
      that an engineered pathway is in the matrix, restating the pathway_configuration row and
      adding nothing. affects_production_of needs a subject, and the subject of this claim is a
      LOCALISATION STRATEGY, which no subject_type names. Per the brief: none fits, and this moves
      on.
    unblock: >-
      either a versioned vocabulary addition under PLAN.md J.2 (not a coercion), or a pathway_route
      subject -- the atlas has 600 of them, and a mitochondrial route and a cytosolic route to the
      same product are two different rows, which is exactly the distinction the claim needs.

  double_deletions:
    scope: "gene-level claims for BDH1/BDH2, LEU4/LEU9 and GPD1/GPD2"
    reason: >-
      each modification deleted two loci at once. Asserting "LEU4 decreases isobutanol" from a
      leu4-delta leu9-delta strain attributes the joint effect to one paralog, and plan_assertion
      would return ready=True because nothing in the schema knows the modification touched two loci.
    also: "there is no gene_group row for GPD2 (YOL059W) at all"
    honest_record: "the modification-subject assertions, two of which are already written"
    unblock: >-
      single-deletion titers, which the Boles paper does not report; or a gene_group row whose
      membership is the paralog pair -- gene_group.membership_method has values other than 'anchor',
      and a two-member group is what scope and membership_method are for.

  ilv2_gene_level:
    reason: >-
      ilv2-delta raised isobutanol 22-fold in Boles (JWY0), and Matsuda OVEREXPRESSED ILV2 to raise
      it (BSW100). Both are true and not in conflict: Boles deleted the MITOCHONDRIAL Ilv2 while
      expressing the CYTOSOLIC isoform from plasmid IsoV100 -- "a low isobutanol titer of 0.01 g/L
      ... for the wt strain CEN.PK113-7D expressing the cytosolic isoforms of Ilv2, Ilv5, and Ilv3".
      A species-scope gene_group ILV2 assertion has no compartment on it, so it would pick one sign
      and be wrong about the other half of the corpus.
    already_correct: >-
      the modification-subject YAA:ASSERT:80b93f76dadaa25c is written and is right, because a
      modification carries "compartment: mitochondrial_matrix" in its details.
    unblock: "a pathway_route subject, as in refusals.pathway_configurations"

  meteno_2016:
    reason: >-
      YAA:MOD:a89fb362fc39d454 and YAA:MOD:549819c3e9e779f7 both have strain_id NULL, and
      direct_perturbation requires strain_id. The paper has ZERO promoted measurements.
    unblock: "the paper's enzyme-activity numbers (refusals.direct_biochemical) plus a strain on each modification"

  kivd_bsw191:
    reason: >-
      FIRST_BATCH.md R3's refusal stands and gains a second reason. R3 said BSW100 also carries
      kivd; the genotype spans now show BSW191 and BSW100 differ by TWO things, the pATP423-PMsM
      shunt plasmid AND pILV532cytM. Not an isogenic pair on any reading.
    unblock: >-
      the transhydrogenase-shunt modification row R3 asked for, and a control differing by it alone
      -- which in this paper is the BSW192/BSW205 series, not BSW100.

  untypeable_bottlenecks:
    - id: YAA:BNK:431c48b1e633a585
      node: "mitochondrial protein import"
      reason: "no transport reaction, part or gene group is mitochondrial protein import"
      probe: P23
      unblock: "a reaction or pathway_route_step row for the TOM/TIM translocation step"
    - id: YAA:BNK:e86745216bd648b4
      node: "compartment choice for the Ehrlich pathway"
      reason: >-
        not an entity at all; it is refusals.pathway_configurations in a different table. Mapping it
        to YAA:PWY:isobutanol-valine-ehrlich would assert about the pathway what the row says about
        the choice of where to put it.
      unblock: "the pathway_route pair"

  condition_contrasts:
    scope: "every same-strain condition contrast in the corpus"
    reason: "`condition_context` holds 0 rows"
    probe: P21
    what_is_lost:
      - "valine feeding vs valine-free in SHy16, SHy24, SHy54, SHy55, SHy62 (five promoted percent-change rows)"
      - "xylose vs glucose in YZy197 (2.05 vs 1.07 g/L isobutanol; 0.91 vs 0.68 g/L 2-MbOH)"
      - "YPD vs YNB and 100 vs 150 g/L glucose in IbOH-1bat1-delta"
      - "every medium comparison in doi:10.1016/j.jbiotec.2022.09.012"
    why_not_control_strain_id: >-
      a same-strain contrast cannot name a control STRAIN. Putting the test strain in
      control_strain_id would make the row claim the strain is its own isogenic control -- false,
      and resolving cleanly, which is the worst combination.
    unblock: >-
      condition_context rows. The single highest-leverage curation this sweep found after the
      correction. They also fix assertion.context_id, NULL on all 15 proposals for the same reason,
      and they are what would let P4's caveat, refusals.ilv2_gene_level and the BAT1-overexpression
      refusal be stated ON THE ROW instead of in a document.

  jbiotec_2022:
    scope: "the entire paper -- 4 candidate pairs, 12 promoted measurements, 0 assertable"
    group_if_it_were: group:yang-konkuk
    reason_1: >-
      every direction inverts between media. ptsG deletion: "Isobutanol content decreased from
      5.18 g/L to 1.26 g/L in the 1:0 medium; however, it increased from 1.76 g/L to 2.79 g/L in the
      1:1 medium." glf/glk overexpression: "HJ04 showed a lower isobutanol titer than the control in
      0:1 and 1:1 media. However, HJ04 ... showed increased isobutanol production in the 1:0
      medium." A direction is only meaningful with the medium attached, and there is nowhere to
      attach it. Picking one medium would state a fact and imply a falsehood.
    reason_2_a_data_bug: >-
      the paper's controls are the empty-vector strains HJ03::pRSFDuet-1 and HM501::pRSFDuet-1, both
      of which have strain rows -- but the 1.26 g/L and other control titers are curated onto the
      bare YAA:STRAIN:hj03. Worse, YAA:STRAIN:hm501-prsfdeut-1 and YAA:STRAIN:hm501-prsfduet-1 are
      TWO ROWS FOR ONE STRAIN, differing by the paper's own typo ("Deut" for "Duet"), with
      measurements curated onto both (2.5 g/L on the first; 1.98, 5.18 and 1.76 g/L on the second).
      REPORTED, NOT TOUCHED -- data/ is not mine this session.
    unblock: "condition_context rows for the four media, and a merge of the two HM501 rows with a strain_alias"

  jwy04_ilv1:
    reason: >-
      0.56 vs JWY03's 0.52 g/L. The span says only "Maximum isobutanol titers of 0.56 g/L
      (13.54 mg/g glucose) were reached with strain JWY04 after interrupting the isoleucine
      biosynthesis pathway by deletion of ILV1", with NO statistic, on a series where the
      immediately preceding 0.02 g/L step was explicitly declared not significant. There is also no
      modification row for ilv1-delta and no gene_group for ILV1. Reading `increases` off
      0.52 -> 0.56 is inventing a direction.

  bat1_overexpression:
    strains: [SHy18, SHy30, SHy21]
    reason: >-
      "To enhance the ValC-dependent pathway, we overexpressed BAT1 ... BAT1 (SHy18) leads to a
      3-fold increase in isobutanol production." Same paper as the L2's E1, and the gene-level sign
      is the OPPOSITE: overexpressing BAT1 raises isobutanol via the valine route, deleting it
      raises isobutanol far more via the KIV route. The authors treat these as two pathway
      configurations, not a contradiction. With context_id NULL an `increases` assertion would be a
      bare contradiction of the atlas's only L2, from the same group and the same figure.
    note: "the strongest argument in this batch for curating condition_context"

  shy84_complementation:
    reason: >-
      "We confirmed that deletion of BAT1 alone is sufficient to confer this large increase in
      isobutanol production by complementing the bat1-delta strain (SHy24) with a single copy of
      BAT1 under the control of its native promoter and terminator in a centromeric plasmid
      (pSH48), which resulted in a strain (SHy84) with isobutanol titers that decreased back to wild
      type levels (Supplementary Fig. 2)." The textbook control for the entire BAT1 claim, and NOT
      curatable as evidence: SHy84's titer is in Supplementary Fig. 2 and has no measurement row.
    unblock: "one measurement. The second-highest-value curation this sweep found."

