# The second assertion batch, as a proposal. NOTHING HERE HAS BEEN WRITTEN.
#
# The argument for every entry is in docs/drafts/assertions/SECOND_BATCH.md; this file is the
# machine-readable half and is deliberately not self-justifying.
#
# Fields you will not find, on purpose, and the same two as first_batch.yaml and l2_batch.yaml:
#   * `level` -- there is no such column. `assertion_level` derives it. `expected_level` below is a
#     prediction plus the rule it follows, checked by an in-memory rehearsal, never a value written.
#   * `effect_size` -- every cited number is a titer, a fold-change in titer, or a tolerance
#     reading. None is an effect this atlas may put a number on. Left NULL together with
#     effect_unit / effect_ci_low / effect_ci_high / effect_n on all 15.
#
# One field that is here and is NOT a column: `control_measurement_id`, carried for the reader
# exactly as both prior files carried it. `evidence_item` has no such column; PLAN.md J.3 requires a
# stated control (control_strain_id or control_condition_id), not a second number.

