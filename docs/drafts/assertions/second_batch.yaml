    why_it_matters: >-
      the second negative result in the atlas, and the one that gives the BAT1 L2 its meaning: same
      lab, same panel, same fermentation, and the paralog does nothing. A reader who sees only
      "BAT1 decreases isobutanol" cannot tell whether the BCAT family matters or whether THIS BCAT
      does.
    curation_note: >-
      no single span covers the claim. The measurement's span is the fragment [31228, 31273)
      "(35 +/- 12 mg/L) remains approximately the same"; the strain is named in the adjacent
      [31168, 31205) "BAT2 is deleted in CEN.PK2-1C (SHy25)". The claim sentence is [31168, 31325)
