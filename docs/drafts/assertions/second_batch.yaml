      - evidence_id: YAA:EV:e2064aed4f90d21b
        evidence_type: direct_perturbation
        independent_group: group:avalos-princeton
        strain_id: YAA:STRAIN:shy52
        control_strain_id: YAA:STRAIN:shy23
        measurement_id: YAA:MEAS:8a9253889e3ae2ff
        measurement_label: "2.2, fold_increase_in_isobutanol_titer_with_valine"
        span_id: YAA:SPAN:0c1d0a5ba1dd446dbbc29a562137dd4b
        span_offsets: "[36786, 36847)"
