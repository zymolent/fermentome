        span_offsets: "[31228, 31273)"
        publication_id: doi:10.1016/j.ymben.2017.10.001
        direction: no_effect
    comparator_justification: >-
      "When BAT2 is deleted in CEN.PK2-1C (SHy25) isobutanol production (35 +/- 12 mg/L) remains
      approximately the same as in the wild type control (42 +/- 11 mg/L), (SHy23), (Fig. 3b)."
