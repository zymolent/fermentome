correction_to_the_stated_route:
  what_was_asked: >-
    curate the JWY05 / JWY06 / JWY07 titers so that group:boles-goethe-frankfurt becomes a THIRD
    independent group on YAA:ASSERT:893939228cea1ef4 (BAT1). Stated in the task and in
    L2_BATCH.md section 7 item 4.
  finding: "the premise is wrong in sign. Boles CONTRADICTS the BAT1 claim, and reports no number."
  evidence:
    - offsets: "[17550, 17687)"
      quote: >-
        Since it was necessary to inoculate the pre-cultures in SCD media without valine,
        Bat1/2-deficient strain JWY07 with its blocked valine biosynthesis was not able to grow to a
        sufficient OD for fermentation experiments.
      means: "JWY07 was never fermented. It has no titer because the experiment could not be run."
    - offsets: "[17687, 17874)"
      quote: >-
        However, even slight reductions of the valine synthesis by deleting only BAT1 (JWY05) or
        BAT2 (JWY06) had negative effects on growth in media without valine and on isobutanol
        production, in contrast to other work [].
      means: >-
        JWY05 and JWY06 were measured and the direction is the OPPOSITE of the L2's. No number is
        given for either strain, so there is nothing to promote as a `measurement` even today.
        "in contrast to other work" is Boles naming the disagreement with Hammer and Avalos.
  rehearsed_what_if:
    method: >-
      a SYNTHETIC measurement row (id YAA:MEAS:SYNTHETIC-REHEARSAL-JWY05, value_as_reported -1.0,
      unit_as_reported 'SYNTHETIC') was inserted into a :memory: copy for the sole purpose of
      letting assertion_level count a third group. No titer is claimed for JWY05 anywhere.
    before:            {n_evidence: 2, n_direct: 2, n_direct_groups: 2, level: L2, reason: direct_evidence_replicated}
    after_decreases:   {n_evidence: 3, n_direct: 3, n_direct_groups: 3, level: L1, reason: direct_evidence}
    after_increases:   {n_evidence: 3, n_direct: 3, n_direct_groups: 3, level: L2, reason: direct_evidence_replicated}
    conclusion: >-
      curating a Boles bat1 titer as a third direct evidence item would DEMOTE the atlas's only L2
      to L1. n_direct_directions rises to 2 and assertion_level's L2 branch requires <= 1, so the
      row falls through to the L1 branch. The view is working correctly.
  replaces: "L2_BATCH.md section 7 item 4, which should be struck"
  right_action_instead: >-
    curate a `span` over [17687, 17874) and consider a `conflict` row of kind 'direction'. See
    proposals P16/P17 and owner_decisions D3.

findings_for_whoever_owns_src:
  - where: "src/fermdb/curate/assertions.py :: attach_evidence"
    finding: >-
      attach_evidence does not warn on a discordant direction. It calls _check_evidence and
      discards the warnings (`missing, blockers, _ = _check_evidence(...)`), and
      _check_evidence_agrees_with_itself is only ever called from plan_assertion over a request
      carrying ALL the evidence. attach_evidence reconstructs an AssertionRequest holding only the
      one new item, so the "items disagree with each other" check has nothing to compare. The
      demotion rehearsed above happened in silence, on the exact path a curator will take.
    reported_not_fixed: "src/ was out of scope this session"
  - where: "src/fermdb/curate/assertions.py :: _check_evidence_references"
    finding: >-
      plan_assertion cannot tell whether a span STATES the claim. P17 cites
      YAA:SPAN:6c4ab8fe017445d3b62abba5e2439b33, the JWY05 genotype table row
      ('JWY05 | Delta-ilv2; Delta-bdh1; ...; Delta-bat1'), which says nothing about isobutanol, and
      the planner returns ready=True. The span belongs to the right publication, which is all the
      reference check can verify. A correctly-resolving citation to a sentence that does not
      contain the claim is what traceability.py calls worse than one that does not resolve.
    reported_not_fixed: "src/ was out of scope this session"

