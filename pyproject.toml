[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fermdb"
version = "0.0.1"
description = "Isobutanol strain-engineering decision-support atlas"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",  # env/paths.yaml, vocabularies, benchmark set
    "pypdf>=4",   # text from the PDFs the owner supplies via the manual download queue
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
# The escalation tier (MODEL_ROUTING.md §7a). Optional rather than required: fermdb runs fully
# without it — `agent-sdk` is one of four providers and the others need nothing — and the import
# raises ProviderUnavailableError with the install line when it is missing. It is declared here
# because it was previously undeclared and undiscoverable: the 2026-09-21 calibration found the
# package simply absent, on a code path no run had ever reached.
escalation = ["claude-agent-sdk>=0.1"]

[project.scripts]
fermdb = "fermdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py files read at runtime from beside their modules. Without this a wheel installs without
# them and load_prompt() / open_db() fail with FileNotFoundError — it works today only because
# pytest uses pythonpath=["src"] and installs are from source.
[tool.setuptools.package-data]
"fermdb.db" = ["*.sql"]
"fermdb.extract" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `docs/drafts/calibration/raw/` holds the scripts exactly as they were run, beside the output
# they produced. They are an artifact, not source: their value is that a later reader can re-run
# the identical thing and get the identical numbers. Reformatting them to satisfy a linter would
# quietly edit the record of what was actually executed -- so they are excluded rather than fixed.
# Until this exclude, `ruff check .` and `ruff format --check .` had been red since 0dc42e7
# (2026-09-21) on 14 errors in three files, which is long enough that the lint gate had stopped
# meaning anything.
exclude = ["docs/drafts/calibration/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# This module embeds a complete web page as a template string. Its CSS, HTML and JavaScript are
# not Python and do not benefit from Python's line-length rule -- wrapping a template literal or a
# CSS selector list to 100 columns makes it harder to read, not easier. The Python around the
# template is still held to the same standard by every other rule.
"src/fermdb/query/reviewhtml.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# `claude-agent-sdk` is an OPTIONAL dependency (the `escalation` extra), so whether it is importable
# depends on the environment mypy runs in — and an inline `# type: ignore[import-not-found]` is
# therefore correct in a clean checkout and "unused" wherever the extra is installed. Under
# `strict = true` that flips the error on and off with the environment rather than with the code,
# which is the one thing a type gate must not do. Declaring the module here is right in both.
[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_missing_imports = true
