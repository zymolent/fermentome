name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Format check with ruff
        run: ruff format --check .
      - name: Type check with mypy
        run: mypy
      - name: Run tests
        run: python -m pytest

      # PLAN.md J.5: "a script walks every active assertion and fails if any one of them cannot
      # produce a complete chain. It runs in CI. An assertion without a chain is a bug of the
      # same severity as a failing unit test." These two steps are that script.
      #
      # THE GATE. CI has no atlas and never will have one -- the sqlite file is derived-tier and
      # is not committed -- so the only active assertions that exist in a clean checkout are the
      # four in the phase-0 fixture. Walking them is therefore the only way this gate can walk a
      # row at all, and until the fixture carried its curation events it could not: this step used
      # to be `continue-on-error: true` while a separate step gated on an empty temp database with
      # `--allow-empty`, which is a green tick that has verified nothing. That step is gone and
      # this one is the gate.
      #
      # Exit codes, and why there is no `--allow-empty` here. The walk has three outcomes, not
      # two: 0 every active assertion closed and there was at least one, 1 something broke, 3
      # (EXIT_VACUOUS) nothing was walked. A fixture that closes four chains cannot hit 3, so the
      # exemption has nothing left to excuse and omitting it costs nothing today -- and buys the
      # case it exists for: if the fixture is ever emptied, renamed or silently skipped by the
      # loader, this step exits 3 and goes red instead of passing because it found nothing. That
      # is the failure mode that hid `no_curation_event` for the whole of phase 0.
      - name: Traceability walk over the phase-0 fixture (PLAN.md J.5 gate)
        env:
          FERMDB_DB_FILE: ${{ runner.temp }}/fixture-atlas.sqlite3
        run: |
          python -c "import os, pathlib; from fermdb.db import open_db; from fermdb.db.fixture import load_fixture; c = open_db(os.environ['FERMDB_DB_FILE']); load_fixture(c, pathlib.Path('tests/fixtures/mini_atlas')); c.commit(); c.close()"
          python -m fermdb.cli query traceability --verbose

      # The other half of the exit-code contract, asserted rather than assumed: a fresh, empty
      # atlas must report VACUOUS (3) and NOT success, and `--allow-empty` must be what turns it
      # into 0. tests/test_traceability.py proves that about `exit_code()`; this proves the CLI
      # actually propagates it as a process status, which is the only form CI can read. The old
      # vacuous gate is what this replaces -- same empty database, but now the emptiness is the
      # thing under test instead of the thing being excused.
      - name: An empty atlas reports VACUOUS, not success
        env:
          FERMDB_DB_FILE: ${{ runner.temp }}/empty-atlas.sqlite3
        run: |
          python -c "import os; from fermdb.db import open_db; open_db(os.environ['FERMDB_DB_FILE']).close()"
          # `|| status=$?` and not `; status=$?`: the default shell here is `bash -e`, which would
          # abort the step on the non-zero exit this step is specifically trying to read.
          status=0
          python -m fermdb.cli query traceability --verbose || status=$?
          test "$status" -eq 3 || { echo "::error::expected EXIT_VACUOUS=3 from an empty atlas, got $status"; exit 1; }
          python -m fermdb.cli query traceability --allow-empty --verbose
